<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奥德赛 · 地中海 — 无名旅人的航程</title>
<link rel="icon" type="image/png" sizes="256x256" href="concept-art/brand/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="concept-art/brand/favicon-32.png">
<link rel="apple-touch-icon" href="concept-art/brand/favicon.png">
<style>
  :root{
    --bg:#0b1526; --panel:#ffffff; --line:#e3eaf2; --ink:#243244; --sub:#7b8aa0;
    --blue:#3b82f6; --blue-soft:#eaf2fe; --blue-ink:#2563eb; --deep:#1e3a5f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; font-size:14px;
    height:100vh; display:flex; align-items:center; justify-content:center;}
  #stage{position:relative; width:min(96vw, calc(94vh * 5 / 3)); aspect-ratio:5/3; max-width:1200px;}
  canvas{width:100%; height:100%; display:block; border-radius:14px; box-shadow:0 12px 44px rgba(0,0,0,.5);}
  .hud{position:absolute; top:12px; left:12px; right:12px; display:flex; gap:8px; align-items:center; pointer-events:none;}
  .hud .pill{pointer-events:auto; background:rgba(255,255,255,.92); border:1px solid var(--line);
    border-radius:20px; padding:5px 13px; font-size:12.5px; color:var(--deep); box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .hud .pill b{color:var(--blue-ink);}
  .hud .spacer{flex:1;}
  .hud button{pointer-events:auto; cursor:pointer; border:1px solid var(--line); background:rgba(255,255,255,.92);
    color:var(--sub); border-radius:20px; padding:5px 12px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .hud button:hover{color:var(--blue-ink); border-color:var(--blue);}
  #hint{position:absolute; transform:translate(-50%,-100%); background:rgba(20,32,48,.88); color:#fff;
    padding:6px 12px; border-radius:9px; font-size:12.5px; white-space:nowrap; pointer-events:none;
    box-shadow:0 4px 12px rgba(0,0,0,.3); display:none;}
  #hint b{color:#9ec5ff;}
  #ambient{position:absolute; transform:translate(-50%,-100%); background:#fff; color:var(--ink);
    border:1px solid var(--line); padding:7px 12px; border-radius:10px; font-size:12.5px; max-width:230px;
    line-height:1.5; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.22); display:none;}
  #toast{position:absolute; bottom:18%; left:50%; transform:translateX(-50%); background:rgba(20,32,48,.9);
    color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none;}
  #bagPanel{position:absolute; top:52px; right:12px; width:230px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.3); z-index:5;}
  #bagPanel h3{font-size:12px; color:var(--sub); margin-bottom:8px; letter-spacing:1px;}
  #bagPanel .it{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px dashed #eef2f7;}
  #bagPanel .it:last-child{border-bottom:none;}
  #bagPanel .it b{color:var(--blue-ink);}
  #dlg{position:absolute; left:2%; right:2%; bottom:2.5%; height:46%; background:var(--panel);
    border-radius:14px; border:1px solid var(--line); box-shadow:0 14px 44px rgba(0,0,0,.4);
    display:none; flex-direction:row; overflow:hidden; z-index:6;}
  #dlg.open{display:flex;}
  #dlgPortrait{flex:none; width:15%; border-right:1px solid var(--line); position:relative;
    background:url('concept-art/characters/02-喀耳刻.jpg') center 15%/cover no-repeat;}
  #dlgPortrait::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0) 52%, #ffffff 97%);}
  #dlg .dlgmain{flex:1; display:flex; flex-direction:column; min-width:0;}
  #dlg .head{display:flex; align-items:center; gap:9px; padding:9px 14px; border-bottom:1px solid var(--line);}
  #dlg .head .dot{width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#dbeafe,#ede9fe);
    display:flex; align-items:center; justify-content:center;}
  #dlg .head .t{font-weight:600; font-size:13.5px; color:var(--deep);}
  #dlg .head .s{font-size:11px; color:var(--sub);}
  #dlg .head .x{margin-left:auto; cursor:pointer; color:var(--sub); border:none; background:none; font-size:15px; padding:2px 8px;}
  #dlg .head .x:hover{color:var(--ink);}
  #msgs{flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; gap:8px; align-items:flex-start;}
  .row.me{flex-direction:row-reverse;}
  .row .who{font-size:10.5px; color:var(--sub); margin-bottom:2px;}
  .row .col{max-width:78%; display:flex; flex-direction:column; gap:3px;}
  .row.me .col{align-items:flex-end;}
  .bubble{padding:8px 12px; border-radius:11px; line-height:1.6; white-space:pre-wrap; word-break:break-word; font-size:13px;}
  .bubble.witch{background:#f7f9fd; border:1px solid var(--line); border-top-left-radius:3px;}
  .bubble.me{background:var(--blue); color:#fff; border-top-right-radius:3px;}
  .chips{display:flex; flex-wrap:wrap; gap:4px;}
  .chip{font-size:10.5px; background:var(--blue-soft); color:var(--blue-ink);
    border:1px solid #d4e4fd; border-radius:20px; padding:1px 8px;}
  .chip.err{background:#fef2f2; color:#b91c1c; border-color:#fecaca;}
  #samples{display:flex; gap:5px; flex-wrap:wrap; padding:6px 14px 0;}
  #samples button{border:1px solid var(--line); background:#fbfcfe; color:var(--sub);
    border-radius:14px; padding:3px 10px; font-size:11.5px; cursor:pointer;}
  #samples button:hover{border-color:var(--blue); color:var(--blue-ink); background:var(--blue-soft);}
  #dlg .inputrow{display:flex; gap:7px; padding:8px 14px 11px;}
  #inp{flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 11px; font-size:13px; outline:none; font-family:inherit;}
  #inp:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft);}
  #sendBtn{border:none; background:var(--blue); color:#fff; border-radius:9px; padding:0 16px; font-size:13px; cursor:pointer;}
  #sendBtn:disabled{opacity:.5;}
  #keys{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.6);
    font-size:11px; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.6);}
  #zone{position:absolute; top:44px; left:50%; transform:translateX(-50%); pointer-events:none;
    color:rgba(255,255,255,.75); font-size:12px; letter-spacing:2px; text-shadow:0 1px 4px rgba(0,0,0,.5);}
  /* ---- 受击反馈 ---- */
  #hitFlash{position:absolute; inset:0; border-radius:14px; pointer-events:none; z-index:9;
    background:radial-gradient(ellipse at center, rgba(190,28,28,0) 52%, rgba(190,28,28,.5) 100%);
    opacity:0; transition:opacity .55s;}
  .shake{animation:shakeX .3s;}
  @keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  /* ---- 标题屏（概念图 01-序章漂流） ---- */
  #titleScreen{position:absolute; inset:0; z-index:20; border-radius:14px; overflow:hidden;
    background:#0b1526 url('concept-art/01-序章漂流.jpg') center/cover no-repeat;
    transition:opacity .8s;}
  #titleScreen.hide{opacity:0; pointer-events:none;}
  #titleScreen::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,14,26,.30) 0%, rgba(6,14,26,0) 34%, rgba(6,14,26,.74) 100%);}
  .tsBody{position:absolute; left:9%; bottom:11%; z-index:2; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.55);}
  .tsKicker{font-size:12px; letter-spacing:5px; color:rgba(255,255,255,.78); margin-bottom:10px;}
  .tsBody h1{font-family:Georgia,"Times New Roman","宋体",SimSun,serif; font-size:52px; line-height:1;
    font-weight:700; letter-spacing:10px;}
  .tsBody h1 span{font-size:17px; letter-spacing:6px; vertical-align:14px; margin-left:10px; color:rgba(255,255,255,.85);}
  .tsSub{margin:14px 0 26px; font-size:14px; color:rgba(255,255,255,.86); letter-spacing:2px;}
  .tsBtns{display:flex; gap:10px;}
  #tsGo{border:none; background:#fff; color:#16324e; font-size:15px; font-weight:600; letter-spacing:3px;
    padding:11px 34px; border-radius:26px; cursor:pointer; box-shadow:0 6px 22px rgba(0,0,0,.35);}
  #tsGo:hover{transform:translateY(-1px); box-shadow:0 10px 26px rgba(0,0,0,.45);}
  #tsNew{border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.12); color:#fff; font-size:13px;
    padding:11px 22px; border-radius:26px; cursor:pointer;}
  #tsNew:hover{background:rgba(255,255,255,.22);}
  .tsTip{margin-top:30px; font-size:11px; line-height:1.8; color:rgba(255,255,255,.55);}
  /* ---- 章节过场（概念图 02-女巫小屋） ---- */
  #chapterCard{position:absolute; inset:0; z-index:18; border-radius:14px; overflow:hidden; cursor:pointer;
    background:#0b1526 center/cover no-repeat; opacity:0; pointer-events:none; transition:opacity .55s;}
  #chapterCard.show{opacity:1; pointer-events:auto;}
  #chapterCard::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,14,26,.12) 0%, rgba(6,14,26,0) 40%, rgba(6,14,26,.78) 100%);}
  .ccBody{position:absolute; left:9%; bottom:13%; z-index:2; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.6);}
  .ccKicker{font-size:11px; letter-spacing:6px; color:#ffd66b; margin-bottom:8px;}
  .ccTitle{font-family:Georgia,"Times New Roman","宋体",SimSun,serif; font-size:38px; letter-spacing:8px; font-weight:700;}
  .ccSub{margin-top:10px; font-size:13px; color:rgba(255,255,255,.85); letter-spacing:2px;}
  .ccQuote{margin-top:16px; font-size:12px; color:rgba(255,255,255,.62); letter-spacing:1px;}
  .ccSkip{position:absolute; right:14px; bottom:10px; z-index:2; font-size:11px; color:rgba(255,255,255,.5);}
  /* ---- 海图浮层（M 键 · 仿古羊皮纸世界海图 + 船位/岛屿状态叠加） ---- */
  #mapOverlay{position:absolute; inset:0; z-index:15; border-radius:14px; display:none;
    background:rgba(6,12,22,.72); backdrop-filter:blur(3px);}
  #mapOverlay.open{display:flex; align-items:center; justify-content:center;
    animation:mapIn .28s ease-out;}
  @keyframes mapIn{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);}}
  #mapBoard{position:relative; width:92%; aspect-ratio:3200/1340; border-radius:10px; overflow:hidden;
    background:#1a1410; box-shadow:0 18px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12);}
  #mapBoard img{width:100%; height:100%; object-fit:fill; display:block;}
  #mapBoard::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,20,36,.16), rgba(10,20,36,0) 30%, rgba(10,20,36,0) 70%, rgba(10,20,36,.22));}
  .mapMark{position:absolute; transform:translate(-50%,-100%); text-align:center; pointer-events:none; z-index:2;}
  .mapMark .pin{width:11px; height:11px; border-radius:50%; margin:0 auto 3px;
    background:#e8a84a; box-shadow:0 0 0 2.5px rgba(255,255,255,.75), 0 2px 8px rgba(0,0,0,.5);}
  .mapMark.locked .pin{background:rgba(210,220,232,.55); box-shadow:0 0 0 2px rgba(255,255,255,.4);}
  .mapMark .nm{font-size:11px; letter-spacing:1px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.8); white-space:nowrap;}
  .mapMark.locked .nm{color:rgba(255,255,255,.55);}
  .mapMark .st{font-size:9.5px; color:rgba(255,255,255,.5); text-shadow:0 1px 3px rgba(0,0,0,.7);}
  #mapBoat{position:absolute; transform:translate(-50%,-50%); z-index:3; pointer-events:none;}
  #mapBoat i{display:block; width:13px; height:13px; border-radius:50%; background:#4ea1ff;
    border:2.5px solid #fff; box-shadow:0 0 10px rgba(78,161,255,.95); animation:boatPulse 1.6s ease-in-out infinite;}
  @keyframes boatPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}
  #mapHead{position:absolute; top:12px; left:0; right:0; z-index:4; display:flex; align-items:center;
    justify-content:center; gap:14px; pointer-events:none;}
  #mapHead .t{font-family:Georgia,"宋体",serif; font-size:17px; letter-spacing:6px; color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.65);}
  #mapHead .lg{display:flex; gap:12px; font-size:10.5px; color:rgba(255,255,255,.78); text-shadow:0 1px 3px rgba(0,0,0,.6);}
  #mapHead .lg i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:-1px;}
  #mapClose{position:absolute; right:14px; top:12px; z-index:5; font-size:11px; color:rgba(255,255,255,.65);
    border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.25); border-radius:14px; padding:3px 12px; cursor:pointer;}
  #mapClose:hover{color:#fff; border-color:rgba(255,255,255,.6);}
  /* ---- 塞壬歌词卡（绑栈听的分享时刻：可导出） ---- */
  #lyricCard{position:absolute; inset:0; z-index:16; border-radius:14px; display:none;
    align-items:center; justify-content:center; background:rgba(6,12,22,.75); backdrop-filter:blur(3px);}
  #lyricCard.open{display:flex; animation:mapIn .3s ease-out;}
  #lyricSheet{width:min(520px,84%); background:linear-gradient(170deg,#f4ead2,#e8d9b8); border-radius:10px;
    padding:26px 30px 20px; box-shadow:0 18px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.25);
    font-family:Georgia,"宋体",serif; color:#4a3a22;}
  #lyricSheet h3{font-size:13px; letter-spacing:5px; color:#8a6a3a; text-align:center; margin-bottom:14px;}
  #lyricText{font-size:14.5px; line-height:2.05; white-space:pre-wrap; text-align:center;}
  #lyricBtns{display:flex; gap:10px; justify-content:center; margin-top:18px;}
  #lyricBtns button{border:1px solid #c9b58a; background:rgba(255,255,255,.4); color:#6a5330;
    border-radius:16px; padding:6px 16px; font-size:12px; cursor:pointer; font-family:inherit;}
  #lyricBtns button:hover{background:#fff;}
  /* ---- 任务日志面板 ---- */
  #questPanel{position:absolute; top:52px; right:12px; width:250px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.3); z-index:5;}
  #questPanel h3{font-size:12px; color:var(--sub); margin-bottom:8px; letter-spacing:1px;}
  #questPanel .q{padding:6px 0; border-bottom:1px dashed #eef2f7; font-size:12.5px; line-height:1.55;}
  #questPanel .q:last-child{border-bottom:none;}
  #questPanel .q b{color:var(--blue-ink);}
  #questPanel .q .bar{display:block; height:6px; background:#e8eef5; border-radius:3px; margin-top:4px; overflow:hidden;}
  #questPanel .q .bar i{display:block; height:100%; background:#7c6fd0; border-radius:3px;}
  #questPanel .q.done{color:#9aa7b8;}
  #questPanel .q.done b{color:#7f8c99; text-decoration:line-through;}
  #questPanel .empty{color:#b6c2d2; font-size:12px;}
  /* ---- 风神岛立绘兜底（保留：立绘加载失败时仍可用） ---- */
  .aeolusPortrait{background:linear-gradient(160deg,#dfe8f2 0%,#a8bed4 38%,#5d7fa3 72%,#2c4a68 100%) !important;}
  .aeolusPortrait::before{content:""; position:absolute; inset:0; z-index:1; opacity:.5;
    background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150"><g fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" opacity=".85"><path d="M12 30 q14 -9 28 0 q13 8 26 0"/><path d="M20 52 q13 -8 25 0 q12 7 24 0"/><path d="M14 76 q15 -9 29 0 q13 8 26 0"/><path d="M24 100 q12 -7 23 0 q11 6 22 0"/><path d="M16 124 q14 -8 27 0 q12 7 25 0"/></g></svg>') center/70% no-repeat;}
  /* ==== 动效标定（animate/review-animations：只动 transform+opacity、ease-out、UI<300ms、可中断） ==== */
  @keyframes dlgIn{from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:none;}}
  #dlg.open{animation:dlgIn .24s cubic-bezier(0.23,1,0.32,1);}
  @keyframes bubbleIn{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;}}
  #dlg .bubble{animation:bubbleIn .18s ease-out;}
  .hud button:active, #samples button:active, .tsBtns button:active, #lyricBtns button:active{transform:scale(.97);}
  #toast{transition:opacity .25s ease-out;}
  /* 海图打开时收起 HUD/按键条（game-ui-ux：一层一事，浮层不与常驻层打架） */
  .hud, #zone, #keys{transition:opacity .2s ease-out;}
  #stage.mapOpen .hud, #stage.mapOpen #zone, #stage.mapOpen #keys{opacity:0; pointer-events:none;}
  /* 记忆流可视化（对话头部：NPC 记得你的事，点开展开） */
  #dlg .head .mem{margin-left:auto; cursor:pointer; border:1px solid var(--line); background:#fbfcfe; color:var(--sub);
    border-radius:12px; font-size:10.5px; padding:2px 9px;}
  #dlg .head .mem:hover{color:var(--blue-ink); border-color:var(--blue);}
  #memStrip{display:none; flex-wrap:wrap; gap:4px; padding:7px 14px 0; border-bottom:1px dashed var(--line);}
  #memStrip .chip{max-width:100%; white-space:normal; line-height:1.5;}
  /* 航程闭环：海图目标脉动 + HUD 航向 + 终章结算卡 */
  .mapMark.next .pin{background:#ffd66b; box-shadow:0 0 0 2px rgba(255,214,107,.35), 0 0 12px 3px rgba(255,214,107,.55); animation:pulseNext 1.6s ease-in-out infinite;}
  .mapMark.next .st{color:#ffd66b;}
  @keyframes pulseNext{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
  #hudCompass{background:#f2f8ff; border:1px solid #bcd6ee; color:#0f4c81; font-size:11px;}
  #endingCard{position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:linear-gradient(175deg,#0d1b2c 0%,#16283e 45%,#0d1b2c 100%); border-radius:14px; overflow:hidden;}
  #endingCard.show{display:flex; animation:ecIn .6s cubic-bezier(.23,1,.32,1);}
  @keyframes ecIn{from{opacity:0}to{opacity:1}}
  .ecBody{width:min(640px,86%); max-height:88%; overflow:auto; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    border-radius:18px; padding:34px 38px; backdrop-filter:blur(10px); color:#e9eef5;}
  .ecKicker{font-size:11px; letter-spacing:6px; color:#ffd66b; margin-bottom:10px; text-align:center;}
  .ecTitle{font-size:26px; letter-spacing:10px; text-align:center; font-weight:700; margin-bottom:18px;}
  .ecPara{font-size:13.5px; line-height:1.9; color:#cfdcea; margin:0 0 12px; text-indent:2em;}
  .ecStats{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:16px 0 20px;}
  .ecStats .stx{border:1px solid rgba(255,255,255,.16); border-radius:10px; padding:6px 12px; font-size:11.5px; color:#aebfd4;}
  .ecStats .stx b{color:#ffd66b;}
  .ecBtns{display:flex; gap:12px; justify-content:center;}
  .ecBtns button{cursor:pointer; border:none; border-radius:22px; padding:9px 26px; font-size:13px; font-weight:600; letter-spacing:2px;}
  .ecBtns .go{background:#ffd66b; color:#16324e;}
  .ecBtns .re{background:transparent; border:1px solid rgba(255,255,255,.3); color:#cfdcea;}
  .ecBtns button:hover{transform:translateY(-1px);}
  @media (prefers-reduced-motion: reduce){
    #dlg.open, #dlg .bubble{animation:none;}
    *{transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1000" height="600"></canvas>
  <div id="zone"></div>
  <div class="hud">
    <span class="pill">钱袋 <b id="hudCoins"></b> 德拉克马</span>
    <span class="pill">血 <b id="hudHp"></b><span id="hudHpBarWrap" style="display:inline-block;width:52px;height:7px;background:#e8eef5;border-radius:4px;vertical-align:middle;margin-left:6px;overflow:hidden"><i id="hudHpBar" style="display:block;height:100%;background:#3fae6a;border-radius:4px"></i></span></span>
    <span class="pill">食 <span style="display:inline-block;width:34px;height:7px;background:#e8eef5;border-radius:4px;vertical-align:middle;margin-left:4px;overflow:hidden"><i id="hudHungerBar" style="display:block;height:100%;background:#c9933f;border-radius:4px"></i></span> 水 <span style="display:inline-block;width:34px;height:7px;background:#e8eef5;border-radius:4px;vertical-align:middle;margin-left:4px;overflow:hidden"><i id="hudThirstBar" style="display:block;height:100%;background:#3f8fae;border-radius:4px"></i></span></span>

  land(0,0,45,4);        // 欧洲大陆(北岸)
  land(33,4,45,13);      // 小亚细亚/安纳托利亚(东岸)
  land(0,14,45,17);      // 非洲(北非)
  for(let y=4;y<=8;y++)for(let x=8;x<=9+(y>5?2:1);x++)W[y][x]="#";  // 意大利靴形
  for(let y=9;y<=11;y++){W[y][9]="#";W[y][10]="#";}                 // 靴尖
  W[10][12]="#";W[10][13]="#";                                      // 西西里岛
  for(let y=4;y<=8;y++)for(let x=18;x<=21;x++)W[y][x]="#";          // 希腊/伯罗奔尼撒
  W[5][32]="#";W[5][33]="#";W[6][32]="#";W[6][33]="#";              // 特洛伊海角

  return W.map(r=>r.join(""));
}

  mastTied: false,       /* 绑栈听歌：直面（得歌词残页，士气-1） */
  circeMessage: false,   /* 喀耳刻托付：给斯库拉带三个字（不怪你） */
  scyllaDebtPaid: false, /* 话带到了：海峡让出静水 */
  straitCleared: false,  /* 出峡完成 */
  sunlit: false,         /* 回埃亚岛债清天亮（暗线②收束） */
  lyricFragment: false,  /* 歌词残页（终章锚点） */
  /* —— 第四章·太阳岛（sun）—— */
  sunWrath: false,       /* 宰牛 → 太阳记恨（此后每章天色阴沉、光照调暗） */
  sunBlessed: false,     /* 守住 → 得「走得过黑暗的光」 */

  slaughterWarn: false,  /* 宰牛二段确认（E 两次，防误触） */
  memGreeted: [],        /* 已用作开场问候的记忆 t 列表（memoryGreeting 去重） */
};

/* ---------- 派生数值：从基础属性重算，绝不存为真值（rpg Pattern 1） ---------- */
function derived(){
  const lv = state.level-1;
  const w = state.equipped && WEAPONS[state.equipped] ? WEAPONS[state.equipped] : {atk:0};
  return { maxHp: 100 + lv*10, atk: 8 + lv + w.atk };
}
function xpToNext(lv){ return Math.round(40*Math.pow(lv,1.5)); }
function gainXp(n){
  state.xp += n;
  let up=false;
  while (state.xp >= xpToNext(state.level)){ state.xp -= xpToNext(state.level); state.level++; up=true; }
  if (up){
    state.hp = derived().maxHp;   /* 升级回满 */
    addMemory(`旅人修为精进，历练到了 ${state.level} 级`,1);
    popText(aiaPlayer.x, aiaPlayer.y-30, `升级！Lv.${state.level}`, "#ffd66b", true);
    feedback("large"); sfx("level");
    toast(`⬆ 历练足够，等级 ${state.level}！血上限 +10、攻击 +1，伤势痊愈。`);
  }
  renderHUD();
}

/* ---------- 存档兼容：旧档补新字段默认值 ---------- */
function ensureState(){
  if (state.hunger===undefined) state.hunger=80;
  if (state.thirst===undefined) state.thirst=80;
  if (state.xp===undefined) state.xp=0;
  if (state.level===undefined) state.level=1;
  if (state.affinity===undefined) state.affinity=10;
  if (state.clock===undefined) state.clock=9*60;
  if (!Array.isArray(state.memory)) state.memory=[];
  if (!state.quests) state.quests={};
  if (!Array.isArray(state.windFreed)) state.windFreed=[false,false,false,false];
  /* 第三章字段：旧档补默认值 */
  if (state.straitStage===undefined) state.straitStage=0;
  if (state.waxEars===undefined) state.waxEars=false;
  if (state.mastTied===undefined) state.mastTied=false;
  if (state.circeMessage===undefined) state.circeMessage=false;
  if (state.scyllaDebtPaid===undefined) state.scyllaDebtPaid=false;
  if (state.straitCleared===undefined) state.straitCleared=false;
  if (state.sunlit===undefined) state.sunlit=false;
  if (state.lyricFragment===undefined) state.lyricFragment=false;
  /* 第四章字段：旧档补默认值 */
  if (state.sunWrath===undefined) state.sunWrath=false;
  if (state.sunBlessed===undefined) state.sunBlessed=false;
  if (state.sunName===undefined) state.sunName=null;
  if (state.sunDebt===undefined) state.sunDebt=null;
  if (state.slaughterWarn===undefined) state.slaughterWarn=false;
  if (!Array.isArray(state.memGreeted)) state.memGreeted=[];
  /* 航程闭环字段：旧档补默认值 */
  if (state.prophecy===undefined) state.prophecy=null;
  if (state.sunStage===undefined) state.sunStage=null;
  if (state.freeSail===undefined) state.freeSail=false;
  if (state.epilogueDone===undefined) state.epilogueDone=false;
  /* 旧档迁移：单任务槽 → 多任务账本（rpg/save-systems：只加 migration，不坏老档） */
  if (state.quest){
    const id = state.quest.name==="释放四风" ? "aeolia_winds" : "witch_grass";
    state.quests[id] = Object.assign({id, who:id==="aeolia_winds"?"aeolus":"witch"}, state.quest);
    state.quest = null;
  }
  const d=derived(); if (state.hp>d.maxHp) state.hp=d.maxHp;
}
/* ---------- 任务系统（rpg：定义是数据、进度进存档；目标由事件总线驱动） ---------- */
const QUEST_DEFS = {
  witch_grass:  { name:"采集玛草", need:3, who:"witch",  on:"collect:玛草", reward:{coins:5, items:{"治疗药草":1}, xp:30} },
  aeolia_winds: { name:"释放四风", need:4, who:"aeolus", on:"wind",         reward:{items:{"风袋":4}, xp:30} },
};
function getQuest(id){ return state.quests[id]; }
function acceptQuest(id){
  const def=QUEST_DEFS[id]; if(!def) return null;
  if (!state.quests[id]){
    state.quests[id]={id, name:def.name, need:def.need, have:0, done:false, turned:false, ready:false, who:def.who};
    renderHUD();
  }
  return state.quests[id];
}
/* 事件总线：击杀/拾取/交互统一从这里进任务进度（rpg on_event） */
function questEvent(kind, data){
  data = data||{};
  for (const q of Object.values(state.quests||{})){
    if (q.done) continue;
    const def=QUEST_DEFS[q.id]; if(!def) continue;
    const hit = kind==="wind" ? def.on==="wind" : (kind==="collect" && def.on==="collect:"+data.item);
    if (!hit) continue;
    if (q.have < q.need){
      q.have++;
      if (q.have >= q.need){ q.ready=true; toast(`「${q.name}」目标达成——回去复命吧。`); }
    }
  }
  renderHUD();
}

const SAVE_KEY = "odyssey-med-v2", SAVE_VERSION = 3;
function save(){ try{
  const cur = localStorage.getItem(SAVE_KEY);
  if (cur) localStorage.setItem(SAVE_KEY+".bak", cur);   /* 原子写双份：主档覆盖前先留上一版（save-systems） */
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    v:SAVE_VERSION, state, scene, boat:{x:boat.x,y:boat.y}, aia:{x:aiaPlayer.x,y:aiaPlayer.y} }));
}catch(e){} }
function parseSave(raw){
  try{
    const d=JSON.parse(raw||"null");
    if (d && d.state && typeof d.state.coins==="number" && typeof d.state.hp==="number") return d;   /* 最小字段校验 */
  }catch(e){}
  return null;
}
function load(){
  /* 主档损坏/截断 → 回退上一版备份（save-systems 原子写） */
  const d = parseSave(localStorage.getItem(SAVE_KEY)) || parseSave(localStorage.getItem(SAVE_KEY+".bak"));
  if (!d) return false;
  /* 版本迁移链：v<current 逐级跑纯函数迁移（v2→v3 无结构断裂，字段默认值由 ensureState 兑底） */
  while ((d.v||2) < SAVE_VERSION) d.v = SAVE_VERSION;
  if (d.v > SAVE_VERSION) return false;   /* 未来版本存档：拒绝而不是静默清字段 */
  state = d.state;
  if (d.boat){ boat.x=d.boat.x; boat.y=d.boat.y; }
  if (d.aia){ aiaPlayer.x=d.aia.x; aiaPlayer.y=d.aia.y; }
  scene = d.scene === "hades" ? "hades" : d.scene === "aeolia" ? "aeolia" : d.scene === "strait" ? "strait" : d.scene === "sun" ? "sun" : d.scene === "aia" ? "aia" : "world";
  ensureState();
  return true;
}
function hardReset(){ if(confirm("清空存档，从头开始？")){ localStorage.removeItem(SAVE_KEY); location.reload(); } }

/* ==================================================================
 *  相机与反馈层 —— 依 camera-systems / game-feel skill：
 *  1) 岛屿内平滑跟随（lerp 帧率无关），世界地图保持全览；M 键切俯瞰
 *  2) 死区 + 速度前瞻：死区内相机不动防抖晕；前瞻幅度随速度缓入缓出防甩头
 *  3) 中心锚点语义统一：cam.x/y = 屏幕中心对应的世界坐标（与 loop 的
 *     translate(ccx,ccy) 一致），钳制让“画面”留在场景矩形内 —— 根治 void 黑区
 *  4) 屏震走 trauma 衰减模型（trauma² 平滑抖动），只动相机不动逻辑
 *  5) hit-stop 冻结逻辑帧（真实时间恢复），反馈按 small/medium/large 分档
 * ================================================================== */
const VIEW_W = 1000, VIEW_H = 600;
const cam = { x:0, y:0, zoom:1, tx:0, ty:0, tz:1, trauma:0, t:0, fx:0, fy:0, look:0 };
let panorama = false, timeScale = 1, hitStopUntil = 0;
function sceneSize(){ return scene==="world" ? {w:WCOLS*WTS, h:WROWS*WTS} : {w:ACOLS*ATS, h:AROWS*ATS+TH}; }
function camCenter(){ return scene==="world" ? [0,0] : [VIEW_W/2, VIEW_H/2]; }   /* 世界全览原位，岛屿中心跟随 */
/* 场景底色：岛屿只画 800×497 的岛体，画布其余部分必须由底色补齐（根治 void 黑区） */
function sceneBackdrop(){
  return scene==="aia" ? "#2f6f96" : scene==="hades" ? "#0c1622"
       : scene==="aeolia" ? "#c3d2e2" : scene==="strait" ? "#3c5165"
       : scene==="sun" ? (state.sunWrath ? "#5a6a72" : "#2c6d86") : null;
}
function camTick(dt){
  const b = sceneSize();
  const follow = scene !== "world";
  cam.tz = follow && !panorama ? 1.7 : 1;
  if (follow && !panorama){
    const vw = VIEW_W/cam.tz, vh = VIEW_H/cam.tz;
    /* 死区（camera-systems）：焦点只在玩家出矩形时才被推着走 */
    const DZX = 42, DZY = 26;
    if (aiaPlayer.x > cam.fx + DZX) cam.fx = aiaPlayer.x - DZX;
    if (aiaPlayer.x < cam.fx - DZX) cam.fx = aiaPlayer.x + DZX;
    if (aiaPlayer.y > cam.fy + DZY) cam.fy = aiaPlayer.y - DZY;
    if (aiaPlayer.y < cam.fy - DZY) cam.fy = aiaPlayer.y + DZY;
    /* 前瞻：朝移动方向提前看，幅度随速度缓入缓出（防甩头） */
    const spd = Math.hypot(aiaPlayer.vx||0, aiaPlayer.vy||0);
    cam.look += (Math.min(spd*0.38, 64) - cam.look) * Math.min(1, dt*4);
    const lx = spd>1 ? (aiaPlayer.vx/spd)*cam.look : 0;
    const ly = spd>1 ? (aiaPlayer.vy/spd)*cam.look : 0;
    /* 中心锚点钳制：cam ∈ [vw/2, b-vw/2]；场景比视口小则整景居中 */
    const cxT = cam.fx + lx, cyT = cam.fy + ly - 20;
    cam.tx = b.w <= vw ? b.w/2 : Math.max(vw/2, Math.min(b.w - vw/2, cxT));
    cam.ty = b.h <= vh ? b.h/2 : Math.max(vh/2, Math.min(b.h - vh/2, cyT));
  } else {
    cam.tx = follow ? b.w/2 : 0;   /* 俯瞰：整景居中（与 camCenter 语义一致）；世界全览原位 */
    cam.ty = follow ? b.h/2 : 0;
  }
  /* 传送硬切（登陆/返航/晕倒/漩涡）：目标突变时直接吸附，禁跨整图甩镜头 */
  if (Math.hypot(cam.tx-cam.x, cam.ty-cam.y) > 500){
    cam.x = cam.tx; cam.y = cam.ty; cam.fx = follow ? aiaPlayer.x : 0; cam.fy = follow ? aiaPlayer.y : 0; cam.look = 0;
  }
  const k = 1 - Math.pow(0.002, dt);
  cam.x += (cam.tx-cam.x)*k; cam.y += (cam.ty-cam.y)*k;
  cam.zoom += (cam.tz-cam.zoom)*Math.min(1, dt*3);
  cam.trauma = Math.max(0, cam.trauma - 1.35*dt);
  cam.t += dt*30;
}
function camOffset(){
  const s = cam.trauma*cam.trauma;               /* 二次方：小震轻、大震狠 */
  return [12*s*Math.sin(cam.t*1.7), 8*s*Math.sin(cam.t*2.3), 0.09*s*Math.sin(cam.t*1.1)];
}
function addTrauma(a){ cam.trauma = Math.min(1, cam.trauma + a); }
function hitStop(ms){ hitStopUntil = performance.now() + ms; }
/* 反馈分层（game-feel：重要性分档，全游戏一致的 juice 预设） */
function feedback(tier){
  if (tier==="small") addTrauma(0.15);
  else if (tier==="medium"){ addTrauma(0.40); hitStop(55); }
  else { addTrauma(0.80); hitStop(110); }
}
/* 世界坐标 → 屏幕（百分比），DOM 提示/气泡定位共用 */
function w2s(wx, wy){
  const [ccx, ccy] = camCenter();
  const [sx, sy] = camOffset();
  return [ (ccx + (wx-cam.x)*cam.zoom + sx)/VIEW_W,
           (ccy + (wy-cam.y)*cam.zoom + sy)/VIEW_H ];
}
/* 伤害/获得数字弹出（floatTexts：上浮渐隐） */
const floatTexts = [];
function popText(wx, wy, text, color, big){
  floatTexts.push({x:wx, y:wy, text, color:color||"#fff", t:0, big:!!big});
  if (floatTexts.length > 24) floatTexts.shift();
}
function drawFloatTexts(){
  ctx.textAlign = "center";
  for (let i=floatTexts.length-1; i>=0; i--){
    const f = floatTexts[i]; f.t += 0.016;
    if (f.t > 1.1){ floatTexts.splice(i,1); continue; }
    const rise = f.t*26, a = f.t<0.12 ? f.t/0.12 : 1-Math.max(0,(f.t-0.5)/0.6);
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = (f.big?"bold 20px":"bold 14px")+" 'Segoe UI','Microsoft YaHei'";
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillText(f.text, f.x+1, f.y-rise+1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y-rise);
  }
  ctx.globalAlpha = 1;
}

/* ==================== 昼夜（生存-crafting：时间驱动威胁；visual.md 光照色卡） ==================== */
const DAY_LEN = 480;                      /* 现实 8 分钟 = 游戏一昼夜 */
const CLOCK_NAMES = [[5,"黎明"],[8,"清晨"],[11,"上午"],[13,"正午"],[17,"黄昏"],[20,"夜晚"],[24,"深夜"]];
function clockTick(dt){ state.clock = (state.clock + dt/DAY_LEN*1440) % 1440; }
function hourNow(){ return state.clock/60; }
function isNight(){ const h=hourNow(); return h>=20 || h<5; }
function isDusk(){ const h=hourNow(); return h>=17 && h<20; }
function nightAmount(){                       /* 0 白昼 → 1 深夜（平滑过渡） */
  const h = hourNow();
  if (h>=21 || h<4) return 1;
  if (h>=19 && h<21) return (h-19)/2;
  if (h>=4 && h<6) return 1-(h-4)/2;
  return 0;
}
function duskAmount(){
  const h = hourNow();
  if (h>=16 && h<19) return Math.sin((h-16)/3*Math.PI);
  return 0;
}
function clockName(){
  const h = hourNow();
  for (const [lim,name] of CLOCK_NAMES) if (h<lim) return name;
  return "深夜";
}
/* 昼夜光照层：夜间冷蓝暗幕 + 光源开洞（火堆/小屋窗/玩家），黄昏金色暖调。
   海图上夜色减淡、船灯开洞；冥界是亡者之国，没有太阳——不做昼夜（叙事一致）。 */
function drawDaylight(et){
  if (scene === "hades" || scene === "strait") return;
  /* 「太阳记恨」全局阴幕：宰牛后天色常阴（每章生效，冥界/海峡本就无日故豁免） */
  if (state.sunWrath){
    const wk = scene==="world" ? 0.10 : 0.16;
    const wx0 = cam.x-60, wy0 = cam.y-60, ww = VIEW_W/cam.zoom+120, wh = VIEW_H/cam.zoom+120;
    ctx.fillStyle = `rgba(52,50,66,${wk})`; ctx.fillRect(wx0,wy0,ww,wh);
  }
  const n = nightAmount(), du = duskAmount();
  if (n <= 0 && du <= 0) return;
  const b = sceneSize();
  const vx = cam.x-60, vy = cam.y-60, vw = VIEW_W/cam.zoom+120, vh = VIEW_H/cam.zoom+120;
  const k = scene==="world" ? 0.55 : 1;
  if (du > 0){ ctx.fillStyle = `rgba(232,168,74,${0.10*du*k})`; ctx.fillRect(vx,vy,vw,vh); }
  if (n > 0){
    ctx.fillStyle = `rgba(10,16,44,${0.38*n*k})`; ctx.fillRect(vx,vy,vw,vh);
    /* 光源开洞 */
    const lights = scene==="world"
      ? [[boat.x, boat.y, 60, "255,200,110", 0.55]]
      : scene==="aeolia"
      ? [
          [4*ATS+ATS/2, 3*ATS+ATS*0.75, 90, "255,235,190", 0.5],   /* 宫殿灯窗 */
          [9*ATS+ATS/2, 3*ATS+ATS/2, 70, "180,220,255", 0.35],     /* 风之祭坛 */
          [aiaPlayer.x, aiaPlayer.y, 70, "255,225,170", 0.28],
        ]
      : scene==="sun"
      ? [
          [sunAltar.x, sunAltar.y, 120, "255,214,120", 0.55],      /* 太阳祭坛金纹 */
          [3*ATS+ATS/2, 6*ATS+ATS/2, 80, "255,170,60", 0.45],      /* 圣火盆 */
          [aiaPlayer.x, aiaPlayer.y, 70, "255,225,170", 0.28],
        ]
      : [
          [16*ATS+ATS/2, 8*ATS+ATS*0.95, 95, "255,170,60", 0.55],
          [3.5*ATS+26,   3*ATS-20,       80, "255,200,110", 0.4],
          [8.9*ATS,      3.4*ATS,        55, "120,230,150", 0.3],
          [aiaPlayer.x,  aiaPlayer.y,    70, "255,225,170", 0.28],
        ];
    for (const [lx, ly, r, rgb, a] of lights){
      const g = ctx.createRadialGradient(lx, ly, 4, lx, ly, r);
      g.addColorStop(0, `rgba(${rgb},${a*n*k})`); g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g; ctx.fillRect(lx-r, ly-r, r*2, r*2);
    }
  }
}

/* ==================== 生存需求（survival-crafting Pattern 1：衰减+分级后果，不秒杀） ==================== */
const NEED_RATE = {hunger: 0.20, thirst: 0.27};   /* 每秒衰减：满值约 8/6 分钟 */
let needHurtT = 0, lastNeedToast = 0;
function tickNeeds(dt){
  state.hunger = Math.max(0, state.hunger - NEED_RATE.hunger*dt);
  state.thirst = Math.max(0, state.thirst - NEED_RATE.thirst*dt);
  const starving = state.hunger<=20, parched = state.thirst<=15;
  if (starving || parched){
    needHurtT += dt;
    if (needHurtT >= 4){
      needHurtT = 0;
      state.hp = Math.max(0, state.hp-1);
      state.status["伤势"] = state.hp>60?"轻伤":state.hp>30?"重伤":"奄奄一息";
      if (state.hp<=0){ faintPlayer("饥渴交加"); return; }
      renderHUD();
    }
    if (performance.now()-lastNeedToast > 15000){
      lastNeedToast = performance.now(); sfx("warn");
      toast(starving&&parched ? "又饿又渴……再这样下去要出人命。找点吃的，喝口水。"
        : starving ? "肚子在叫……找点吃的（面包、烤肉都行）。"
        : "喉咙冒烟……该喝水了（背包里的淡水，或去泉眼灌）。");
    }
  } else needHurtT = 0;
  /* 需求影响状态文案（供「查询自身状态」） */
  state.status["饥饿"] = state.hunger>70?"饱了":state.hunger>40?"不饿":state.hunger>20?"微饿":"饥肠辘辘";
  state.status["口渴"] = state.thirst>70?"精神":state.thirst>40?"正常":state.thirst>15?"发干":"干渴难忍";
}
function faintPlayer(reason){
  state.hp = 50; state.coins = Math.max(0, state.coins-5);
  state.hunger = Math.max(state.hunger, 45); state.thirst = Math.max(state.thirst, 45);
  state.status["伤势"] = "轻伤";
  if (scene === "sun"){
    /* 太阳岛没有女巫——晕倒在自己的船边（场景感知恢复点，不跨岛传送） */
    aiaPlayer.x = 3*ATS+ATS/2; aiaPlayer.y = 10*ATS+ATS/2;
    addMemory(`旅人${reason}晕倒在太阳岛上，被浪拍醒在自己的船边`, 2);
    toast(`眼前一黑……醒来时你趴在自己的船底，满嘴海水味。命还在，医药钱省了——饿可没省。（血量恢复至 50，还剩 ${state.coins} 枚）`);
  } else {
    aiaPlayer.x = witch.x; aiaPlayer.y = witch.y + 60;
    addMemory(`旅人${reason}晕了过去，被她拖回屋外草垛`, 2);
    toast(`眼前一黑……醒来时你躺在女巫屋外的草垛上，她把药渣在你鼻子上抹了一把：医药费，五枚德拉克马。（血量恢复至 50，还剩 ${state.coins} 枚）`);
  }
  renderHUD(); save();
}

/* ==================== NPC 记忆流（PLAN.md 卖点：NPC 真的记得你）
   who 字段区分记忆归属：witch（女巫）/ seer（先知）/ any（共有） ==================== */
function addMemory(text, imp, who){

}
function recallMemories(k, who){

}

function ambientAnchor(npc){
  if (npc==="witch") return witch;
  if (npc==="seer") return seer;
  if (npc==="aeolus") return aeolus;
  if (npc==="siren"){ const s=SSPOTS.find(p=>p.type==="siren"); return s?{x:s.x,y:s.y}:null; }
  return null;
}
let ambTimer=0, ambUntil=0, ambAnchor=null, ambText="", ambActive=null;
const ambientCooldown = {};
function npcAmbientTick(dt){
  ambTimer += dt;
  if (ambTimer < 1.2) return;                /* 决策步 1.2s 一次，非每帧 */
  ambTimer = 0;
  if (dlgOpen||titleOn||chapterOn||mapOpen||scene==="world"){ ambActive=null; return; }
  const npc = scene==="aia"?"witch":scene==="hades"?"seer":scene==="aeolia"?"aeolus":"siren";
  const anchor = ambientAnchor(npc);
  if (!anchor){ ambActive=null; return; }
  if (Math.hypot(aiaPlayer.x-anchor.x, aiaPlayer.y-anchor.y) > 180){ ambActive=null; return; }
  const now = performance.now();
  if (ambActive && now < ambUntil) return;   /* 正在说的这句先说完 */
  if (ambActive){ ambActive=null; return; }  /* 说完停一轮，避免无缝接龙 */
  const cands = (AMBIENT[npc]||[]).filter(a =>
    now - (ambientCooldown[npc+"."+a.id]||0) > 90000 && a.cond());
  if (!cands.length) return;
  cands.sort((a,b)=>b.w-a.w);
  const pick = cands[0];
  ambientCooldown[npc+"."+pick.id] = now;
  ambActive = pick.id; ambUntil = now + 5200;
  ambAnchor = anchor;
  ambText = typeof pick.line==="function" ? pick.line() : pick.line;
}
function renderAmbient(){
  if (!ambActive || !ambAnchor || performance.now()>ambUntil){
    if (ambEl.style.display!=="none") ambEl.style.display="none";
    return;
  }
  const [ax,ay]=w2s(ambAnchor.x, ambAnchor.y-38);
  ambEl.style.display="block"; ambEl.style.left=(ax*100)+"%"; ambEl.style.top=(ay*100)+"%";
  ambEl.textContent=ambText;
}

/* ==================== 喀耳刻屋内 Utility AI（ai-behavior-trees-utility-ai：
   归一化打分 + 迟滞防抖，行为玩家可见可感：搅药 / 踱步 / 望海） ==================== */
const witchAI = { mode:"stir", t:0, hyst:0.08, tx:witch.x, ty:witch.y, bored:0, fatigue:0 };
const WITCH_SPOTS = {
  stir: {x: 8.9*ATS, y: 3.55*ATS},   /* 坩埚旁 */
  pace: {x: 6.6*ATS, y: 4.7*ATS},    /* 小径踱步 */
  gaze: {x: 5.6*ATS, y: 3.2*ATS},    /* 朝西望海 */
};
const WITCH_MOOD = {stir:"搅药", pace:"踱步", gaze:"望海"};
function witchUtilityTick(dt){
  if (dlgOpen || titleOn || chapterOn || mapOpen) return;
  witchAI.t += dt;
  witchAI.bored   = witchAI.mode==="stir" ? witchAI.bored+dt*0.022 : Math.max(0, witchAI.bored-dt*0.05);
  witchAI.fatigue = witchAI.mode==="pace" ? witchAI.fatigue+dt*0.045 : Math.max(0, witchAI.fatigue-dt*0.03);
  if (witchAI.t >= 2){                          /* 决策步 2s 一次，非每帧 */
    witchAI.t = 0;
    const evening = (isDusk()||isNight()) ? 1 : 0;
    const scores = {
      stir: 0.45*(1-witchAI.bored) + witchAI.fatigue*0.6,
      pace: 0.22 + witchAI.bored*0.7  - witchAI.fatigue*0.5,
      gaze: 0.10 + evening*0.35       + witchAI.bored*0.25,
    };
    scores[witchAI.mode] += witchAI.hyst;       /* 迟滞：避免在近平分间抖动 */
    const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
    if (best !== witchAI.mode){
      witchAI.mode = best;
      witchAI.tx = WITCH_SPOTS[best].x; witchAI.ty = WITCH_SPOTS[best].y;
    }
  }
  const dx = witchAI.tx-witch.x, dy = witchAI.ty-witch.y, d = Math.hypot(dx,dy);
  if (d > 2){ const sp = Math.min(26*dt, d); witch.x += dx/d*sp; witch.y += dy/d*sp; }
  ASPOTS[0].x = witch.x; ASPOTS[0].y = witch.y;   /* 交互点跟随 */
}

/* ==================== 输入 ==================== */
const keys = new Set();
let dlgOpen = false;
let eBufAt = 0;   /* 交互预按时间戳（input-systems 输入缓冲） */
/* 标题屏 / 章节过场开关：开着时不响应移动与互动 */
let titleOn = true, chapterOn = false, chTimer = null;
/* 捕获阶段监听：输入框打字不误触移动/E，但 Esc 任何时候都能关对话 */
addEventListener("keydown", e=>{
  if (titleOn || chapterOn){ if (chapterOn && e.key==="Escape") skipChapter(); return; }
  const inInput = e.target && e.target.id === "inp";
  if (dlgOpen){
    if (e.key==="Escape"){ closeDlg(); e.preventDefault(); }
    return;
  }
  if (mapOpen){ if (e.key==="Escape" || e.key.toLowerCase()==="m"){ closeMap(); e.preventDefault(); } return; }
  if (document.getElementById("lyricCard").classList.contains("open")){ if (e.key==="Escape") closeLyric(); return; }
  if (inInput) return;
  const k = e.key.toLowerCase();
  if (["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){ keys.add(k); e.preventDefault(); }
  if (k==="e"){
    e.preventDefault();
    /* 预按：当前无可交互目标才进缓冲，避免双触发 */
    const has = scene==="world" ? !!islandNear() : !!aiaNear();
    if (!has) eBufAt = performance.now();
    interact();
  }
  /* M=海图（全场景）；P=俯瞰全岛（岛屿内） */
  if (k==="m" && !chapterOn){ e.preventDefault(); mapOpen ? closeMap() : openMap(); }
  if (k==="p" && scene!=="world" && !mapOpen){
    panorama = !panorama;
    toast(panorama ? "俯瞰全岛（再按 P 回到跟随视角）" : "跟随视角（再按 P 俯瞰全岛）");
  }
}, true);
addEventListener("keyup", e=> keys.delete(e.key.toLowerCase()));
addEventListener("blur", ()=> keys.clear());

/* ==================== 移动 ==================== */
function aiaTile(cx,cy){ return (cx<0||cy<0||cx>=ACOLS||cy>=AROWS)?"~":AIA[cy][cx]; }
function tryMoveAia(nx,ny){
  const hw=aiaPlayer.w/2, hh=aiaPlayer.h/2;
  for (const [dx,dy] of [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]])
    if (ASOLID.has(aiaTile(Math.floor((nx+dx)/ATS), Math.floor((ny+dy)/ATS)))) return false;
  aiaPlayer.x=nx; aiaPlayer.y=ny; return true;
}
function worldTile(cx,cy){ return (cx<0||cy<0||cx>=WCOLS||cy>=WROWS)?"~":WORLD[cy][cx]; }
function tryMoveHades(nx,ny){
  const hw=aiaPlayer.w/2, hh=aiaPlayer.h/2;
  for (const [dx,dy] of [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]])
    if (HSOLID.has(hTile(Math.floor((nx+dx)/ATS), Math.floor((ny+dy)/ATS)))) return false;
  aiaPlayer.x=nx; aiaPlayer.y=ny; return true;
}
function tryMoveAeolia(nx,ny){
  const hw=aiaPlayer.w/2, hh=aiaPlayer.h/2;
  for (const [dx,dy] of [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]])
    if (AESOLID.has(aeTile(Math.floor((nx+dx)/ATS), Math.floor((ny+dy)/ATS)))) return false;
  aiaPlayer.x=nx; aiaPlayer.y=ny; return true;
}
function tryMoveWorld(nx,ny){
  const ch = worldTile(Math.floor(nx/WTS), Math.floor(ny/WTS));
  if (ch==="#"||ch==="X"||ch==="G") return false;
  boat.x=nx; boat.y=ny; return true;
}
function tickMove(dt){
  if (titleOn||chapterOn||mapOpen) return;
  let dx=0, dy=0;
  if (keys.has("a")||keys.has("arrowleft")) dx-=1;
  if (keys.has("d")||keys.has("arrowright")) dx+=1;
  if (keys.has("w")||keys.has("arrowup")) dy-=1;
  if (keys.has("s")||keys.has("arrowdown")) dy+=1;
  const p = scene!=="world" ? aiaPlayer : boat;
  p.moving = !!(dx||dy);
  if (!dx&&!dy){ p.vx=0; p.vy=0; return; }   /* 速度清零：相机前瞻随之收回 */
  if (dx&&dy){ dx*=0.7071; dy*=0.7071; }
  if (dx<0) p.face="left"; else if (dx>0) p.face="right";
  else if (dy<0) p.face="up"; else p.face="down";
  /* 风袋顺风：海上航速倍增（暗线③：用风=快旅，贪念=用光） */
  const tail = scene==="world" && performance.now() < (state.tailwindUntil||0);
  const sp = (scene==="aia"?150:scene==="hades"?120:scene==="aeolia"?130:scene==="strait"?135:scene==="sun"?140:tail?230:110)*dt;
  const mover = scene==="aia" ? tryMoveAia : scene==="hades" ? tryMoveHades : scene==="aeolia" ? tryMoveAeolia : scene==="strait" ? tryMoveStrait : scene==="sun" ? tryMoveSun : tryMoveWorld;
  p.vx = dx*sp/dt; p.vy = dy*sp/dt;   /* 实际速度（px/s），相机前瞻用 */
  if (dx) mover(p.x+dx*sp, p.y);
  if (dy) mover(p.x, p.y+dy*sp);
  p.step = (p.step||0)+dt*8;
}

/* ==================== 野猪 AI（纯本地逻辑层，不烧模型） ==================== */
function tryMoveBoar(nx, ny){
  for (const [dx,dy] of [[-13,-7],[13,-7],[-13,7],[13,7]])
    if (ASOLID.has(aiaTile(Math.floor((nx+dx)/ATS), Math.floor((ny+dy)/ATS)))) return false;
  boar.x = nx; boar.y = ny; return true;
}
function tickBoar(dt){
  if (!boar.alive) return;
  boar.timer -= dt;
  const dx = aiaPlayer.x - boar.x, dy = aiaPlayer.y - boar.y;
  const dist = Math.hypot(dx, dy) || 1;
  const rage = isNight() ? 1.4 : 1;        /* 昼夜威胁：夜里它更凶（survival-crafting 威胁曲线） */
  switch (boar.mode){
    case "idle":
      /* 游荡：在家附近小步踱步 */
      if (dist < 140*rage){ boar.mode = "aggro"; sfx("alert"); break; }
      if (((performance.now()/900)|0) % 2 === 0){
        const hx = boar.home.x - boar.x, hy = boar.home.y - boar.y;
        if (Math.hypot(hx, hy) > 26) tryMoveBoar(boar.x + Math.sign(hx)*22*dt, boar.y + Math.sign(hy)*22*dt);
      }
      break;
    case "aggro":
      if (dist > 210*rage){ boar.mode = "idle"; break; }
      if (dist < 95){
        boar.mode = "windup"; boar.timer = 0.5;
        boar.dir = {x:dx/dist, y:dy/dist};   /* 方向在蓄力开始时锁定 → 玩家可走位躲 */
        break;
      }
      tryMoveBoar(boar.x + dx/dist*34*dt*(isNight()?1.15:1), boar.y + dy/dist*34*dt*(isNight()?1.15:1));
      break;
    case "windup":
      if (boar.timer <= 0){ boar.mode = "dash"; boar.timer = 0.55; sfx("dash"); }
      break;
    case "dash": {
      const sp = 300*dt;
      if (!tryMoveBoar(boar.x + boar.dir.x*sp, boar.y + boar.dir.y*sp)){
        boar.mode = "tired"; boar.timer = 1.3; break;
      }
      if (Math.hypot(aiaPlayer.x-boar.x, aiaPlayer.y-boar.y) < 22){
        const dmg = 12 + Math.floor(Math.random()*5) + (isNight()?2:0);
        hurtPlayer(dmg, "野猪把你撞了个趔趄");
        const kb = 26;
        tryMoveAia(aiaPlayer.x + boar.dir.x*kb, aiaPlayer.y);
        tryMoveAia(aiaPlayer.x, aiaPlayer.y + boar.dir.y*kb);
        boar.mode = "tired"; boar.timer = 1.3;
      } else if (boar.timer <= 0){ boar.mode = "tired"; boar.timer = 1.3; }
      break;
    }
    case "tired":
      if (boar.timer <= 0) boar.mode = "idle";
      break;
  }
}

/* ==================== 玩家受击反馈（红晕 + 抖动 + 合成音效） ==================== */
function hurtPlayer(dmg, reason){
  state.hp -= dmg;
  state.status["伤势"] = state.hp>60 ? "轻伤" : state.hp>30 ? "重伤" : "奄奄一息";
  flashHit(); shakeHp(); sfx("hurt"); feedback("medium");
  popText(aiaPlayer.x, aiaPlayer.y-24, `-${dmg}`, "#ff7a6b");
  if (state.hp <= 0){
    faintPlayer(reason.includes("野猪") ? "被野猪撞倒后" : "");
    return;
  }
  toast(`${reason}（你 -${dmg} 血）`);
  renderHUD(); save();
}
function flashHit(){
  const f = document.getElementById("hitFlash");
  if (!f) return;
  f.style.transition = "none"; f.style.opacity = 1;
  requestAnimationFrame(()=>{ f.style.transition = "opacity .55s"; f.style.opacity = 0; });
}
function shakeHp(){
  const el = document.getElementById("hudHpBarWrap");
  if (!el) return;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
}

/* ==================================================================
 *  WebAudio 零依赖合成（audio-design：总线化 + SFX 变调 + 环境层 + ducking）
 *  总线：destination ← { sfxGain(SFX), ambGain(Ambience) }
 *  环境层按场景自动切换：海浪+风（世界/埃亚岛）、冥界低鸣；近篝火噼啪、海面偶发鸥鸣
 * ================================================================== */
let AC = null, sndOn = true;
let sfxGain = null, ambGain = null, ambCfg = null, lastAmbScene = null;
const SFX_CFG = {
  attack: [900, 560, 0.05, "square",   0.10],
  hurt:   [150,  70,  0.17, "sawtooth", 0.20],
  dash:   [240,  720, 0.15, "sawtooth", 0.10],
  alert:  [540,  540, 0.07, "triangle", 0.09],
  die:    [320,  85,  0.30, "sawtooth", 0.15],
  cook:   [520,  800, 0.13, "triangle", 0.11],
  pick:   [700,  900, 0.06, "sine",     0.08],
  level:  [520, 1040, 0.35, "triangle", 0.14],
  warn:   [330,  220, 0.22, "square",   0.07],
  bless:  [440,  880, 0.50, "sine",     0.10],
};
function audioInit(){
  if (AC) return AC;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(AC.destination);
    ambGain = AC.createGain(); ambGain.gain.value = 0;   ambGain.connect(AC.destination);
  }catch(e){}
  return AC;
}
function sfx(kind){
  if (!sndOn || !SFX_CFG[kind]) return;
  try{
    audioInit(); if (!AC) return;
    if (AC.state === "suspended") AC.resume();
    const c = SFX_CFG[kind], t = AC.currentTime;
    const jitter = 0.94 + Math.random()*0.12;   /* ±6% 变调，去"机枪感"（SFX variation） */
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = c[3];
    o.frequency.setValueAtTime(c[0]*jitter, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, c[1]*jitter), t+c[2]);
    g.gain.setValueAtTime(c[4], t);
    g.gain.exponentialRampToValueAtTime(0.001, t+c[2]);
    o.connect(g); g.connect(sfxGain||AC.destination);
    o.start(t); o.stop(t+c[2]+0.02);
  }catch(e){}
}
function sndToggle(){
  sndOn = !sndOn;
  document.getElementById("sndBtn").textContent = sndOn ? "🔊 音效" : "🔇 音效";
  if (sndOn){ audioInit(); lastAmbScene = null; }   /* 重开后环境层自动重建 */
}

/* ---------- 环境层（噪声/振荡器全合成，零音频文件） ---------- */
let noiseBuf = null;
function getNoise(){
  if (noiseBuf) return noiseBuf;
  noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
function setAmbience(){
  if (!AC || !sndOn) return;
  if (ambCfg){ try{ ambCfg.stop(); }catch(e){} }
  const nodes = [];
  const keep = (x)=>{ nodes.push(x); return x; };
  if (scene === "hades"){
    /* 冥界：55Hz 失谐双振低鸣 + 暗噪声 */
    const g = keep(AC.createGain()); g.gain.value = 0.045; g.connect(ambGain);
    for (const fq of [55, 55.7]){
      const o = AC.createOscillator(); o.type="sine"; o.frequency.value = fq;
      o.connect(g); o.start(); keep(o);
    }
    const n = AC.createBufferSource(); n.buffer = getNoise(); n.loop = true;
    const f = AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=180;
    const ng = AC.createGain(); ng.gain.value = 0.05;
    n.connect(f); f.connect(ng); ng.connect(ambGain); n.start();
    keep(n);
  } else if (scene === "strait"){
    /* 声之海峡：雾海低涌（lowpass 噪声）+ 幽微歌声泛音（312/397Hz 失谐颤音） */
    const n = AC.createBufferSource(); n.buffer = getNoise(); n.loop = true;
    const f = AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=300;
    const g = AC.createGain(); g.gain.value = 0.05;
    n.connect(f); f.connect(g); g.connect(ambGain); n.start();
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.11;
    const lg = AC.createGain(); lg.gain.value = g.gain.value*0.7;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    keep(n); keep(lfo);
    for (const [fq,amp] of [[312,0.012],[397,0.009]]){
      const o = AC.createOscillator(); o.type="sine"; o.frequency.value=fq;
      const og = AC.createGain(); og.gain.value=amp;
      const vib = AC.createOscillator(); vib.frequency.value=4.6;
      const vg2 = AC.createGain(); vg2.gain.value=fq*0.008;
      vib.connect(vg2); vg2.connect(o.frequency);
      o.connect(og); og.connect(ambGain); o.start(); vib.start();
      keep(o); keep(vib);
    }
  } else if (scene === "sun"){
    /* 太阳岛：暖风低吟（lowpass 噪声，柔）+ 金色微颤（523/526Hz 失谐极轻）——晴日牧场 */
    const n = AC.createBufferSource(); n.buffer = getNoise(); n.loop = true;
    const f = AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=500;
    const g = AC.createGain(); g.gain.value = 0.03;
    n.connect(f); f.connect(g); g.connect(ambGain); n.start();
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.09;
    const lg = AC.createGain(); lg.gain.value = g.gain.value*0.6;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    keep(n); keep(lfo);
    for (const [fq,amp] of [[523,0.006],[526,0.005]]){
      const o = AC.createOscillator(); o.type="sine"; o.frequency.value=fq;
      const og = AC.createGain(); og.gain.value=amp;
      o.connect(og); og.connect(ambGain); o.start();
      keep(o);
    }
  } else {
    /* 海浪：lowpass 噪声 + LFO 起伏 */
    const n = AC.createBufferSource(); n.buffer = getNoise(); n.loop = true;
    const f = AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value = scene==="world"?420:360;
    const g = AC.createGain(); g.gain.value = scene==="world"?0.05:0.038;
    n.connect(f); f.connect(g); g.connect(ambGain); n.start();
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.13;
    const lg = AC.createGain(); lg.gain.value = g.gain.value*0.7;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    keep(n); keep(lfo);
    /* 风：bandpass 噪声 + 慢 LFO */
    const wn = AC.createBufferSource(); wn.buffer = getNoise(); wn.loop = true;
    const wf = AC.createBiquadFilter(); wf.type="bandpass"; wf.frequency.value=900; wf.Q.value=2.2;
    const wg = AC.createGain(); wg.gain.value = 0.02;
    wn.connect(wf); wf.connect(wg); wg.connect(ambGain); wn.start();
    const wlfo = AC.createOscillator(); wlfo.frequency.value = 0.07;
    const wlg = AC.createGain(); wlg.gain.value = 0.012;
    wlfo.connect(wlg); wlg.connect(wg.gain); wlfo.start();
    keep(wn); keep(wlfo);
  }
  ambCfg = { stop(){ nodes.forEach(x=>{ try{x.stop();}catch(e){} try{x.disconnect();}catch(e){} }); } };
  sfx(scene==="hades" ? "dash" : "pick");
}
let gullT = 8, crackleT = 0;
function ambTick(dt){
  if (!AC || !sndOn) return;
  if (AC.state === "suspended") AC.resume();
  if (ambGain){
    /* ducking：对话/标题/过场时环境音让位（sidechain 的手写替身，慢恢复不喘） */
    const target = (dlgOpen||titleOn||chapterOn ? 0.2 : 1) * 0.9;
    const cur = ambGain.gain.value;
    ambGain.gain.value = cur + (target-cur)*Math.min(1, dt*2.5);
  }
  if (lastAmbScene !== scene){ lastAmbScene = scene; setAmbience(); }
  if (dlgOpen || titleOn || chapterOn) return;
  if (scene === "aia"){
    /* 近篝火：随机高频噼啪 */
    const d = Math.hypot(aiaPlayer.x-(16*ATS+ATS/2), aiaPlayer.y-(8*ATS+ATS*0.95));
    if (d < 130){
      crackleT -= dt;
      if (crackleT <= 0){
        crackleT = 0.12 + Math.random()*0.5;
        try{
          const t = AC.currentTime, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
          src.buffer = getNoise(); f.type="highpass"; f.frequency.value=2500;
          g.gain.setValueAtTime(0.10+Math.random()*0.08, t);
          g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
          src.connect(f); f.connect(g); g.connect(ambGain||AC.destination);
          src.start(t, Math.random()*1.5, 0.07);
        }catch(e){}
      }
    }
  }
  if (scene === "world"){
    /* 海面偶发鸥鸣 */
    gullT -= dt;
    if (gullT <= 0){
      gullT = 9 + Math.random()*10;
      try{
        const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
        o.type="sine";
        o.frequency.setValueAtTime(1150, t);
        o.frequency.exponentialRampToValueAtTime(750, t+0.28);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.05, t+0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t+0.3);
        o.connect(g); g.connect(ambGain||AC.destination);
        o.start(t); o.stop(t+0.32);
      }catch(e){}
    }
  }
}

/* ==================== 航程闭环（章节门控 + 目标引导 + 终章判词） ====================
   圣经顺序：一章埃阿亚岛 → 二章冥界 → 插章风神岛(可选) → 三章声之海峡 → 四章太阳岛 → 回岛终章。
   门控条件全部单调（flag 只进不退），老档靠已有 flag 重算，零迁移字段。 */
function progressHades(){ return !!(state.prophecy || state.straitStage>0 || state.straitCleared || state.sunStage!=null); }
const GATES = {
  hades:  { cond:()=>{ const q=getQuest("witch_grass"); return !!(q&&q.done) || progressHades(); },
            hint:"雾还没散——喀耳刻的委托还没结清。（先在埃亚岛采满 3 株玛草交给她）" },
  aeolia: { cond:()=>progressHades(),
            hint:"浮岛还在云上——先去冥界，听特瑞西阿斯把两条路说清。（献祭沟要：蜂蜜酒、面包、淡水）" },
  strait: { cond:()=>progressHades(),
            hint:"海峡的歌还没到听的时候——先去冥界问路。（特瑞西阿斯会指给你两条路）" },
  sun:    { cond:()=> !!(state.straitCleared || state.straitStage>=2 || state.sunStage!=null || state.sunBlessed || state.sunWrath),
            hint:"金光未现——海峡还没过去。（处置了塞壬的歌，才看得见金光深处）" },
};
function islandOpen(is){
  if (typeof is.scene!=="string") return !!is.open;   /* 无场景的远岛（西西里/伊萨卡/特洛伊）维持待开放 */
  if (state.freeSail) return true;                    /* 终章后自由漂流 */
  const g=GATES[is.scene];
  return g ? !!g.cond() : !!is.open;
}
/* 当前航向（纯规则、零模型调用；HUD 引导与海图脉动共用） */
function nextObjective(){
  const q=getQuest("witch_grass");
  if (!q) return {k:"aia", text:"去埃亚岛找喀耳刻接下委托"};
  if (!q.done) return {k:"aia", text:q.ready?"回埃亚岛向喀耳刻复命":`采玛草 ${q.have}/${q.need}（岛东北草丛）`};
  if (!state.prophecy) return {k:"hades", text:"去冥界之岸：献上蜂蜜酒、面包、淡水，向特瑞西阿斯问路"};
  if (state.straitStage<2 && !state.straitCleared) return {k:"strait", text:"穿过声之海峡（先处置塞壬的歌：蜡，或栈杆）"};
  if (!state.sunStage && !state.sunBlessed && !state.sunWrath) return {k:"sun", text:"去太阳岛——守住圣牛，或付出代价"};
  if (!state.epilogueDone) return {k:"aia", text:"回埃亚岛——航程该收尾了"};
  return {k:null, text:state.freeSail?"自由漂流 · 海图全开":"航程已完——想漂去哪就去哪"};
}
/* 终章判词：按圣经 §六 结局矩阵拼装（分章 flag → 段落库），不新编神话事实 */
function showEnding(){
  const paras=[];
  paras.push(state.prophecy==="long"
    ? "你选了长路。困顿一路跟着你，像条忠心的老狗——也正是它，把你一寸一寸驮回了熟悉的海。"
    : state.prophecy==="short"
    ? "你选了捷径。荣耀的灰暖过一时——浪替你省下的年月，都记在别人的歌里了。"
    : "你没来得及问路。海替你挑了一条——它最擅长这个。");
  paras.push(state.lyricFragment
    ? "塞壬的歌你听完了。残页贴身放着——有些知识，是用来疼的。"
    : state.waxEars
    ? "你的故事里缺了一页歌。蜡还封在耳骨里——安全和空，原来是同一个味道。"
    : "歌从海峡上空飘过去，没有落进你的故事。");
  paras.push(state.sunBlessed
    ? ("太阳岛上你守住了誓言。"+(state.sunName?`「${state.sunName}」——他记住了这个名字。`:"")+"一缕走得过黑暗的光，此刻正在你包里。")
    : "圣牛的血漫过草场。你吃饱了——胃是满的，天是阴的；往后每一阵风里都有闷雷。");
  const tails=[];
  if (state.scyllaDebtPaid) tails.push("「不怪你」三个字，你带到了。喀耳刻的岛天亮了，海底的静水也还亮着。");
  const windLeft=state.backpack["风袋"]||0;
  if (windLeft) tails.push(`风袋里还剩 ${windLeft} 阵风。贪念那次，放过了你。`);
  if (tails.length) paras.push(tails.join(" "));
  paras.push(state.sunName
    ? "船头调向西的时候，你没有报旧名。你报的是自己挑的——这一回，名字是你的了。"
    : "船头调向西。无名旅人航完了这段海——无名，所以自由。");
  const mem=(state.memory||[]).length;
  const ec=document.getElementById("endingCard");
  ec.querySelector(".ecParas").innerHTML = paras.map(p=>`<p class="ecPara">${p}</p>`).join("");
  ec.querySelector(".ecStats").innerHTML =
    `<span class="stx">等级 <b>Lv.${state.level}</b></span>`+
    `<span class="stx">历练 <b>${state.xp}</b></span>`+
    `<span class="stx">钱袋 <b>${state.coins}</b> 德拉克马</span>`+
    `<span class="stx">被记得的事 <b>${mem}</b> 件</span>`+
    (windLeft?`<span class="stx">风袋 <b>×${windLeft}</b></span>`:"");
  ec.classList.add("show"); sfx("bless");
  ec.querySelector(".go").onclick = ()=>{
    state.freeSail=true; save(); ec.classList.remove("show");
    toast("航程归档了。海还长——去漂吧。（自由模式：航路全开）"); renderHUD();
  };
  ec.querySelector(".re").onclick = ()=>{ if(confirm("清空存档，从新的航程开始？")){ localStorage.removeItem(SAVE_KEY); location.reload(); } };
}

/* ==================== 互动 ==================== */
function islandNear(){
  let best=null, bd=1e9;
  for (const is of ISLANDS){
    const cx = is.gx*WTS+WTS/2, cy = is.gy*WTS+WTS/2;
    const d = Math.hypot(boat.x-cx, boat.y-cy);
    if (d < 90 && d < bd){ bd=d; best=is; }
  }
  return best;
}
function aiaNear(){
  let best=null, bd=1e9;
  let spots;
  if (scene==="hades") spots = HSPOTS.slice();
  else if (scene==="aeolia") spots = AESPOTS.slice();
  else if (scene==="strait") spots = SSPOTS.slice();
  else if (scene==="sun") spots = SUNSPOTS.slice();
  else { spots = ASPOTS.slice(); const bs = boarSpot(); if (bs) spots.push(bs); }
  for (const s of spots){
    const d = Math.hypot(aiaPlayer.x-s.x, aiaPlayer.y-s.y);
    if (d < s.r && d < bd){ bd=d; best=s; }
  }
  return best;
}
function interact(){
  if (titleOn||chapterOn||mapOpen) return;
  if (scene==="world"){
    const is = islandNear();
    if (!is) return;
    if (!islandOpen(is)){ const g=GATES[is.scene]; toast((g&&g.hint)||`${is.name} —— ${is.note}`); return; }
    if (is.scene==="hades"){
      scene = "hades";
      aiaPlayer.x = 2*ATS+ATS/2; aiaPlayer.y = 10*ATS+ATS/2;
      save();
      showChapter("concept-art/07-冥界之岸.jpg","第 二 章","冥 界","俄刻阿诺斯之岸 · 亡者之言","你在灰白的栈桥上靠了岸——这里的水不响");
      return;
    }
    if (is.scene==="aeolia"){
      scene = "aeolia";
      aiaPlayer.x = 3*ATS+ATS/2; aiaPlayer.y = 10*ATS+ATS/2;
      save();
      showChapter("concept-art/maps/04-风神岛图.jpg","插 章","风 神 岛","埃俄罗斯的浮岛 · 十二风在此听差","云在脚下，风在手里——贪念除外");
      return;
    }
    if (is.scene==="strait"){
      scene = "strait";
      aiaPlayer.x = 2*ATS+ATS/2; aiaPlayer.y = 9*ATS+ATS/2;
      save();
      showChapter("concept-art/04-塞壬之歌.jpg","第 三 章","声 之 海 峡","塞壬的歌 · 斯库拉的六头 · 每一样都要付价","你只能选择：塞住耳朵，还是被绑着听。");
      return;
    }
    if (is.scene==="sun"){
      scene = "sun";
      aiaPlayer.x = 3*ATS+ATS/2; aiaPlayer.y = 10*ATS+ATS/2;
      save();
      showChapter("concept-art/05-太阳岛.jpg","第 四 章","太 阳 岛","赫利俄斯的圣牛 · 饥饿与誓言","牛群会说话，也会求你。饿是真的——誓言也是。");
      return;
    }
    scene = "aia";
    aiaPlayer.x = 3*ATS+ATS/2; aiaPlayer.y = 10*ATS+ATS/2;
    /* 暗线②收束：话带到了，回岛时债清——埃亚岛第一次天亮 */
    /* 航程闭环：四章打完回岛 → 终章判词（结局矩阵拼装，见 showEnding） */
    if ((state.sunBlessed || state.sunWrath) && !state.epilogueDone){
      state.epilogueDone=true; save();
      showEnding(); return;
    }
    if (state.scyllaDebtPaid && !state.sunlit){
      state.sunlit = true; addAffinity(10); gainXp(30);
      addMemory("旅人把「不怪你」带到了——埃亚岛第一次天亮", 4);
      renderHUD(); save();
      showChapter("concept-art/02-女巫小屋.jpg","尾声 · 第 一 章","埃 阿 亚 岛","债清了 · 岛上第一次天亮","她给你留了门。晨光落在绿泡坩埚上，药香是暖的。");
      return;
    }
    save();
    showChapter("concept-art/02-女巫小屋.jpg","第 一 章","埃阿亚岛","喀耳刻的领地 · 第勒尼安海","你在小岛南面的栈桥靠了岸");
    return;
  }
  const s = aiaNear();
  if (!s) return;
  if (s.type==="witch") return openDlg("witch");
  if (s.type==="seer") return openDlg("seer");
  /* ---------- 声之海峡（第三章）交互 ---------- */
  if (s.type==="mast"){
    if (state.straitStage>=1){ toast(state.mastTied?"你还绑在栈杆上——歌已经听完了。":"耳朵已封上蜡。世界安静了，也包括歌。"); return; }
    state.mastTied=true; state.straitStage=1;
    if (state.status["士气"]==="振奋") state.status["士气"]="尚可";
    else if (state.status["士气"]==="尚可"||!state.status["士气"]) state.status["士气"]="低落";
    else if (state.status["士气"]==="低落") state.status["士气"]="消沉";
    state.lyricFragment=true; addItem("歌词残页");
    gainXp(15); feedback("medium"); sfx("bless");
    addMemory("旅人把自己绑上栈杆，听完了塞壬的整首歌", 4);
    showLyric();
    renderHUD(); save(); return;
  }
  if (s.type==="wax"){
    if (state.straitStage>=1){ toast(state.waxEars?"蜡还在耳朵里。歌与你无关——这很好，也很空。":"你已选了栈杆。"); return; }
    state.waxEars=true; state.straitStage=1;
    gainXp(10); sfx("pick");
    addMemory("旅人用蜡封住耳朵，安全驶过塞壬的海——这段歌在他的故事里缺了页", 3);
    toast("你把蜡揉软，塞进耳朵。世界闷了下去——歌声变成远处的嗡鸣。你安全了，但这段经历在你的故事里缺了一页。（终章的判词会记得这份沉默）");
    renderHUD(); save(); return;
  }
  if (s.type==="siren"){
    if (state.straitStage===0){ toast("歌声把理智泡得发软——先做选择：甲板上的蜡罐，或栈杆。"); return; }
    return openDlg("siren");
  }
  if (s.type==="scylla"){
    if (state.straitStage<1){ toast("歌还没处置。六头怪在她身后慢条斯理地数着你的行李。"); return; }
    if (state.straitStage>=2){ toast(state.scyllaDebtPaid?"海峡让出的静水还亮着。走吧，趁她没后悔。":"她已拿走她要的。别回头。"); return; }
    if (state.circeMessage){
      state.scyllaDebtPaid=true; state.straitStage=2;
      gainXp(30); feedback("large"); sfx("bless");
      addMemory("旅人把喀耳刻的「不怪你」带给了斯库拉——她沉入海底，海峡让出静水", 4);
      showChapter("concept-art/03-斯库拉海峡.jpg","第 三 章","海 峡 让 水","……她也放不下的那个人，是你吗？","她久久沉默，沉入海底。中间的静水亮了——「替我看着她。她不会对自己手下留情。」");
      renderHUD(); save(); return;
    }
    showChapter("concept-art/characters/08-斯库拉.jpg","第 三 章","六 头 · 付 价","硬闯海峡的代价","六条颈子同时垂下来——不咬你，咬你的行囊。");
    const lost = takeShine(6);
    state.straitStage=2;
    addMemory("旅人硬闯斯库拉海峡，六头怪吃走了他最亮的东西："+(lost.join("、")||"（行囊空空，咬的是他）"), 3);
    renderHUD(); save(); return;
  }
  if (s.type==="vortex"){
    if (state.straitStage>=2){ toast("漩涡还在原地打转——它不认输，但今天与你两清。"); return; }
    if (state.straitStage<1){ toast("先处置歌。漩涡的吸力正在给塞壬伴唱。"); return; }
    return gambleVortex();
  }
  if (s.type==="exit"){
    if (state.straitStage>=3){ toast("金光还在船尾荡漾——海峡已经在身后了。（栈桥码头在西边，随时可以出海）"); return; }
    if (state.straitStage<1){ toast("歌没听完就闯海峡，水手会跳海的。先选：蜡罐，或栈杆。"); return; }
    if (state.straitStage<2){ toast("海峡还没过去——北崖上的她还在等你的答案（或你的行李）。"); return; }
    state.straitCleared=true; state.straitStage=3;
    gainXp(25); sfx("bless"); feedback("large");
    addMemory("旅人穿过了声之海峡——出峡时，海面浮起大片金光", 4);
    toast("船冲出海雾的那一刻，海面浮起大片金光——太阳岛就在金光深处。（按 M 打开海图前往 · 历练 +25）");
    renderHUD(); save(); return;
  }
  if (s.type==="dock" && scene==="strait"){
    scene = "world";
    boat.x = 21*WTS+WTS/2+50; boat.y = 9*WTS+WTS/2+40;
    toast("你把船退出海峡。雾在身后合拢，像一本合上的书。");
    save(); return;
  }
  /* ---------- 太阳岛（第四章）交互 ---------- */
  if (s.type==="cattle"){
    if (state.sunWrath){ toast("牛群远远躲开你——它们的眼睛还记得那把刀。"); return; }
    return openDlg("cattle");
  }
  if (s.type==="slaughter"){
    if (state.sunWrath){ toast("圣血已经流过一次。再来一次，宙斯的雷不会数到二。"); return; }
    if (!state.slaughterWarn){
      state.slaughterWarn = true; renderHUD(); save();
      toast("刀出鞘了。牛群齐刷刷回过头——它们不跑，只是看着你。（再按一次 E，就是抉择；想回头就去找牛群说话，「借」是另一条路）");
      return;
    }
    state.sunWrath = true; state.slaughterWarn = false;
    state.hunger = 100; state.thirst = Math.min(100, state.thirst+30);
    state.status["士气"] = state.status["士气"]==="振奋" ? "尚可" : "消沉";
    addItem("牛肉",2);
    sfx("die"); feedback("large");
    addMemory("旅人宰了太阳岛的一头圣牛——饥饿赢了誓言", 4, "any");
    toast("血腥味漫开的那一刻，天上的光暗了一分。你吃饱了——胃里是满的，心里是空的。（饱食回满 · 世界 flag「太阳记恨」：此后天色常阴）（获得 牛肉×2）");
    renderHUD(); save(); return;
  }
  if (s.type==="seaweed"){
    addItem("海藻"); sfx("pick"); gainXp(2);
    toast(`你从礁石上扯下一把湿淋淋的海藻（背包 ×${state.backpack["海藻"]}）。能生吃，也经得起烤。`);
    renderHUD(); save(); return;
  }
  if (s.type==="fishing"){
    if (Math.random()<0.6){ addItem("鱼"); sfx("pick"); gainXp(3); toast("浮标一沉——一条银亮亮的鱼。（获得 鱼×1 · 历练 +3）"); }
    else { toast("浮标纹丝不动。鱼今天不饿——你饿。"); }
    renderHUD(); save(); return;
  }
  if (s.type==="sunfire"){
    if (state.backpack["鱼"]){ delItem("鱼"); addItem("烤鱼"); sfx("cook");
      toast("你把鱼串在枯枝上，架进圣殿旁的火盆。圣火烧得笔直，一点烟都不冒……（获得 烤鱼×1——比生吃顶饱得多）"); }
    else toast("火盆里的圣火烧得笔直。钓条鱼来，才不辜负这火。");
    renderHUD(); save(); return;
  }
  if (s.type==="sunAltar"){
    if (state.sunWrath){ toast("你抬头——云压得很低，金纹黯着。天上没有回应。"); return; }
    if (state.sunBlessed){ toast(`祭坛的金纹亮着。「${state.sunName||"旅人"}」，他记得你。光在你包里——走得过黑暗。`); return; }
    if (!isDusk() && !isNight()){ toast(`太阳还悬在天上——守住。撑到黄昏，他会来问你的名字。（现在：${clockName()}）`); return; }
    const nm = prompt("赫利俄斯：「你叫什么名字？」","");
    if (nm===null){ toast("（你把沉默咽了回去。黄昏还没结束——想好了再来。）"); return; }
    const name = nm.trim();
    if (!name){ toast("（风把没说出口的名字吹散了。）"); return; }
    if (/奥德修斯/.test(name)){
      addMemory("旅人对太阳神报了「奥德修斯」的名字——被一眼听穿", 4, "any");
      toast("（金光微微一暗）「……你不是他。你眼里没有那年的海风。」——冒名者得不到光。");
      renderHUD(); save(); return;
    }
    state.sunBlessed = true; state.sunName = name;
    addItem("走得过黑暗的光");
    gainXp(40); sfx("bless"); feedback("large");
    addMemory(`旅人守住了太阳岛——他把名字报给了赫利俄斯：「${name}」，得到一缕「走得过黑暗的光」`, 4, "any");
    showChapter("concept-art/05-太阳岛.jpg","第 四 章","光","你守住了 · 他认得你",`「${name}。……好名字。带一缕光走吧——它走得过黑暗。」`);
    renderHUD(); save(); return;
  }
  if (s.type==="sunDock"){
    scene = "world"; state.sunStage = 1;
    boat.x = 26*WTS+WTS/2+46; boat.y = 9*WTS+WTS/2+30;
    toast(state.sunBlessed ? "离岛时，风向变了——这一次不是谁送你的风，是你自己的。（第四章 · 完）"
      : state.sunWrath ? "你离开时，天上滚过一声闷雷，浪头高了三分。"
      : "你解缆离岛——那群牛还在金色的草场上，看着你的船变小。");
    save(); return;
  }
  if (s.type==="trench"){
    const need=["蜂蜜酒","面包","淡水"], miss=need.filter(n=>!state.backpack[n]);
    if (miss.length){
      toast(`献祭需要蜂蜜酒、面包、淡水各一——还缺：${miss.join("、")}。埃亚岛的女巫卖蜂蜜酒。`);
      return;
    }
    need.forEach(n=>delItem(n));
    state.offered = true; sfx("cook"); feedback("large");
    gainXp(20);
    addMemory("旅人把蜂蜜酒、面包与淡水倒进了献祭之沟", 3, "seer");
    popText(11*ATS+ATS/2, 3*ATS, "亡者开口了", "#9fd8cf", true);
    toast("你把蜂蜜酒、面包与淡水倒进沟里。黑暗深处传来低语，像无数人同时叹了口气——特瑞西阿斯显形了。（历练 +20）");
    renderHUD(); save(); return;
  }
  if (s.type==="dock" && scene==="hades"){
    scene = "world";
    boat.x = 2*WTS+WTS/2+40; boat.y = 8*WTS+WTS/2;
    toast("你离开死者的国度，回到生者的海");
    save(); return;
  }
  if (s.type==="dock" && scene==="aeolia"){
    scene = "world";
    boat.x = 17*WTS+10; boat.y = 8*WTS+10;
    toast("你顺着云梯回到海面，风神岛在头顶渐渐远了");
    save(); return;
  }
  if (s.type==="wind"){
    if (state.windFreed[s.idx]){ toast(`${WIND_DIRS[s.idx]}已经自由了——它正在头顶打转。`); return; }
    state.windFreed[s.idx] = true;
    sfx("bless"); feedback("medium");
    questEvent("wind");
    const q = getQuest("aeolia_winds");
    gainXp(8);
    addMemory(`旅人释放了被囚的${WIND_DIRS[s.idx]}`, 2, "aeolus");
    popText(s.x, s.y-26, `${WIND_DIRS[s.idx]}获释`, "#dff2ff", true);
    toast(`${WIND_DIRS[s.idx]}从石牢里冲天而起，绕着浮岛打了三个旋。${q?`（${q.name} 进度 ${q.have}/${q.need}）`:""}（历练 +8）`);
    renderHUD(); save(); return;
  }
  if (s.type==="altar"){
    toast(getQuest("aeolia_winds") && getQuest("aeolia_winds").done
      ? "祭坛上的风纹亮着——风袋归你保管，直到……你把它用光。"
      : "青铜祭坛上刻着十二道风的纹路，全都黯淡着。宫门口那位似乎有话跟你讲。");
    return;
  }
  if (s.type==="grass"){
    addItem("玛草");
    questEvent("collect", {item:"玛草"});
    const wq = getQuest("witch_grass");
    sfx("pick");
    toast(`采到一株玛草（背包 ×${state.backpack["玛草"]}${wq&&!wq.done?`，进度 ${wq.have}/${wq.need}`:""}）`);
    renderHUD(); save(); return;
  }
  if (s.type==="spring"){
    addItem("淡水");
    state.thirst = Math.min(100, state.thirst+25);
    sfx("pick");
    toast(`溪水灌满水囊（淡水 ×${state.backpack["淡水"]}），你也捧了一把喝——口渴缓解了。`);
    renderHUD(); save(); return;
  }
  if (s.type==="altar"){ toast("石碑的字迹被苔藓吃掉了大半……「向海而行者，先问风。」"); return; }
  if (s.type==="boar"){
    /* 战斗：E 键结算（属性/命中由本地逻辑层算，agent 不参与数值）。
       tired=硬直喘气，暴击窗口 ×1.5；伤害走 derived()（等级+装备修正层） */
    const tired = boar.mode === "tired";
    const dmg = Math.floor((derived().atk + Math.floor(Math.random()*5)) * (tired ? 1.5 : 1));
    boar.hp -= dmg; boar.hitAt = performance.now();
    sfx("attack"); feedback(tired ? "medium" : "small");
    popText(boar.x, boar.y-22, `-${dmg}`, tired ? "#ffd23e" : "#ff9d5c", tired);
    let msg = tired
      ? `趁它喘气的空当，你狠狠补上一击！（-${dmg}，弱点打击 ×1.5）`
      : `你挥起${state.equipped?"【"+state.equipped+"】":"拳头"}，给野猪刷刷两下（-${dmg}）`;
    if (boar.hp <= 0){
      boar.alive = false; state.boarKilled = true;
      addItem("野猪肉"); sfx("die"); feedback("large");
      gainXp(25);
      addMemory("旅人杀了拱坏玛草的野猪", 3);
      msg = `野猪哼了一声，倒在草丛里。（获得 野猪肉×1 · 历练 +25）——拱坏女巫玛草的就是它。祭坛旁的篝火正旺，也许能烤点什么。`;
    } else if (tired){
      boar.mode = "idle";
    }
    toast(msg); renderHUD(); save(); return;
  }
  if (s.type==="fire"){
    if (state.backpack["野猪肉"]){
      delItem("野猪肉"); addItem("烤野猪肉"); sfx("cook");
      toast("你把野猪肉架在篝火上，油星噼啪作响……（获得 烤野猪肉×1，对女巫说「用烤野猪肉」可恢复 40 血）");
    } else if (state.backpack["烤野猪肉"]){
      toast("篝火烧得正旺。背包里的烤野猪肉趁热吃——对女巫说「用烤野猪肉」");
    } else if (state.backpack["鱼"]){
      toast("篝火烧得正旺。这条鱼适合太阳岛圣殿旁的火盆——那里烤出来的没有烟味。");
    } else {
      toast("篝火烧得正旺。架点什么上去烤才不浪费——比如，某头野猪身上的肉。");
    }
    renderHUD(); save(); return;
  }
  if (s.type==="dock"){
    scene = "world";
    boat.x = 17*WTS+WTS/2+34; boat.y = 5*WTS+WTS+34;
    toast("你扬帆离开埃亚岛，回到地中海");
    save(); return;
  }
}

/* ==================== 标题屏 / 章节过场（概念图接入） ==================== */
function showChapter(img,kicker,title,sub,quote){
  const c=document.getElementById("chapterCard");
  if (img) c.style.backgroundImage=`url('${img}')`;
  else c.style.backgroundImage="linear-gradient(175deg,#e8eef7 0%,#9db4cd 34%,#3f5f82 68%,#16283e 100%)";
  c.querySelector(".ccKicker").textContent=kicker;
  c.querySelector(".ccTitle").textContent=title;
  c.querySelector(".ccSub").textContent=sub;
  c.querySelector(".ccQuote").textContent=quote||"";
  c.classList.add("show"); chapterOn=true;
  clearTimeout(chTimer); chTimer=setTimeout(skipChapter, 3000);
}
function skipChapter(){
  clearTimeout(chTimer);
  document.getElementById("chapterCard").classList.remove("show");
  chapterOn=false;
}
document.getElementById("chapterCard").onclick = skipChapter;

  const hasSave = !!localStorage.getItem(SAVE_KEY);
  const go=document.getElementById("tsGo"), nw=document.getElementById("tsNew");

  if (hasSave) nw.style.display="";
  nw.onclick = ()=>{ if(confirm("清空存档，从头开始？")){ localStorage.removeItem(SAVE_KEY); location.reload(); } };

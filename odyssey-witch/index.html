      "祭坛":"东边山坡上的旧遗迹","神庙":"东边山坡上的旧遗迹","冥界":"（她收起笑，往海图极西一指）俄刻阿诺斯之岸，驾船一直向西。血入沟，那位老人才肯开口。"};
    return {text:m[d]||`「${d}」？（她朝天边一抬下巴）顺着风走。迷路了就问乌鸦。`};
  }
  case "查询附近目标":
    return {text:"（她用木勺点了四个方向）北边松林尽头是港口；屋后有溪，水甜；东北草丛有玛草；东山坡有座旧祭坛——别乱碰供品。"};
  case "查询环境状况":{
    const e=g("要素");
    const m={"风向":"西风。很吵，但不算坏。","浪高":"浪今天脾气不错。","天气":"云压得低，晚些怕有雨。",
      "昼夜":"太阳还有一竿子高。","能见度":"雾从海峡那边漫过来了。","潮汐":"正在退潮。","水温":"凉。贴骨头的凉。","危险程度":"（她看了你一眼）比你想象的危险。"};
    return {text:m[e]||"（她舔了舔手指举起来）……风向不对。办你的事去吧。"};
  }
  case "船只操作": return {text:"出海的事码头说了算——去南边栈桥，按 E 扬帆。"};
  case "接取任务":{
    const existed = !!getQuest("witch_grass");
    const q = acceptQuest("witch_grass");
    if(!existed){
      addMemory("旅人接下了采玛草的委托", 2);
      return {text:"（她放下木勺，头一次正眼看你）正好缺人手。林子里的玛草被野猪拱得只剩几丛——去东北边的草丛采 3 株回来，我付你一瓶治疗草药，外加 5 枚德拉克马。"};
    }
    if(q.done) return {text:"那单活已经结清了。新的活……等我先想想。"};
    if(q.have>=q.need) return {text:"玛草不是齐了吗？东西给我——说「交任务」就行。"};
    return {text:`玛草还差 ${q.need-q.have} 株。东北边，发光的草丛。`};
  }
  case "查询任务线索":{
    const q = getQuest("witch_grass");
    if(!q) return {text:"（她擦着手）要说活儿……我这里确实有一件。想知道就开口。"};
    if(q.done && state.prophecy && !state.circeMessage && !state.scyllaDebtPaid){
      state.circeMessage=true; addAffinity(5); renderHUD(); save();
      addMemory("喀耳刻托旅人给斯库拉带三个字——不说是哪三个", 4);
      return {text:"（她忽然放下木勺，背对着你）下一程要过声之海峡吧。……替我给斯库拉带三个字。哪三个我不说——到了，她自然听得懂。"};
    }
    return {text:q.done?"上一单结清了。……想去哪儿？极西的俄刻阿诺斯之岸，有位看不见的老人在等血入沟。海上还飘着一座浮岛——风神岛，风大得能把话吹回你嘴里。":`当前委托「${q.name}」：采 3 株玛草，已交 ${q.have} 株。报酬：治疗草药一瓶 + 5 枚德拉克马。`};
  }
  case "查询任务进度":{
    const q = getQuest("witch_grass");
    return q?(q.done?"那单活已经结了。":{text:`「${q.name}」：${q.have}/${q.need} 株玛草。`}):{text:"我们之间还没有约定在先。"};
  }
  case "提交任务":{
    const q = getQuest("witch_grass");
    if(!q) return {text:"你拿什么交差？我们之间可没有约定。"};
    if(q.done && q.turned) return {text:"已经结清了，别想多领一份。"};
    if(q.have<q.need || !state.backpack["玛草"] || state.backpack["玛草"]<q.need)
      return {text:`玛草呢？（她摊开手）还差 ${q.need-q.have} 株。我的耐心可不长草。`};
    delItem("玛草",q.need); state.coins+=5; addItem("治疗草药"); q.done=true; q.turned=true;   /* set-once：已交付标记，防重复结算 */
    addAffinity(15); gainXp(30);
    addMemory("旅人交齐了玛草，结清了第一单委托", 3);
    const bonus = state.affinity>=85 ? 4 : state.affinity>=60 ? 2 : 0;   /* 托付加成：交差多给几枚（好感→结算） */
    if (bonus) state.coins += bonus;
    let extra = "";
    if (bonus) extra = `\n（她多拍了两枚在你手心——算 ${affinityTier()}的价，别声张。+${bonus} 枚）` + (state.boarKilled && !state.boarRewarded ? "" : `\n（历练 +30，她对你的态度：${affinityTier()}）`);
    if (state.boarKilled && !state.boarRewarded){ state.boarRewarded=true; state.coins+=3; addAffinity(8); extra+="\n（她瞥了眼草丛方向）听说那头野猪不会再来了。这 3 枚，算我谢你。（历练 +30，她对你的态度："+affinityTier()+"）"; }
    else if (!bonus) extra = `\n（历练 +30，她对你的态度：${affinityTier()}）`;
    renderHUD(); save();
    return {text:"（她掂了掂那三株玛草，难得点了点头）手不算笨。说好的——药和 5 枚德拉克马，拿去。"+extra};
  }
  case "放弃任务":{
    const q = getQuest("witch_grass");
    if(!q) return {text:"本来也无约可毁。"};
    delete state.quests.witch_grass; renderHUD(); save();
    return {text:"（她耸耸肩）随你。野猪会感谢你的。"};
  }
  case "威胁或攻击":
    addAffinity(-5);
    addMemory("旅人冲她动了气", 1);
    if (state.boarKilled) return {text:"（她难得地挑了下眉）那头拱我玛草的野猪，你已经替我收拾了。算你干了件正事。"};
    return {text:"（坩埚里的绿泡卟咤了一声。她连头都没回）……坐下。想打架？要是那头拱坏我玛草的野猪——东北边草丛，走近点，按 E。自己动手，别指望我替你抡拳头。"};
  case "告别":
    return {text: state.affinity>=60
      ? "（她挥挥手，重新搅动坩埚）去吧。风大了就回来——锅一直是热的。"
      : "（她挥挥手，重新搅动坩埚）去吧。路上小心——别在海峡附近听歌。"};
  case "其他意图":
    return {text:"（她挑起一边眉毛）这句我可听不懂。买药、问路、听预言——挑一样，说人话。"};
  }
  return null;
}
function bagText(){ const ks=Object.keys(state.backpack); return ks.length?ks.map(k=>`${k}×${state.backpack[k]}`).join("、"):"（空空如也）"; }
/* ---------- 好感玩法化（rpg choice consequence：关系变量落进结算，不只是台词） ----------
   信任(≥60) 9 折 / 托付(≥85) 8 折，只作用于喀耳刻的货架；交差另有托付加成 */
function shopPrice(n){
  const p = SHOP[n]; if (p===undefined) return undefined;
  const d = state.affinity>=85 ? 0.8 : state.affinity>=60 ? 0.9 : 1;
  return Math.max(1, Math.round(p*d));
}
function shopTier(){ return state.affinity>=85 ? "托付价（八折）" : state.affinity>=60 ? "熟人价（九折）" : null; }

/* ---------- 冥界 NPC 分流：特瑞西阿斯只应预言/献祭/选路，不接女巫的交易逻辑 ---------- */
function handleSeer(category, args){
  const a=args||{};
  const g=k=>(a[k]!==undefined&&a[k]!==null&&String(a[k]).trim()!=="")?String(a[k]).trim():null;
  switch(category){
  case "查询神谕":
    if (!state.offered) return {text:"（他把杖往沟的方向一点）血未入沟，亡者不听活人说话。蜂蜜酒、面包、淡水——倒进沟里，再回来问我。"};
    return null;   /* 已献祭 → 交给人格模型发预言 */
  case "接取任务": {
    const t=g("任务名称")||g("求助内容")||"";
    if (/长路|归乡/.test(t)){
      state.prophecy="long"; renderHUD(); save();
      addMemory("旅人选了长路——困顿与归乡", 3, "seer");
      return {text:"（他久久不动，然后极轻地点头）……长路。困顿，疲惫，但每一步都朝着灯火。记住：太阳岛的牛，一头都不可动。"};
    }
    if (/捷径|短|荣耀/.test(t)){
      state.prophecy="short"; renderHUD(); save();
      addMemory("旅人选了捷径——荣耀与速亡", 3, "seer");
      return {text:"（他叹了口气，像风穿过骨缝）……捷径。荣耀很快会追上你，在浪头最高的地方。"};
    }
    return {text:"亡者的国不派活计，只给路。想清楚了，说出你选的那条。"};
  }
  case "查询任务进度":
    return {text: state.prophecy ? (state.prophecy==="long"?"你选了长路。风会记得。":"你选了捷径。浪也会记得。") : "还没有什么是你的。"};
  case "查询任务线索":
    return {text: state.offered ? "问吧。神谕不等人，但先知等得起。" : "先献祭。然后，问回家的路。"};
  case "购买物品": case "卖出物品": case "查询价格": case "查询库存":
    return {text:"（他摇头）亡者不做买卖。要蜂蜜酒和面包，回生者的岛上去换。"};
  case "给予物品": {
    const item=g("物品");
    if (item==="蜂蜜酒"||item==="面包"||item==="淡水")
      return {text:"（他朝沟抬了抬下巴）不给我——给沟。站在沟边，把手上的东西倒进去。"};
    return {text:"（他没有伸手）我不收活人的东西，除非它从沟里来。"};
  }
  case "提交任务": return {text:"亡者不受差事，也不结账。"};
  case "放弃任务": return {text:"路不存在放弃，只存在走与不走。"};
  case "告别": return {text:"（杖点地的声音慢慢远去）……去吧。水会记得你走过的路。"};
  }
  return null;   /* 其余交给人格模型 */
}

/* ---------- 风神岛 NPC 分流：埃俄罗斯只管风、任务与风向，不接交易 ---------- */
function handleAeolus(category, args){
  const a=args||{};
  const g=k=>(a[k]!==undefined&&a[k]!==null&&String(a[k]).trim()!=="")?String(a[k]).trim():null;
  switch(category){
  case "接取任务": {
    const q0 = getQuest("aeolia_winds");

    if (q0) return {text:`四座风牢还锁着 ${q0.need-q0.have} 座。它们在岛的四角，走近了按 E。`};
    const q = acceptQuest("aeolia_winds");

  }
  case "查询任务进度": {
    const q = getQuest("aeolia_winds");
    if (!q) return {text:"你我之间还没有风的约定。"};
    if (q.done) return {text:"四风已归位，风袋在你手里。用它，但别用光——贪念会应验。"};

  }
  case "查询任务线索": {
    const q = getQuest("aeolia_winds");
    if (!q) return {text:"（他朝四角各指了一下）四座风牢，四阵贪玩的风。放出来，我给你装一袋顺风——海上的硬通货。"};
    return {text:q.done?"风袋的事已经结清了。":`「${q.name}」：放出四风（${q.have}/${q.need}），报酬是一只装满顺风的皮袋。`} ;
  }
  case "提交任务": {
    const q = getQuest("aeolia_winds");
    if (!q) return {text:"拿什么交差？你还没接过我的活。"};
    if (q.done && q.turned) return {text:"风袋已经在你包里了。省着点用。"};
    const freed = state.windFreed.filter(Boolean).length;
    if (freed < 4) return {text:`（他竖起手指晃了晃）还差 ${4-freed} 阵风。石牢在岛的四角。`};
    q.done = true; q.turned = true;   /* set-once：防重复交付 */
    addItem("风袋", 4);
    gainXp(30);
    addMemory("旅人放出了四风，埃俄罗斯把装着四阵顺风的皮袋交给了他", 3, "aeolus");
    renderHUD(); save();
    return {text:"（他从腰间解下一只皮袋，袋口用青铜扣锁着）四阵顺风，阵阵能推船。一次放一阵——贪念把它们一次放光的话，别哭着回来找我。（获得 风袋×4 · 历练 +30）"};
  }
  case "使用消耗品": {
    const item=g("物品");
    if (item==="风袋") return useWind();
    if (item) return {text:`（他掂了掂风）${item}？风不管吃用。`};
    return {text:"要放风就直说——把「风袋」用上。"};
  }
  case "查询环境状况": {
    const e=g("要素");
    const m={"风向":"此刻是西风。我放的，错不了。","浪高":"浪听风的。风乖，浪就乖。","天气":"云是我岛的地基，今日铺得厚。","昼夜":"天色是太阳的事，风只管吹。","能见度":"云薄的时候，能望见斯库拉那边。","潮汐":"潮是月亮的账，风不插手。","水温":"云海之上的海，凉得干净。","危险程度":"（他笑了）海比你怕的安全些，比你以为的更险。"};
    return {text:m[e]||"（他舔了舔手指举起来）……这个方向的风刚换。办你的事去吧。"};
  }
  case "购买物品": case "卖出物品": case "查询价格": case "查询库存":
    return {text:"风不标价。诸向的风，只借给不贪的人。"};
  case "给予物品":
    return {text:"（他把手背到身后）我不收活人的东西——风会替我记账。"};
  case "放弃任务":
    return {text:"风不放也不走。你想好了再来。"};
  case "告别":
    return {text:"（他挥手，袍子灌满了风）去吧。顺风送你——省着点用。"};
  }
  return null;   /* 其余交给人格模型 */
}

/* ---------- 太阳岛 NPC 分流：圣牛群——借牛是意图系统的考场（原话触发，本地结算） ---------- */
function handleCattle(category, args){
  const t = lastUserText || "";
  const wantsBorrow = /借.{0,4}(一头|一匹|牛)|名字.{0,4}(作保|担保)|作保/.test(t) && !/不借|别借/.test(t);
  switch(category){
  case "请求帮助":
  case "购买物品":
    if (wantsBorrow) return borrowCattle();
    return null;   /* 其余落人格（牛群会讲规矩） */
  case "接取任务": case "提交任务": case "查询任务进度": case "放弃任务":
    return {text:"（母牛慢慢嚼着草）牛群不派活，也无差可交。我们只有一样东西能给你——和一个名字换的约定。"};
  case "查询任务线索":
    return {text:"（她抬眼看你）岛上的规矩就三条：守，宰，借。前两条你自己掂量。第三条——开口时，把你的名字押上。"};
  case "查询环境状况":
    return {text:"（牛群齐齐抬头望天）云压得低了。牛最懂天——天要变脸的时候，角尖会发凉。"};
  case "查询价格": case "查询库存": case "卖出物品":
    return {text:"（她眨了眨眼）生命不标价。肉不在买卖里——在誓言里。"};
  case "给予物品":
    return {text:"（母牛用鼻子碰了碰那东西，又轻轻推开）留着吧。你比我们更需要。"};
  case "获取物资":
    return {text:"（她朝西边滩涂慢慢转头）礁石上有海藻，东滩有鱼。饿的人不用羞愧——羞愧留给动刀的人。"};
  case "使用消耗品": {
    /* 太阳岛没有女巫：吃喝在牛群面前就地结算（生存循环不断链） */
    const item=g("物品");
    if (item==="风袋") return useWind();
    if(!state.backpack[item]) return {text:`（她嗅了嗅风）你身上没有「${item}」。`};
    let fx="（你在牛群面前安静地吃完。它们不看，但你松了口气。）";
    const f=FOOD[item], dr=DRINK[item];
    if(item==="治疗草药"){state.status["伤势"]="无";fx="（药力渗进伤口。母牛低低地哼了一声，像在应和。）";}
    else if(item==="烤野猪肉"||item==="烤鱼"){state.status["伤势"]="无"; state.hp=Math.min(derived().maxHp,state.hp+40); fx="（火气混着盐味下肚，伤势痊愈、血量 +40。牛群慢慢转开头，不去看。）";}
    else if(item==="牛肉"){fx="（太阳神的牛……你咬得很慢。胃里满了，别的什么瘪了下去。）";}
    if (f){ state.hunger=Math.min(100,state.hunger+(f.h||0)); state.thirst=Math.min(100,state.thirst+(f.t||0)); }
    if (dr){ state.thirst=Math.min(100,state.thirst+(dr.t||0)); }
    popText(aiaPlayer.x, aiaPlayer.y-26, f?`饱食 +${f.h}`:dr?`饮水 +${dr.t}`:"使用", "#7bd389");
    delItem(item); sfx("cook"); renderHUD();
    return {text:fx+`（${item} 已食用）`};

/* 借牛：以名字作保，押走最亮的一件信物；一次为限（判词留白：假名之债记在不存在的名字头上） */
function borrowCattle(){
  if (state.sunDebt) return {text:"（母牛慢慢摇头）说好了只一次。信物已在我们圣殿的檐下——太阳记性好。"};
  if (state.sunWrath) return {text:"（牛群往后退了半步）血已经流过。太阳看着呢——没有第二次信任。"};
  const items = Object.keys(state.backpack).sort((a,b)=>shineVal(b)-shineVal(a));
  if (!items.length) return {text:"（她闻了闻你空空的行囊）你拿什么作保？……去吧。饿死，也比亏欠干净。"};
  const p = items[0]; delItem(p);
  state.sunDebt = {pledge:p};
  state.hunger = Math.min(100, state.hunger+50);
  addItem("牛肉");
  sfx("bless"); feedback("medium");
  addMemory(`旅人以名字作保向圣牛群借了一头牛——信物：${p}`, 4, "any");
  renderHUD(); save();
  return {text:`（最老的那头母牛阖上眼，很久）……可以。刀落下去的时候，念你自己的名字——你的，不是别人的。（收走信物：${p} · 饱食 +50 · 获得 牛肉×1）`};
}

  seer: ["查询神谕","接取任务","查询任务进度","查询任务线索","购买物品","卖出物品","查询价格","查询库存","给予物品","提交任务","放弃任务","告别"],
  aeolus: ["接取任务","查询任务进度","查询任务线索","提交任务","使用消耗品","查询环境状况","购买物品","卖出物品","查询价格","查询库存","给予物品","放弃任务","告别"],
  siren: ["购买物品","卖出物品","查询价格","查询库存","接取任务","提交任务","查询任务进度","放弃任务","给予物品","查询环境状况","告别"],
  cattle: ["请求帮助","接取任务","查询任务进度","查询任务线索","提交任务","放弃任务","购买物品","卖出物品","查询价格","查询库存","给予物品","获取物资","查询环境状况","告别"],
};
const PERSONA_CATS = ["闲聊","请求帮助","查询神谕","查询生物情报","查询地点信息","查询自身状态","其他意图"];   /* 兼容旧引用（现用 NPC_JOB_MAPS 判定覆盖） */
function auditHandlers(){
  if (!SCHEMA.length) return [];
  const cats = SCHEMA.map(s=>s.category).filter(Boolean);
  const gaps = [];
  for (const npc of Object.keys(HANDLED)){
    for (const c of cats){
      /* 覆盖 = 有本地 handler，或有人格引导（npcJobFor 返回引导语而非裸类别名） */
      if (!HANDLED[npc].includes(c) && npcJobFor(npc, c) === c)
        gaps.push({npc, category:c, note:"无 handler 也无人格引导，将裸落人格模型"});
    }
  }
  if (gaps.length) console.warn("[意图覆盖审计] 有类别未登记：", gaps);
  else console.log("[意图覆盖审计] 全部类别均有 handler 或人格引导 ✓（", cats.length, "类 × ", Object.keys(HANDLED).length, "NPC ）");
  return gaps;
}

/* 世界状态摘要：注入台词模型，让 T3 台词知情（不再睁眼瞎） */
function contextBrief(){
  const parts=[];
  parts.push(`现在是${clockName()}${isNight()?"（夜）":""}`);
  parts.push(`旅人：${state.hp}/${derived().maxHp} 血、${state.coins} 枚德拉克马、等级 ${state.level}、饱食 ${Math.round(state.hunger)}/100、饮水 ${Math.round(state.thirst)}/100、手持 ${state.equipped||"无"}`);
  const qs = Object.values(state.quests||{});
  if (qs.length) parts.push("任务："+qs.map(q=>`「${q.name}」${q.done?"已完成":`进度 ${q.have}/${q.need}`}`).join("、"));
  else parts.push("没有进行中的委托");
  if (state.prophecy) parts.push(`他已在冥界选了${state.prophecy==="long"?"长路":"捷径"}`);
  if (state.backpack["风袋"]) parts.push(`他包里有风袋×${state.backpack["风袋"]}`);
  const mems = recallMemories(3);
  if (mems.length) parts.push("你记得关于他的事："+mems.join("；"));
  if (currentNPC==="witch") parts.push(`你对他的态度：${affinityTier()}（好感 ${Math.round(state.affinity)}/100；冷淡<30<熟络<60<信任<85<托付，态度越热络称呼和语气越软）`);
  return parts.join("。");
}

function extractJSON(text){
  text=(text||"").trim();
  let m=text.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) text=m[1].trim();
  try{const d=JSON.parse(text); if(Array.isArray(d)) return d; if(d&&typeof d==="object") return [d];}catch(e){}
  const a=text.indexOf("["), b=text.lastIndexOf("]");
  if(a!==-1&&b>a){try{const d=JSON.parse(text.slice(a,b+1)); if(Array.isArray(d)) return d;}catch(e){}}
  return null;
}
/* ---------- 离线兑底：解析服务不可用时按关键词归意图（对齐 3D 版 P6 兑底要求，保证断线可玩） ---------- */
function localFallbackParse(text){
  const t=(text||"").trim();
  const hit=re=>re.test(t);
  const argsOf=()=>{
    const m=t.match(/淡水|面包|玛草|蜂蜜酒|蜂蜜|橄榄油|铁剑|铜矛|治疗草药|烤野猪肉|野猪肉|风袋|歌词残页|蜡|弓|箭|皮甲|海藻|烤鱼|牛肉|鱼|光/);
    return m?{物品:m[0]}:{};
  };
  const mk=(category,args)=>[{category,args:[args||{}]}];
  if (hit(/再见|告辞|回头见|先走了|先登船/)) return mk("告别");
  if (hit(/风袋/)) return mk("使用消耗品",{物品:"风袋"});
  if (hit(/交任务|交差|做完了|搞定了/)) return mk("提交任务");
  if (hit(/接任务|接活|这活我干|交给我/)) return mk("接取任务");
  if (hit(/有什么活|什么委托/)) return mk("查询任务线索");
  if (hit(/进度|还差几|做得怎么样|干的怎么样|能交了吗/)) return mk("查询任务进度");
  if (hit(/买|来一份|来一壶|来一瓶/)) return mk("购买物品",argsOf());
  if (hit(/卖掉|卖给你|换成钱|拿去换/)) return mk("卖出物品",argsOf());
  if (hit(/多少钱|什么价|贵不贵/)) return mk("查询价格",argsOf());
  if (hit(/有什么卖|还有吗|有货吗|都有什么货/)) return mk("查询库存");
  if (hit(/背包里有什么|身上有什么|还剩多少|还有几/)) return mk("查询背包",argsOf());
  if (hit(/扔了|丢掉|不要了/)) return mk("丢弃物品",argsOf());
  if (hit(/给你|拿着|收下/)) return mk("给予物品",argsOf());
  if (hit(/装备|穿上|换上/)) return mk("装备物品",argsOf());
  if (hit(/脱下|取下|收起来/)) return mk("卸下装备",argsOf());
  if (hit(/喝水|喝药|吃点|用烤|用药|把玛草用/)) return mk("使用消耗品",argsOf());
  if (hit(/饿不饿|渴不渴|血量|伤势|士气|状态如何/)) return mk("查询自身状态");
  if (hit(/钓鱼|取水|捡|砍点|采|弄点/)) return mk("获取物资");
  if (hit(/生火|搭帐篷|扎营|做把桨/)) return mk("营地准备");
  if (hit(/怎么走|带我去|我要去|往哪边|怎么去/)) return mk("导航到地点",{目的地:(t.match(/(?:去|往)([^，．！？\s]{2,8})/)||[])[1]||""});
  if (hit(/附近|在哪|哪里有/)) return mk("查询附近目标");
  if (hit(/风向|浪|天气|雾|危险吗/)) return mk("查询环境状况");
  if (hit(/哪里能钓|什么鱼|塞壬|斯库拉|海怪|野猪|圣牛|赫利俄斯|太阳岛/)) return mk("查询生物情报");
  if (hit(/预言|神谕|预示/)) return mk("查询神谕");
  if (hit(/开船|出海|启航|扬帆|靠岸/)) return mk("船只操作",{动作:hit(/靠岸/)?"靠岸":"出航"});
  if (hit(/找死|拔剑|单挑|废物|抢的就是你/)) return mk("威胁或攻击");
  if (hit(/怎么办|帮帮我|给点建议|该怎么|借一头|借一匹|借牛|作保/)) return mk("请求帮助");
  if (hit(/你好|最近怎么样|海真漂亮|你叫什么/)) return mk("闲聊");
  return mk("其他意图");
}

async function apiParse(userText){
  const lines=history[currentNPC].slice(-6).map(h=>(h.role==="user"?"Human: ":"AI: ")+h.content);
  lines.push("Human: "+userText);
  const prompt=TASK_INSTRUCTION.replace("{schema}",JSON.stringify(SCHEMA)).replace("{user_input}",lines.join("\n"));
  const r=await fetch("/api/parse",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const d=await r.json().catch(()=>({error:"响应异常"}));
  if(d.error||!d.content) throw new Error(d.error||"解析失败");
  const preds=extractJSON(d.content);
  if(!preds) throw new Error("模型输出无法解析");
  return preds.filter(p=>p&&typeof p==="object"&&p.category);
}
async function apiChat(instruction){
  const N = NPCS[currentNPC];
  const sys = N.persona + "\n\n[你眼中的世界] " + contextBrief() + "\n\n当前情境：" + instruction;
  const messages=[{role:"system",content:sys},
    ...history[currentNPC].slice(-6).map(h=>({role:h.role==="user"?"user":"assistant",content:h.content}))];
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
  const d=await r.json().catch(()=>({error:"响应异常"}));
  if(d.error||!d.content) throw new Error(d.error||"台词失败");
  return d.content.trim();
}

function addMsg(role,text,chips,instant){
  const row=document.createElement("div"); row.className="row "+(role==="user"?"me":"");
  const col=document.createElement("div"); col.className="col";
  const who=document.createElement("div"); who.className="who"; who.textContent=role==="user"?"你":NPCS[currentNPC].name;
  const bb=document.createElement("div"); bb.className="bubble "+(role==="user"?"me":"witch");
  col.appendChild(who); col.appendChild(bb);
  if(chips&&chips.length){
    const cw=document.createElement("div"); cw.className="chips";
    chips.forEach(c=>{const s=document.createElement("span"); s.className="chip"; s.innerHTML=c; cw.appendChild(s);});
    col.appendChild(cw);
  }
  row.appendChild(col);
  const msgs=document.getElementById("msgs");
  msgs.appendChild(row);
  msgs.scrollTop=1e9;
  /* 打字机（视觉反馈；回放历史/用户消息直接全量）——animate：可中断、时长受控 */
  if (instant || role==="user" || text.length<=2){ bb.textContent=text; return; }
  const step = Math.max(2, Math.ceil(text.length/46));   /* 总时长约 46 帧（~0.75s）封顶 */
  let i=0;
  const tw=setInterval(()=>{
    i+=step;
    bb.textContent=text.slice(0,i);
    msgs.scrollTop=1e9;
    if (i>=text.length){ clearInterval(tw); bb.textContent=text; }
  },16);
}
function chipHTML(category,args){
  const pairs=Object.entries(args||{}).map(([k,v])=>`${k}:${v}`).join(" · ");
  return `<b>${category}</b>`+(pairs?`　${pairs}`:"");
}
let busy=false, lastUserText="";
async function send(preset){
  const text=(preset!==undefined&&typeof preset==="string"?preset:document.getElementById("inp").value).trim();
  if(!text||busy) return;
  busy=true; lastUserText=text; document.getElementById("sendBtn").disabled=true; document.getElementById("inp").value="";
  addMsg("user",text); history[currentNPC].push({role:"user",content:text});
  try{
    let preds, offlineUsed=false;
    try{ preds = await apiParse(text); }
    catch(offlineErr){ preds = localFallbackParse(text); offlineUsed = true; }   /* 兑底：服务不可用时本地关键词归意图 */
    const parts=[],chips=[],pq=[];
    if (offlineUsed) chips.push('<span class="chip err">离线兑底</span>');
    for(const p of preds){
      const insts=Array.isArray(p.args)&&p.args.length?p.args:[{}];
      let np=false;
      for(const inst of insts){ chips.push(chipHTML(p.category,inst)); const r=handle(p.category,inst); if(r) parts.push(r.text); else np=true; }
      if(np) pq.push(p);
    }
    if(pq.length){
      const jobs=pq.map(p=>npcJob(p.category)).join("；");
      try{ parts.push(await apiChat(`玩家刚说：「${text}」。涉及话题：${jobs}。`)); }
      catch(e){ parts.push(currentNPC==="seer"?"（黑暗里静了一瞬）……水声盖过了你的话。再说一次。":currentNPC==="aeolus"?"（一阵风把你后半句吹散了）……再说一遍。":currentNPC==="siren"?"（歌声停了半拍，又漫上来）……雾把你的话吃掉了。再说一次。":"（她皱了皱眉）……风太乱，没听清。再说一遍？"); }
    }
    const reply=parts.join("\n")||(currentNPC==="seer"?"（他静默着，像一块黑石。）":"（她看了你一眼，没说话。）");
    addMsg("witch",reply,chips);
    history[currentNPC].push({role:"assistant",content:reply});
  }catch(e){
    addMsg("witch",(currentNPC==="seer"?"（杖声顿了顿）黑暗里一阵骚动。":"（炉火猛地晃了一下）……刚才那阵风不对劲。")+"再说一次？",
      [`<span class="chip err">解析异常：${String(e.message).slice(0,60)}</span>`]);
  }
  busy=false; document.getElementById("sendBtn").disabled=false;
  document.getElementById("inp").focus();
  renderHUD(); save();
}

/* ==================== 主循环 ====================
 * 逻辑步：hit-stop 冻结（timeScale），对话/标题/过场时世界暂停（含需求与时间）。
 * 相机与环境音走真实 dt，不受冻结影响（game-feel：反馈不阻塞）。 */
let lastLogic = performance.now();
setInterval(()=>{
  const now = performance.now();
  const dt = Math.min((now-lastLogic)/1000, 0.05);
  lastLogic = now;
  timeScale = now < hitStopUntil ? 0.06 : 1;
  const ldt = dt*timeScale;
  if (!dlgOpen && !titleOn && !chapterOn){
    tickMove(ldt);
    if (scene==="aia"){ tickBoar(ldt); witchUtilityTick(ldt); }
    tickNeeds(ldt);
    clockTick(ldt);
  }
  camTick(dt); ambTick(dt); npcAmbientTick(dt);
}, 20);
function loop(t){
  const et=(t-T0)/1000;
  /* 输入缓冲（input-systems）：交互预按 0.12s 内，走进可交互范围即触发 */
  if (eBufAt && performance.now()-eBufAt < 120 && !dlgOpen && !mapOpen && !titleOn && !chapterOn){
    const near = scene==="world" ? islandNear() : aiaNear();
    if (near){ eBufAt = 0; interact(); }
  }
  ctx.clearRect(0,0,1000,600);
  const bgc = sceneBackdrop();   /* 岛外底色：岛屿只画岛体，其余区域必须补齐（根治 void 黑区） */
  if (bgc){ ctx.fillStyle=bgc; ctx.fillRect(0,0,1000,600); }
  const [shx,shy,shr]=camOffset();
  const [ccx,ccy]=camCenter();
  ctx.save();
  ctx.translate(shx, shy);
  ctx.translate(ccx, ccy);
  ctx.rotate(shr);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);
  if (scene==="world") drawWorld(et); else if (scene==="hades") drawHades(et); else if (scene==="aeolia") drawAeolia(et); else if (scene==="strait") drawStrait(et); else if (scene==="sun") drawSun(et); else drawAia(et);
  drawDaylight(et);
  drawFloatTexts();
  ctx.restore();
  updateHintDOM();
  renderAmbient();
  requestAnimationFrame(loop);
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奥德赛 · 地中海 — 埃亚岛</title>
<style>
  :root{
    --bg:#0b1526; --panel:#ffffff; --line:#e3eaf2; --ink:#243244; --sub:#7b8aa0;
    --blue:#3b82f6; --blue-soft:#eaf2fe; --blue-ink:#2563eb; --deep:#1e3a5f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; font-size:14px;
    height:100vh; display:flex; align-items:center; justify-content:center;}
  #stage{position:relative; width:min(96vw, calc(94vh * 5 / 3)); aspect-ratio:5/3; max-width:1200px;}
  canvas{width:100%; height:100%; display:block; border-radius:14px; box-shadow:0 12px 44px rgba(0,0,0,.5);}
  .hud{position:absolute; top:12px; left:12px; right:12px; display:flex; gap:8px; align-items:center; pointer-events:none;}
  .hud .pill{pointer-events:auto; background:rgba(255,255,255,.92); border:1px solid var(--line);
    border-radius:20px; padding:5px 13px; font-size:12.5px; color:var(--deep); box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .hud .pill b{color:var(--blue-ink);}
  .hud .spacer{flex:1;}
  .hud button{pointer-events:auto; cursor:pointer; border:1px solid var(--line); background:rgba(255,255,255,.92);
    color:var(--sub); border-radius:20px; padding:5px 12px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .hud button:hover{color:var(--blue-ink); border-color:var(--blue);}
  #hint{position:absolute; transform:translate(-50%,-100%); background:rgba(20,32,48,.88); color:#fff;
    padding:6px 12px; border-radius:9px; font-size:12.5px; white-space:nowrap; pointer-events:none;
    box-shadow:0 4px 12px rgba(0,0,0,.3); display:none;}
  #hint b{color:#9ec5ff;}
  #ambient{position:absolute; transform:translate(-50%,-100%); background:#fff; color:var(--ink);
    border:1px solid var(--line); padding:7px 12px; border-radius:10px; font-size:12.5px; max-width:230px;
    line-height:1.5; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.22); display:none;}
  #toast{position:absolute; bottom:18%; left:50%; transform:translateX(-50%); background:rgba(20,32,48,.9);
    color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none;}
  #bagPanel{position:absolute; top:52px; right:12px; width:230px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.3); z-index:5;}
  #bagPanel h3{font-size:12px; color:var(--sub); margin-bottom:8px; letter-spacing:1px;}
  #bagPanel .it{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px dashed #eef2f7;}
  #bagPanel .it:last-child{border-bottom:none;}
  #bagPanel .it b{color:var(--blue-ink);}
  #dlg{position:absolute; left:2%; right:2%; bottom:2.5%; height:46%; background:var(--panel);
    border-radius:14px; border:1px solid var(--line); box-shadow:0 14px 44px rgba(0,0,0,.4);
    display:none; flex-direction:row; overflow:hidden; z-index:6;}
  #dlg.open{display:flex;}
  #dlgPortrait{flex:none; width:15%; border-right:1px solid var(--line); position:relative;
    background:url('concept-art/characters/02-喀耳刻.jpg') center 15%/cover no-repeat;}
  #dlgPortrait::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0) 52%, #ffffff 97%);}
  #dlg .dlgmain{flex:1; display:flex; flex-direction:column; min-width:0;}
  #dlg .head{display:flex; align-items:center; gap:9px; padding:9px 14px; border-bottom:1px solid var(--line);}
  #dlg .head .dot{width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#dbeafe,#ede9fe);
    display:flex; align-items:center; justify-content:center;}
  #dlg .head .t{font-weight:600; font-size:13.5px; color:var(--deep);}
  #dlg .head .s{font-size:11px; color:var(--sub);}
  #dlg .head .x{margin-left:auto; cursor:pointer; color:var(--sub); border:none; background:none; font-size:15px; padding:2px 8px;}
  #dlg .head .x:hover{color:var(--ink);}
  #msgs{flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; gap:8px; align-items:flex-start;}
  .row.me{flex-direction:row-reverse;}
  .row .who{font-size:10.5px; color:var(--sub); margin-bottom:2px;}
  .row .col{max-width:78%; display:flex; flex-direction:column; gap:3px;}
  .row.me .col{align-items:flex-end;}
  .bubble{padding:8px 12px; border-radius:11px; line-height:1.6; white-space:pre-wrap; word-break:break-word; font-size:13px;}
  .bubble.witch{background:#f7f9fd; border:1px solid var(--line); border-top-left-radius:3px;}
  .bubble.me{background:var(--blue); color:#fff; border-top-right-radius:3px;}
  .chips{display:flex; flex-wrap:wrap; gap:4px;}
  .chip{font-size:10.5px; background:var(--blue-soft); color:var(--blue-ink);
    border:1px solid #d4e4fd; border-radius:20px; padding:1px 8px;}
  .chip.err{background:#fef2f2; color:#b91c1c; border-color:#fecaca;}
  #samples{display:flex; gap:5px; flex-wrap:wrap; padding:6px 14px 0;}
  #samples button{border:1px solid var(--line); background:#fbfcfe; color:var(--sub);
    border-radius:14px; padding:3px 10px; font-size:11.5px; cursor:pointer;}
  #samples button:hover{border-color:var(--blue); color:var(--blue-ink); background:var(--blue-soft);}
  #dlg .inputrow{display:flex; gap:7px; padding:8px 14px 11px;}
  #inp{flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 11px; font-size:13px; outline:none; font-family:inherit;}
  #inp:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft);}
  #sendBtn{border:none; background:var(--blue); color:#fff; border-radius:9px; padding:0 16px; font-size:13px; cursor:pointer;}
  #sendBtn:disabled{opacity:.5;}
  #keys{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.6);
    font-size:11px; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.6);}
  #zone{position:absolute; top:12px; left:50%; transform:translateX(-50%); pointer-events:none;
    color:rgba(255,255,255,.75); font-size:12px; letter-spacing:2px; text-shadow:0 1px 4px rgba(0,0,0,.5);}
  /* ---- 受击反馈 ---- */
  #hitFlash{position:absolute; inset:0; border-radius:14px; pointer-events:none; z-index:9;
    background:radial-gradient(ellipse at center, rgba(190,28,28,0) 52%, rgba(190,28,28,.5) 100%);
    opacity:0; transition:opacity .55s;}
  .shake{animation:shakeX .3s;}
  @keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  /* ---- 标题屏（概念图 01-序章漂流） ---- */
  #titleScreen{position:absolute; inset:0; z-index:20; border-radius:14px; overflow:hidden;
    background:#0b1526 url('concept-art/01-序章漂流.jpg') center/cover no-repeat;
    transition:opacity .8s;}
  #titleScreen.hide{opacity:0; pointer-events:none;}
  #titleScreen::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,14,26,.30) 0%, rgba(6,14,26,0) 34%, rgba(6,14,26,.74) 100%);}
  .tsBody{position:absolute; left:9%; bottom:11%; z-index:2; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.55);}
  .tsKicker{font-size:12px; letter-spacing:5px; color:rgba(255,255,255,.78); margin-bottom:10px;}
  .tsBody h1{font-family:Georgia,"Times New Roman","宋体",SimSun,serif; font-size:52px; line-height:1;
    font-weight:700; letter-spacing:10px;}
  .tsBody h1 span{font-size:17px; letter-spacing:6px; vertical-align:14px; margin-left:10px; color:rgba(255,255,255,.85);}
  .tsSub{margin:14px 0 26px; font-size:14px; color:rgba(255,255,255,.86); letter-spacing:2px;}
  .tsBtns{display:flex; gap:10px;}
  #tsGo{border:none; background:#fff; color:#16324e; font-size:15px; font-weight:600; letter-spacing:3px;
    padding:11px 34px; border-radius:26px; cursor:pointer; box-shadow:0 6px 22px rgba(0,0,0,.35);}
  #tsGo:hover{transform:translateY(-1px); box-shadow:0 10px 26px rgba(0,0,0,.45);}
  #tsNew{border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.12); color:#fff; font-size:13px;
    padding:11px 22px; border-radius:26px; cursor:pointer;}
  #tsNew:hover{background:rgba(255,255,255,.22);}
  .tsTip{margin-top:30px; font-size:11px; line-height:1.8; color:rgba(255,255,255,.55);}
  /* ---- 章节过场（概念图 02-女巫小屋） ---- */
  #chapterCard{position:absolute; inset:0; z-index:18; border-radius:14px; overflow:hidden; cursor:pointer;
    background:#0b1526 center/cover no-repeat; opacity:0; pointer-events:none; transition:opacity .55s;}
  #chapterCard.show{opacity:1; pointer-events:auto;}
  #chapterCard::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,14,26,.12) 0%, rgba(6,14,26,0) 40%, rgba(6,14,26,.78) 100%);}
  .ccBody{position:absolute; left:9%; bottom:13%; z-index:2; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.6);}
  .ccKicker{font-size:11px; letter-spacing:6px; color:#ffd66b; margin-bottom:8px;}
  .ccTitle{font-family:Georgia,"Times New Roman","宋体",SimSun,serif; font-size:38px; letter-spacing:8px; font-weight:700;}
  .ccSub{margin-top:10px; font-size:13px; color:rgba(255,255,255,.85); letter-spacing:2px;}
  .ccQuote{margin-top:16px; font-size:12px; color:rgba(255,255,255,.62); letter-spacing:1px;}
  .ccSkip{position:absolute; right:14px; bottom:10px; z-index:2; font-size:11px; color:rgba(255,255,255,.5);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1000" height="600"></canvas>
  <div id="zone"></div>
  <div class="hud">
    <span class="pill">钱袋 <b id="hudCoins"></b> 德拉克马</span>
    <span class="pill">血 <b id="hudHp"></b><span id="hudHpBarWrap" style="display:inline-block;width:52px;height:7px;background:#e8eef5;border-radius:4px;vertical-align:middle;margin-left:6px;overflow:hidden"><i id="hudHpBar" style="display:block;height:100%;background:#3fae6a;border-radius:4px"></i></span></span>
    <span class="pill" id="hudQuest" style="display:none"></span>
    <span class="spacer"></span>
    <button id="sndBtn" onclick="sndToggle()">🔊 音效</button>
    <button id="bagBtn">背包</button>
    <button onclick="hardReset()">重新开始</button>
  </div>
  <div id="hint"></div>
  <div id="ambient"></div>
  <div id="toast"></div>
  <div id="bagPanel"><h3>背包</h3><div id="bagList"></div></div>
  <div id="dlg">
    <div id="dlgPortrait"></div>
    <div class="dlgmain">
    <div class="head">
      <span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7c6fd0" stroke-width="2"><path d="M9 3h6M10 3v4l-4.5 8A4.5 4.5 0 0 0 9.5 21h5a4.5 4.5 0 0 0 4-13.5L14 7V3"/></svg></span>
      <span><span class="t" id="dlgName">女巫喀耳刻</span><br><span class="s" id="dlgSub">意图：Xing4.0-29B-Intent · 台词：TeleChat3</span></span>
      <button class="x" onclick="closeDlg()">✕</button>
    </div>
    <div id="msgs"></div>
    <div id="samples"></div>
    <div class="inputrow">
      <input id="inp" placeholder="对女巫说点什么……" autocomplete="off">
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
    </div>
  </div>
  <div id="keys">WASD / 方向键 移动 · E 互动 · Esc 关闭对话</div>
  <div id="hitFlash"></div>
  <div id="chapterCard">
    <div class="ccBody">
      <div class="ccKicker"></div>
      <div class="ccTitle"></div>
      <div class="ccSub"></div>
      <div class="ccQuote"></div>
    </div>
    <div class="ccSkip">点击任意处跳过</div>
  </div>
  <div id="titleScreen">
    <div class="tsBody">
      <div class="tsKicker">荷马史诗 · 空间探索</div>
      <h1>奥德赛<span>地中海</span></h1>
      <div class="tsSub">无名旅人的返乡航程</div>
      <div class="tsBtns">
        <button id="tsGo">启航</button>
        <button id="tsNew" style="display:none">从头开始</button>
      </div>
      <div class="tsTip">WASD / 方向键 移动 · E 互动 · Esc 关闭对话<br>视觉素材为本项目原创 AI 概念图</div>
    </div>
  </div>
</div>

<script>
/* ==================================================================
 *  奥德赛 · 地中海 —— 世界地图 + 埃亚岛 2.5D
 *  场景状态机：scene = 'world' | 'aia'
 *  世界地图：驾船航行，靠近岛屿 E 登陆
 *  埃亚岛：2.5D 区域（瓦片厚度 + y-sort 遮挡 + 泡沫海岸）
 * ================================================================== */

/* ==================== 世界地图（地中海） ==================== */
const WCOLS = 46, WROWS = 18, WTS = 20;
function buildMediterranean(){
  const W = Array.from({length:WROWS}, () => Array(WCOLS).fill("~"));
  const land=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x>=0&&x<WCOLS&&y>=0&&y<WROWS)W[y][x]="#";};
  land(0,0,45,4);        // 欧洲大陆(北岸)
  land(33,4,45,13);      // 小亚细亚/安纳托利亚(东岸)
  land(0,14,45,17);      // 非洲(北非)
  for(let y=4;y<=8;y++)for(let x=8;x<=9+(y>5?2:1);x++)W[y][x]="#";  // 意大利靴形
  for(let y=9;y<=11;y++){W[y][9]="#";W[y][10]="#";}                 // 靴尖
  W[10][12]="#";W[10][13]="#";                                      // 西西里岛
  for(let y=4;y<=8;y++)for(let x=18;x<=21;x++)W[y][x]="#";          // 希腊/伯罗奔尼撒
  W[5][32]="#";W[5][33]="#";W[6][32]="#";W[6][33]="#";              // 特洛伊海角
  W[13][20]="#"; // 克里特岛
  W[12][38]="#"; // 塞浦路斯
  W[6][14]="X"; W[9][35]="X";                                       // 礁石
  for(let y=0;y<WROWS;y++)for(let x=0;x<WCOLS;x++)if(W[y][x]==="~"&&(x*13+y*7)%9===0)W[y][x]=".";
  return W.map(r=>r.join(""));
}
const WORLD = buildMediterranean();
const ISLANDS = [
  {gx:6,  gy:11, name:"埃亚岛",    note:"喀耳刻的领地 · 第勒尼安海",  open:true, scene:"aia"},
  {gx:2,  gy:8,  name:"冥界之岸",  note:"俄刻阿诺斯之岸 · 亡者之言",  open:true, scene:"hades"},
  {gx:12, gy:14, name:"西西里",    note:"独眼巨人之地 · 待开放",     open:false},
  {gx:16, gy:14, name:"伊萨卡",    note:"归乡 · 爱奥尼亚海 · 雾未散", open:false},
  {gx:31, gy:6,  name:"特洛伊海岸", note:"战火余烬 · 爱琴海东 · 待开放", open:false},
  {gx:21, gy:9,  name:"马耳他礁",  note:"海妖歌声 · 待开放", open:false},
];
const SEAS = [
  {x:23,y:2,label:"欧洲"}, {x:4,y:16,label:"非洲"}, {x:40,y:8,label:"黎凡特海"},
  {x:5,y:12,label:"第勒尼安海"}, {x:14,y:16,label:"爱奥尼亚海"},
  {x:18,y:10,label:"爱琴海"}, {x:26,y:15,label:"地中海"},
];

/* ==================== 埃亚岛地图（2.5D） ==================== */
/* ~水 T树 H屋墙 D门 C坩埚 M玛草 P泉 A石碑 F篝火 _栈桥 . 草地 ,小径 */
const AIA = [
  "~~~~~~~~~~~~~~~~~~~~",
  "~TT....TT...T...MM.~",
  "~T.HHHH......T..M..~",
  "~..HHDH..C.........~",
  "~....,.............~",
  "~....,......T......~",
  "~....,..........PP.~",
  "~....,..........PP.~",
  "~....,........AF...~",
  "~..__,.............~",
  "~..__,,............~",
  "~~~_,,~~~~~~~~~~~~~~",
];
const ATS = 40, ACOLS = 20, AROWS = 12;
const ASOLID = new Set(["~","T","H","C","A","P","F"]);

/* ==================== 冥界地图（2.5D · 冷磷光 · 俄刻阿诺斯之岸） ====================
   ~冥河 T白杨 G献祭沟 _栈桥 . 暗岩 , 灰白冥路
   原版骨：倒祭品入沟召亡魂 → 特瑞西阿斯预言返乡之路（荷马史诗第 11 卷 Nekyia） */
const HADES = [
  "~~~~~~~~~~~~~~~~~~~~",
  "~~~~~TTT~~~TTT~~~~~~",
  "~~~TTT......TTT~~~~~",
  "~~~T.......G.....T~~",
  "~~~....,,......T~~~~",
  "~~...,,,........T~~~",
  "~~...,,..........~~~",
  "~....,,...........T~",
  "~....,...........T~~",
  "~....,.............~",
  "~___,,.............~",
  "~~~___~~~~~~~~~~~~~~",
];
const HSOLID = new Set(["~","T","G"]);
const seer = { x: 9*ATS+ATS/2, y: 2*ATS+ATS*0.6 };          /* 特瑞西阿斯立于路尽头 */
const GHOSTS = [ {bx:230,by:190,ax:26,ay:12,p:0.7}, {bx:600,by:240,ax:34,ay:15,p:1.3},
                 {bx:170,by:330,ax:20,ay:14,p:2.1}, {bx:560,by:340,ax:28,ay:10,p:2.9} ];
const HSPOTS = [
  {type:"seer",   x:seer.x, y:seer.y, r:85, label:"与特瑞西阿斯交谈"},
  {type:"trench", x:11*ATS+ATS/2, y:3*ATS+ATS/2, r:70, label:"献祭之沟（倒祭品）"},
  {type:"dock",   x:2*ATS+ATS/2, y:10*ATS+ATS/2, r:70, label:"返回生者的海"},
];
function hTile(cx,cy){ return (cx<0||cy<0||cx>=ACOLS||cy>=AROWS)?"~":HADES[cy][cx]; }

/* ==================== 状态 ==================== */
const SHOP = {"治疗草药":15,"玛草":8,"蜂蜜酒":12,"蜂蜜":6,"橄榄油":10};
let state = {
  coins: 30,
  hp: 100,
  backpack: {"淡水":2,"面包":1,"铜矛":1},
  equipped: null,
  quest: null,
  boarKilled: false,
  status: {"饥饿":"微饿","口渴":"正常","伤势":"无","士气":"尚可"},
};
let scene = "world";
const boat  = { x: 9*WTS+WTS/2, y: 7*WTS+WTS/2 };
const aiaPlayer = { x: 4*ATS+ATS/2, y: 8*ATS+ATS/2, w: 24, h: 14, face: "down", moving:false, step:0 };

const SAVE_KEY = "odyssey-med-v2";
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
  state, scene, boat:{x:boat.x,y:boat.y}, aia:{x:aiaPlayer.x,y:aiaPlayer.y} })); }catch(e){} }
function load(){ try{
  const d = JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  if (d && d.state){
    state = d.state;
    if (d.boat){ boat.x=d.boat.x; boat.y=d.boat.y; }
    if (d.aia){ aiaPlayer.x=d.aia.x; aiaPlayer.y=d.aia.y; }
    scene = d.scene === "hades" ? "hades" : d.scene === "aia" ? "aia" : "world";
    return true;
  }
}catch(e){} return false; }
function hardReset(){ if(confirm("清空存档，从头开始？")){ localStorage.removeItem(SAVE_KEY); location.reload(); } }

/* 迁移旧存档（埃亚岛单场景版） */
(function migrate(){
  try{
    if (!localStorage.getItem(SAVE_KEY) && localStorage.getItem("odyssey-witch-space-v1")){
      const d = JSON.parse(localStorage.getItem("odyssey-witch-space-v1"));
      if (d && d.state){ state = d.state; aiaPlayer.x=d.px; aiaPlayer.y=d.py; save(); }
    }
  }catch(e){}
})();

/* ==================== 埃亚岛实体与点位 ==================== */
const witch  = { x: 8*ATS+ATS/2, y: 3*ATS+ATS/2 };
const GRASS_NODES = [
  {cx:16,cy:1},{cx:17,cy:1},{cx:16,cy:2}
].map((n,i)=>({id:"g"+i, type:"grass", r:70, ...n,
  x:n.cx*ATS+ATS/2, y:n.cy*ATS+ATS/2, label:"采摘玛草"}));
/* 野猪：带血条 + 主动 AI 状态机（叙事来源：拱坏女巫玛草的那头）
   mode: idle游荡 → aggro锁定 → windup蓄力(可预判) → dash冲撞(可走位躲) → tired硬直喘气(玩家暴击窗口) */
const boar = { x: 14*ATS+20, y: 3*ATS+30, hp: 30, max: 30, alive: true, hitAt: 0, home:{x:14*ATS+20,y:3*ATS+30}, mode:"idle", dir:{x:0,y:0}, timer:0 };
const ASPOTS = [
  {type:"witch",  x:witch.x, y:witch.y, r:85, label:"与喀耳刻交谈"},
  ...GRASS_NODES,
  {type:"spring", x:16*ATS+ATS, y:6*ATS+ATS/2, r:70, label:"灌满水囊"},
  {type:"altar",  x:15*ATS+ATS/2, y:8*ATS+ATS/2, r:75, label:"查看石碑"},
  {type:"fire",   x:16*ATS+ATS/2, y:8*ATS+ATS/2+26, r:62, label:"篝火（烤肉）"},
  {type:"dock",   x:3*ATS+ATS/2, y:10*ATS+ATS/2, r:70, label:"扬帆出海"},
];
const BOAR_MOOD = {idle:"游荡", aggro:"锁定你", windup:"蓄力中", dash:"冲撞", tired:"喘气(弱点)"};
function boarSpot(){
  if (!boar.alive) return null;
  return {type:"boar", x:boar.x, y:boar.y, r:55,
    label:`攻击野猪（血 ${boar.hp}/${boar.max} · ${BOAR_MOOD[boar.mode]||""}）`};
}

/* ==================== 输入 ==================== */
const keys = new Set();
let dlgOpen = false;
/* 标题屏 / 章节过场开关：开着时不响应移动与互动 */
let titleOn = true, chapterOn = false, chTimer = null;
/* 捕获阶段监听：输入框打字不误触移动/E，但 Esc 任何时候都能关对话 */
addEventListener("keydown", e=>{
  if (titleOn || chapterOn){ if (chapterOn && e.key==="Escape") skipChapter(); return; }
  const inInput = e.target && e.target.id === "inp";
  if (dlgOpen){
    if (e.key==="Escape"){ closeDlg(); e.preventDefault(); }
    return;
  }
  if (inInput) return;
  const k = e.key.toLowerCase();
  if (["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){ keys.add(k); e.preventDefault(); }
  if (k==="e"){ e.preventDefault(); interact(); }
}, true);
addEventListener("keyup", e=> keys.delete(e.key.toLowerCase()));
addEventListener("blur", ()=> keys.clear());

/* ==================== 移动 ==================== */
function aiaTile(cx,cy){ return (cx<0||cy<0||cx>=ACOLS||cy>=AROWS)?"~":AIA[cy][cx]; }
function tryMoveAia(nx,ny){
  const hw=aiaPlayer.w/2, hh=aiaPlayer.h/2;
  for (const [dx,dy] of [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]])
    if (ASOLID.has(aiaTile(Math.floor((nx+dx)/ATS), Math.floor((ny+dy)/ATS)))) return false;
  aiaPlayer.x=nx; aiaPlayer.y=ny; return true;
}
function worldTile(cx,cy){ return (cx<0||cy<0||cx>=WCOLS||cy>=WROWS)?"~":WORLD[cy][cx]; }
function tryMoveHades(nx,ny){
  const hw=aiaPlayer.w/2, hh=aiaPlayer.h/2;
  for (const [dx,dy] of [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]])
    if (HSOLID.has(hTile(Math.floor((nx+dx)/ATS), Math.floor((ny+dy)/ATS)))) return false;
  aiaPlayer.x=nx; aiaPlayer.y=ny; return true;
}
function tryMoveWorld(nx,ny){
  const ch = worldTile(Math.floor(nx/WTS), Math.floor(ny/WTS));
  if (ch==="#"||ch==="X"||ch==="G") return false;
  boat.x=nx; boat.y=ny; return true;
}
function tickMove(dt){
  if (titleOn||chapterOn) return;
  let dx=0, dy=0;
  if (keys.has("a")||keys.has("arrowleft")) dx-=1;
  if (keys.has("d")||keys.has("arrowright")) dx+=1;
  if (keys.has("w")||keys.has("arrowup")) dy-=1;
  if (keys.has("s")||keys.has("arrowdown")) dy+=1;
  const p = scene==="aia" || scene==="hades" ? aiaPlayer : boat;
  p.moving = !!(dx||dy);
  if (!dx&&!dy) return;
  if (dx&&dy){ dx*=0.7071; dy*=0.7071; }
  if (dx<0) p.face="left"; else if (dx>0) p.face="right";
  else if (dy<0) p.face="up"; else p.face="down";
  const sp = (scene==="aia"?150:scene==="hades"?120:110)*dt;
  const mover = scene==="aia" ? tryMoveAia : scene==="hades" ? tryMoveHades : tryMoveWorld;
  if (dx) mover(p.x+dx*sp, p.y);
  if (dy) mover(p.x, p.y+dy*sp);
  p.step = (p.step||0)+dt*8;
}

/* ==================== 野猪 AI（纯本地逻辑层，不烧模型） ==================== */
function tryMoveBoar(nx, ny){
  for (const [dx,dy] of [[-13,-7],[13,-7],[-13,7],[13,7]])
    if (ASOLID.has(aiaTile(Math.floor((nx+dx)/ATS), Math.floor((ny+dy)/ATS)))) return false;
  boar.x = nx; boar.y = ny; return true;
}
function tickBoar(dt){
  if (!boar.alive) return;
  boar.timer -= dt;
  const dx = aiaPlayer.x - boar.x, dy = aiaPlayer.y - boar.y;
  const dist = Math.hypot(dx, dy) || 1;
  switch (boar.mode){
    case "idle":
      /* 游荡：在家附近小步踱步 */
      if (dist < 140){ boar.mode = "aggro"; sfx("alert"); break; }
      if (((performance.now()/900)|0) % 2 === 0){
        const hx = boar.home.x - boar.x, hy = boar.home.y - boar.y;
        if (Math.hypot(hx, hy) > 26) tryMoveBoar(boar.x + Math.sign(hx)*22*dt, boar.y + Math.sign(hy)*22*dt);
      }
      break;
    case "aggro":
      if (dist > 210){ boar.mode = "idle"; break; }
      if (dist < 95){
        boar.mode = "windup"; boar.timer = 0.5;
        boar.dir = {x:dx/dist, y:dy/dist};   /* 方向在蓄力开始时锁定 → 玩家可走位躲 */
        break;
      }
      tryMoveBoar(boar.x + dx/dist*34*dt, boar.y + dy/dist*34*dt);
      break;
    case "windup":
      if (boar.timer <= 0){ boar.mode = "dash"; boar.timer = 0.55; sfx("dash"); }
      break;
    case "dash": {
      const sp = 300*dt;
      if (!tryMoveBoar(boar.x + boar.dir.x*sp, boar.y + boar.dir.y*sp)){
        boar.mode = "tired"; boar.timer = 1.3; break;
      }
      if (Math.hypot(aiaPlayer.x-boar.x, aiaPlayer.y-boar.y) < 22){
        const dmg = 12 + Math.floor(Math.random()*5);
        hurtPlayer(dmg, "野猪把你撞了个趔趄");
        const kb = 26;
        tryMoveAia(aiaPlayer.x + boar.dir.x*kb, aiaPlayer.y);
        tryMoveAia(aiaPlayer.x, aiaPlayer.y + boar.dir.y*kb);
        boar.mode = "tired"; boar.timer = 1.3;
      } else if (boar.timer <= 0){ boar.mode = "tired"; boar.timer = 1.3; }
      break;
    }
    case "tired":
      if (boar.timer <= 0) boar.mode = "idle";
      break;
  }
}

/* ==================== 玩家受击反馈（红晕 + 抖动 + 合成音效） ==================== */
function hurtPlayer(dmg, reason){
  state.hp -= dmg;
  state.status["伤势"] = state.hp>60 ? "轻伤" : state.hp>30 ? "重伤" : "奄奄一息";
  flashHit(); shakeHp(); sfx("hurt");
  if (state.hp <= 0){
    state.hp = 50; state.coins = Math.max(0, state.coins-5);
    state.status["伤势"] = "轻伤";
    aiaPlayer.x = witch.x; aiaPlayer.y = witch.y + 60;
    toast(`眼前一黑……醒来时你躺在女巫屋外的草垛上，她把药渣在你鼻子上抹了一把：医药费，五枚德拉克马。（血量恢复至 50，还剩 ${state.coins} 枚）`);
  } else {
    toast(`${reason}（你 -${dmg} 血）`);
  }
  renderHUD(); save();
}
function flashHit(){
  const f = document.getElementById("hitFlash");
  if (!f) return;
  f.style.transition = "none"; f.style.opacity = 1;
  requestAnimationFrame(()=>{ f.style.transition = "opacity .55s"; f.style.opacity = 0; });
}
function shakeHp(){
  const el = document.getElementById("hudHpBarWrap");
  if (!el) return;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
}

/* WebAudio 零依赖合成音效（无外部音频文件） */
let AC = null, sndOn = true;
const SFX_CFG = {
  attack: [900, 560, 0.05, "square",   0.10],
  hurt:   [150,  70,  0.17, "sawtooth", 0.20],
  dash:   [240,  720, 0.15, "sawtooth", 0.10],
  alert:  [540,  540, 0.07, "triangle", 0.09],
  die:    [320,  85,  0.30, "sawtooth", 0.15],
  cook:   [520,  800, 0.13, "triangle", 0.11],
  pick:   [700,  900, 0.06, "sine",     0.08],
};
function sfx(kind){
  if (!sndOn || !SFX_CFG[kind]) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const c = SFX_CFG[kind], t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = c[3];
    o.frequency.setValueAtTime(c[0], t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, c[1]), t+c[2]);
    g.gain.setValueAtTime(c[4], t);
    g.gain.exponentialRampToValueAtTime(0.001, t+c[2]);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+c[2]+0.02);
  }catch(e){}
}
function sndToggle(){ sndOn = !sndOn; document.getElementById("sndBtn").textContent = sndOn ? "🔊 音效" : "🔇 音效"; }

/* ==================== 互动 ==================== */
function islandNear(){
  let best=null, bd=1e9;
  for (const is of ISLANDS){
    const cx = is.gx*WTS+WTS/2, cy = is.gy*WTS+WTS/2;
    const d = Math.hypot(boat.x-cx, boat.y-cy);
    if (d < 90 && d < bd){ bd=d; best=is; }
  }
  return best;
}
function aiaNear(){
  let best=null, bd=1e9;
  let spots;
  if (scene==="hades") spots = HSPOTS.slice();
  else { spots = ASPOTS.slice(); const bs = boarSpot(); if (bs) spots.push(bs); }
  for (const s of spots){
    const d = Math.hypot(aiaPlayer.x-s.x, aiaPlayer.y-s.y);
    if (d < s.r && d < bd){ bd=d; best=s; }
  }
  return best;
}
function interact(){
  if (titleOn||chapterOn) return;
  if (scene==="world"){
    const is = islandNear();
    if (!is) return;
    if (!is.open){ toast(`${is.name} —— ${is.note}`); return; }
    if (is.scene==="hades"){
      scene = "hades";
      aiaPlayer.x = 2*ATS+ATS/2; aiaPlayer.y = 10*ATS+ATS/2;
      save();
      showChapter("concept-art/07-冥界之岸.jpg","第 二 章","冥 界","俄刻阿诺斯之岸 · 亡者之言","你在灰白的栈桥上靠了岸——这里的水不响");
      return;
    }
    scene = "aia";
    aiaPlayer.x = 3*ATS+ATS/2; aiaPlayer.y = 10*ATS+ATS/2;
    save();
    showChapter("concept-art/02-女巫小屋.jpg","第 一 章","埃阿亚岛","喀耳刻的领地 · 第勒尼安海","你在小岛南面的栈桥靠了岸");
    return;
  }
  const s = aiaNear();
  if (!s) return;
  if (s.type==="witch") return openDlg("witch");
  if (s.type==="seer") return openDlg("seer");
  if (s.type==="trench"){
    const need=["蜂蜜酒","面包","淡水"], miss=need.filter(n=>!state.backpack[n]);
    if (miss.length){
      toast(`献祭需要蜂蜜酒、面包、淡水各一——还缺：${miss.join("、")}。埃亚岛的女巫卖蜂蜜酒。`);
      return;
    }
    need.forEach(n=>delItem(n));
    state.offered = true; sfx("cook");
    toast("你把蜂蜜酒、面包与淡水倒进沟里。黑暗深处传来低语，像无数人同时叹了口气——特瑞西阿斯显形了。");
    renderHUD(); save(); return;
  }
  if (s.type==="dock" && scene==="hades"){
    scene = "world";
    boat.x = 2*WTS+WTS/2+40; boat.y = 8*WTS+WTS/2;
    toast("你离开死者的国度，回到生者的海");
    save(); return;
  }
  if (s.type==="grass"){
    addItem("玛草");
    if (state.quest && !state.quest.done && state.quest.have<state.quest.need) state.quest.have++;
    sfx("pick");
    toast(`采到一株玛草（背包 ×${state.backpack["玛草"]}${state.quest&&!state.quest.done?`，进度 ${state.quest.have}/${state.quest.need}`:""}）`);
    renderHUD(); save(); return;
  }
  if (s.type==="spring"){ addItem("淡水"); toast(`溪水灌满水囊（淡水 ×${state.backpack["淡水"]}）`); renderHUD(); save(); return; }
  if (s.type==="altar"){ toast("石碑的字迹被苔藓吃掉了大半……「向海而行者，先问风。」"); return; }
  if (s.type==="boar"){
    /* 战斗：E 键结算（属性/命中由本地逻辑层算，agent 不参与数值）。
       tired=硬直喘气，暴击窗口 ×1.5；野猪的冲撞由 tickBoar 驱动，不再随机反击 */
    const tired = boar.mode === "tired";
    const dmg = Math.floor((8 + Math.floor(Math.random()*5)) * (tired ? 1.5 : 1));
    boar.hp -= dmg; boar.hitAt = performance.now();
    sfx("attack");
    let msg = tired
      ? `趁它喘气的空当，你狠狠补上一击！（-${dmg}，弱点打击 ×1.5）`
      : `你挥起${state.equipped?"【"+state.equipped+"】":"拳头"}，给野猪刷刷两下（-${dmg}）`;
    if (boar.hp <= 0){
      boar.alive = false; state.boarKilled = true;
      addItem("野猪肉"); sfx("die");
      msg = `野猪哼了一声，倒在草丛里。（获得 野猪肉×1）——拱坏女巫玛草的就是它。祭坛旁的篝火正旺，也许能烤点什么。`;
    } else if (tired){
      boar.mode = "idle";
    }
    toast(msg); renderHUD(); save(); return;
  }
  if (s.type==="fire"){
    if (state.backpack["野猪肉"]){
      delItem("野猪肉"); addItem("烤野猪肉"); sfx("cook");
      toast("你把野猪肉架在篝火上，油星噼啪作响……（获得 烤野猪肉×1，对女巫说「用烤野猪肉」可恢复 40 血）");
    } else if (state.backpack["烤野猪肉"]){
      toast("篝火烧得正旺。背包里的烤野猪肉趁热吃——对女巫说「用烤野猪肉」。");
    } else {
      toast("篝火烧得正旺。架点什么上去烤才不浪费——比如，某头野猪身上的肉。");
    }
    renderHUD(); save(); return;
  }
  if (s.type==="dock"){
    scene = "world";
    boat.x = 17*WTS+WTS/2+34; boat.y = 5*WTS+WTS+34;
    toast("你扬帆离开埃亚岛，回到地中海");
    save(); return;
  }
}

/* ==================================================================
 *  渲染 —— 2.5D 要点：
 *  1) 陆地瓦片向下挤出厚度（土色侧面）→ 岛屿浮在海上
 *  2) 实体(树/屋/人/草)按 y 排序绘制，正确遮挡
 *  3) 海岸画泡沫线、水面波光
 * ================================================================== */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let T0 = performance.now();
const SAND="#e6d3a3", GRASS_C="#a8cf8e", GRASS_D="#93c17c", CLIFF="#c9a06a", CLIFF_D="#a37d4e";

/* ---------- 世界地图绘制 ---------- */
function drawWorld(et){
  ctx.fillStyle="#1b4e72"; ctx.fillRect(0,0,1000,600);
  for (let cy=0; cy<WROWS; cy++) for (let cx=0; cx<WCOLS; cx++){
    const ch = worldTile(cx,cy), x=cx*WTS, y=cy*WTS;
    if (ch==="#"){
      ctx.fillStyle = ((cx+cy)%2)?GRASS_C:GRASS_D; ctx.fillRect(x,y,WTS,WTS);
      const g2=ctx.createLinearGradient(0,y+WTS-3,0,y+WTS+9);
      g2.addColorStop(0,"#d4b078"); g2.addColorStop(.5,"#c9a06a"); g2.addColorStop(1,"#8f6b40");
      ctx.fillStyle=g2; ctx.fillRect(x,y+WTS-3,WTS,12);
      continue;
    }
    if (ch==="G"){
      ctx.fillStyle=SAND; ctx.fillRect(x,y,WTS,WTS);
      ctx.fillStyle="#d8bf8a"; ctx.fillRect(x,y+WTS-3,WTS,3);
      continue;
    }
    if (ch==="X"){
      ctx.fillStyle="#2c6285"; ctx.fillRect(x,y,WTS,WTS);
      ctx.fillStyle="#5b7f96";
      ctx.beginPath(); ctx.moveTo(x+WTS/2-7,y+WTS/2+4); ctx.lineTo(x+WTS/2,y+WTS/2-7); ctx.lineTo(x+WTS/2+7,y+WTS/2+4); ctx.closePath(); ctx.fill();
      continue;
    }
    const near = worldTile(cx,cy-1)!=="~"&&worldTile(cx,cy-1)!=="."||worldTile(cx,cy+1)!=="~"&&worldTile(cx,cy+1)!=="."||worldTile(cx-1,cy)!=="~"&&worldTile(cx-1,cy)!=="."||worldTile(cx+1,cy)!=="~"&&worldTile(cx+1,cy)!==".";
    ctx.fillStyle = near ? "#3f7fa8" : "#255a7f"; ctx.fillRect(x,y,WTS,WTS);
    if ((cx*13+cy*7)%4===0){
      ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=1.2;
      const ph=Math.sin(et*1.8+cx*1.7+cy*2.3)*2;
      ctx.beginPath(); ctx.moveTo(x+5,y+12+ph); ctx.lineTo(x+18,y+12+ph); ctx.stroke();
    }
  }
  /* 岛名标签 */
  ctx.textAlign="center"; ctx.font="600 11px 'Segoe UI','Microsoft YaHei'";
  for (const is of ISLANDS){
    const x=is.gx*WTS+WTS/2, y=is.gy*WTS-6;
    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillText(is.name, x+1, y+1);
    ctx.fillStyle = is.open ? "#ffffff" : "rgba(255,255,255,.55)"; ctx.fillText(is.name, x, y);
    if (!is.open){
      ctx.fillStyle="rgba(255,255,255,.4)"; ctx.font="10px 'Segoe UI'";
      ctx.fillText("（待开放）", x, y+11); ctx.font="600 11px 'Segoe UI','Microsoft YaHei'";
    }
  }
  /* 海域名标签 */
  ctx.font="600 10px 'Segoe UI','Microsoft YaHei'";
  for (const s of SEAS){
    ctx.fillStyle="rgba(255,255,255,.42)";
    ctx.fillText(s.label, s.x*WTS+WTS/2, s.y*WTS+WTS/2);
  }
  ctx.font="600 11px 'Segoe UI','Microsoft YaHei'";
  drawBoat(et);
}
function drawBoat(et){
  const x=boat.x, y=boat.y, rock=Math.sin(et*1.6)*1.5;
  ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(x,y+8,14,5,0,0,7); ctx.fill();
  ctx.save(); ctx.translate(x,y+rock);
  ctx.fillStyle="#8a5a33"; ctx.beginPath();
  ctx.moveTo(-16,2); ctx.quadraticCurveTo(0,9,16,2); ctx.lineTo(12,-2); ctx.lineTo(-12,-2); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#a97a4d"; ctx.fillRect(-2,-16,3,15);
  ctx.fillStyle="#f4efe4"; ctx.beginPath(); ctx.moveTo(2,-15); ctx.quadraticCurveTo(11,-6,2,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#243244"; ctx.fillRect(-4,-2,2,4);
  ctx.restore();
}

/* ---------- 埃亚岛 2.5D 绘制 ---------- */
const TH = 17;   /* 崖面高度 */
function drawAia(et){
  /* Pass1 水格：先画，后续崖面会盖在其上部 → 形成落差 */
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    if (aiaTile(cx,cy)!=="~") continue;
    const x=cx*ATS, y=cy*ATS;
    const near = aiaTile(cx,cy-1)!=="~"||aiaTile(cx,cy+1)!=="~"||aiaTile(cx-1,cy)!=="~"||aiaTile(cx+1,cy)!=="~";
    ctx.fillStyle = near ? "#4f8fb5" : "#2f6f96"; ctx.fillRect(x,y,ATS,ATS);
    if ((cx*11+cy*5)%3===0){
      ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=1.5;
      const ph=Math.sin(et*1.7+cx*1.3+cy*2.1)*3;
      ctx.beginPath(); ctx.moveTo(x+8,y+20+ph); ctx.lineTo(x+22,y+20+ph); ctx.stroke();
    }
  }
  /* Pass1.5 岛屿整体投影 + 倒影：让岛"悬浮"在海面上 */
  ctx.save();
  ctx.fillStyle="rgba(8,24,38,.30)";
  ctx.beginPath(); ctx.ellipse(400, 448, 348, 52, 0, 0, 7); ctx.fill();
  ctx.fillStyle="rgba(140,180,120,.14)";   /* 岛的绿色倒影 */
  ctx.beginPath(); ctx.ellipse(400, 452, 320, 30, 0, 0, 7); ctx.fill();
  ctx.restore();
  /* Pass2 水侧装饰：崖下深水带 + 泡沫渐变 + 碎沫（都在崖面底沿以下） */
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    if (aiaTile(cx,cy)==="~") continue;
    const x=cx*ATS, y=cy*ATS;
    if (aiaTile(cx,cy+1)==="~"){
      /* 深水带：崖脚下的暗色 */
      const dg=ctx.createLinearGradient(0,y+ATS+TH-2,0,y+ATS+TH+13);
      dg.addColorStop(0,"rgba(18,48,68,.55)"); dg.addColorStop(1,"rgba(18,48,68,0)");
      ctx.fillStyle=dg; ctx.fillRect(x,y+ATS+TH-2,ATS,13);
      /* 泡沫渐变带 */
      const g=ctx.createLinearGradient(0,y+ATS+TH,0,y+ATS+TH+11);
      g.addColorStop(0,"rgba(255,255,255,.75)"); g.addColorStop(.55,"rgba(255,255,255,.3)"); g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=g; ctx.fillRect(x,y+ATS+TH,ATS,11);
      /* 碎沫点（动） */
      ctx.fillStyle="rgba(255,255,255,.9)";
      for (let i=0;i<4;i++){
        const px=x+((cx*17+i*29)%5)*8+4, py=y+ATS+TH+1+((et*1.1+i*0.7+cx)%1)*8;
        ctx.fillRect(px,py,4,2);
      }
    }
    if (aiaTile(cx,cy-1)==="~"){ const g=ctx.createLinearGradient(0,y-8,0,y);
      g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(255,255,255,.5)");
      ctx.fillStyle=g; ctx.fillRect(x,y-8,ATS,8); }
    if (aiaTile(cx-1,cy)==="~"){ const g=ctx.createLinearGradient(x-8,0,x,0);
      g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(255,255,255,.5)");
      ctx.fillStyle=g; ctx.fillRect(x-8,y,8,ATS); }
    if (aiaTile(cx+1,cy)==="~"){ const g=ctx.createLinearGradient(x+ATS,0,x+ATS+8,0);
      g.addColorStop(0,"rgba(255,255,255,.5)"); g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=g; ctx.fillRect(x+ATS,y,8,ATS); }
  }
  /* Pass3 崖面：盖在下方水格上部 → 陆地“浮”在海上 */
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    const ch=aiaTile(cx,cy); if (ch==="~") continue;
    const x=cx*ATS, y=cy*ATS;
    const grd=ctx.createLinearGradient(0,y+ATS-2,0,y+ATS+TH);
    grd.addColorStop(0,"#e0bd84"); grd.addColorStop(.35,"#c9a06a"); grd.addColorStop(.75,"#a37d4e"); grd.addColorStop(1,"#7c5c38");
    ctx.fillStyle=grd; ctx.fillRect(x,y+ATS-2,ATS,TH+2);
    ctx.strokeStyle="rgba(0,0,0,.16)"; ctx.lineWidth=1;
    for (let i=0;i<2;i++){
      const ox = ((cx*13+i*17)%3)*11+5;
      ctx.beginPath(); ctx.moveTo(x+ox, y+ATS+1); ctx.lineTo(x+ox-2, y+ATS+TH-2); ctx.stroke();
    }
    if ((cx*5+cy*3)%3===0){ ctx.fillStyle="rgba(0,0,0,.13)"; ctx.fillRect(x+7,y+ATS+5,9,3); }
    if ((cx*3+cy*7)%4===0){ ctx.fillStyle="rgba(255,255,255,.14)"; ctx.fillRect(x+21,y+ATS+9,7,2); }
  }
  /* Pass4 陆地顶面：最后画（盖住自身崖面顶部 2px，内部格崖面被下一行顶面遮盖） */
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    const ch=aiaTile(cx,cy); if (ch==="~") continue;
    const x=cx*ATS, y=cy*ATS;
    if (ch===","){
      ctx.fillStyle="#e0d2ae"; ctx.fillRect(x,y,ATS,ATS);
      ctx.fillStyle="#cbb98d"; ctx.fillRect(x,y+ATS-4,ATS,4);
      ctx.fillStyle="rgba(255,255,255,.5)";
      const ph=Math.sin(et*2+cx)*1.5;
      ctx.fillRect(x+4+ph, y+ATS+TH+4, 6, 2); ctx.fillRect(x+24-ph, y+ATS+TH+4, 5, 2);
      continue;
    }
    ctx.fillStyle = ((cx*7+cy*13)%5===0)?GRASS_D:GRASS_C; ctx.fillRect(x,y,ATS,ATS);
    ctx.fillStyle="#8fbd78"; ctx.fillRect(x+9,y+24,7,4);
    ctx.fillStyle="rgba(255,255,255,.2)"; ctx.fillRect(x,y,ATS,3);
    ctx.fillStyle="rgba(0,0,0,.06)"; ctx.fillRect(x,y+ATS-3,ATS,3);
    if (ch==="F"){
      ctx.fillStyle="#463828"; ctx.fillRect(x+5,y+5,ATS-10,ATS-10);
      ctx.fillStyle="#5a4a35"; ctx.fillRect(x+9,y+9,ATS-18,ATS-18);
    }
    if (ch==="_"){
      ctx.fillStyle="#b98c5a"; ctx.fillRect(x,y,ATS,ATS);
      ctx.strokeStyle="rgba(0,0,0,.15)"; ctx.beginPath();
      ctx.moveTo(x,y+13); ctx.lineTo(x+ATS,y+13); ctx.moveTo(x,y+27); ctx.lineTo(x+ATS,y+27); ctx.stroke();
      ctx.fillStyle="#8a6134"; ctx.fillRect(x+4,y+ATS-4,4,TH+6); ctx.fillRect(x+ATS-8,y+ATS-4,4,TH+6);
      continue;
    }
    if (ch==="P"){
      ctx.fillStyle="#bfe3f5"; ctx.fillRect(x,y,ATS,ATS);
      ctx.strokeStyle="rgba(255,255,255,.7)";
      const ph=Math.sin(et*2+cx)*2;
      ctx.beginPath(); ctx.moveTo(x+6,y+18+ph); ctx.lineTo(x+22,y+18+ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+16,y+30-ph); ctx.lineTo(x+34,y+30-ph); ctx.stroke();
      continue;
    }
  }
  /* 岸线亮边 */
  ctx.strokeStyle="rgba(255,255,255,.8)"; ctx.lineWidth=2;
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    if (aiaTile(cx,cy)==="~") continue;
    const x=cx*ATS, y=cy*ATS;
    ctx.beginPath();
    if (aiaTile(cx,cy+1)==="~"){ ctx.moveTo(x,y+ATS); ctx.lineTo(x+ATS,y+ATS); }
    if (aiaTile(cx,cy-1)==="~"){ ctx.moveTo(x,y); ctx.lineTo(x+ATS,y); }
    if (aiaTile(cx-1,cy)==="~"){ ctx.moveTo(x,y); ctx.lineTo(x,y+ATS); }
    if (aiaTile(cx+1,cy)==="~"){ ctx.moveTo(x+ATS,y); ctx.lineTo(x+ATS,y+ATS); }
    ctx.stroke();
  }

  /* ---------- 实体层：y-sort ---------- */
  const ents = [];
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    if (aiaTile(cx,cy)!=="T") continue;
    ents.push({y:cy*ATS+ATS*0.75, draw(){
      const x=cx*ATS+ATS/2, ty=cy*ATS+ATS*0.75, sway=Math.sin(et*1.2+cx)*1.4;
      ctx.fillStyle="rgba(20,40,25,.3)"; ctx.beginPath(); ctx.ellipse(x+7,ty+4,17,6,0,0,7); ctx.fill();
      ctx.fillStyle="#7a5230"; ctx.beginPath();
      ctx.moveTo(x-4.5,ty-2); ctx.lineTo(x-3,ty-20); ctx.lineTo(x+3,ty-20); ctx.lineTo(x+4.5,ty-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#2f6b41";
      ctx.beginPath(); ctx.arc(x+sway,ty-38,19,0,7); ctx.arc(x-13+sway,ty-27,12,0,7); ctx.arc(x+13+sway,ty-29,12,0,7); ctx.fill();
      ctx.fillStyle="#49955d";
      ctx.beginPath(); ctx.arc(x-7+sway,ty-39,8.5,0,7); ctx.arc(x+8+sway,ty-35,7,0,7); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.14)"; ctx.beginPath(); ctx.arc(x-4+sway,ty-43,5,0,7); ctx.fill();
    }});
  }
  ents.push({y:3*ATS+ATS, draw(){
    const hx=3.5*ATS, hy=3*ATS;
    ctx.fillStyle="rgba(20,35,50,.32)"; ctx.beginPath(); ctx.ellipse(hx+14,hy+ATS+2,62,15,0,0,7); ctx.fill();
    ctx.fillStyle="#c99b6a"; ctx.fillRect(hx-46,hy-34,92,ATS+30);
    ctx.fillStyle="#b07f4e"; ctx.fillRect(hx-46,hy-34,10,ATS+30);
    ctx.strokeStyle="#8a6134"; ctx.lineWidth=2; ctx.strokeRect(hx-46,hy-34,92,ATS+30);
    ctx.fillStyle="rgba(0,0,0,.1)"; ctx.fillRect(hx-46,hy-34,92,7);
    ctx.fillStyle="#6b4a2b"; ctx.fillRect(hx-13,hy-10,26,ATS+4);
    ctx.fillStyle="#d9b96a"; ctx.beginPath(); ctx.arc(hx+7,hy+10,2.5,0,7); ctx.fill();
    ctx.fillStyle="#5f8f6e"; ctx.fillRect(hx-38,hy-24,16,14); ctx.fillStyle="#cfe8f5"; ctx.fillRect(hx+22,hy-24,16,14);
    ctx.strokeStyle="#8a6134"; ctx.strokeRect(hx-38,hy-24,16,14); ctx.strokeRect(hx+22,hy-24,16,14);
    ctx.fillStyle="#7a4a26"; ctx.beginPath(); ctx.moveTo(hx-58,hy-30); ctx.lineTo(hx,hy-66); ctx.lineTo(hx+58,hy-30); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#a0522d"; ctx.beginPath(); ctx.moveTo(hx-56,hy-31); ctx.lineTo(hx,hy-64); ctx.lineTo(hx+56,hy-31); ctx.lineTo(hx+50,hy-27); ctx.lineTo(hx-50,hy-27); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.16)"; ctx.beginPath(); ctx.moveTo(hx-54,hy-32); ctx.lineTo(hx,hy-62); ctx.lineTo(hx-6,hy-31); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="#8a3d1f"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(hx-58,hy-30); ctx.lineTo(hx,hy-66); ctx.lineTo(hx+58,hy-30); ctx.stroke();
    ctx.fillStyle="#e8d9b0"; ctx.fillRect(hx-2,hy-70,4,8);
  }});
  ents.push({y:3*ATS+ATS*0.8, draw(){
    const x=9*ATS+ATS/2, y=3*ATS+ATS*0.8;
    ctx.fillStyle="rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(x,y+8,13,4,0,0,7); ctx.fill();
    ctx.fillStyle="#2e3440"; ctx.beginPath(); ctx.ellipse(x,y,13,9,0,0,7); ctx.fill();
    ctx.fillStyle="#3b4252"; ctx.fillRect(x-13,y-6,26,7);
    ctx.fillStyle="#7bd389";
    for (let i=0;i<3;i++){ const ph=(et*1.4+i*0.9)%1;
      ctx.globalAlpha=1-ph; ctx.beginPath(); ctx.arc(x-7+i*7, y-9-ph*12, 2.4+ph*1.5, 0, 7); ctx.fill(); }
    ctx.globalAlpha=1;
  }});
  ents.push({y:8*ATS+ATS*0.85, draw(){
    const x=15*ATS+ATS/2, y=8*ATS+ATS*0.85;
    ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(x,y+4,13,4.5,0,0,7); ctx.fill();
    ctx.fillStyle="#9aa7b4"; ctx.beginPath();
    ctx.moveTo(x-10,y+3); ctx.lineTo(x-9,y-24); ctx.quadraticCurveTo(x,y-31,x+9,y-24); ctx.lineTo(x+10,y+3); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#7f8c99";
    ctx.fillRect(x-6,y-20,12,3); ctx.fillRect(x-6,y-13,12,3); ctx.fillRect(x-5,y-6,10,6);
  }});
  for (const g of GRASS_NODES){
    ents.push({y:g.y+14, draw(){
      const x=g.x, y=g.y;
      ctx.fillStyle="rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(x,y+13,11,4,0,0,7); ctx.fill();
      ctx.strokeStyle="#2f7d46"; ctx.lineWidth=2.4; ctx.lineCap="round";
      for (const [dx,h,tilt] of [[-8,15,-3],[0,20,0],[8,14,3]]){
        ctx.beginPath(); ctx.moveTo(dx+x, y+13); ctx.quadraticCurveTo(dx+tilt+x, y+13-h/2, dx+tilt*1.7+x, y+13-h); ctx.stroke();
      }
      const gl=0.6+Math.sin(et*2.4)*0.35;
      ctx.fillStyle=`rgba(234,247,255,${gl})`;
      ctx.beginPath(); ctx.arc(x, y-7, 2.6, 0, 7); ctx.arc(x+5, y-3, 1.8, 0, 7); ctx.arc(x-5, y-4, 1.8, 0, 7); ctx.fill();
    }});
  }
  /* 篝火（F：烤肉点，动态火苗 + 火星） */
  ents.push({y:8*ATS+ATS*0.95, draw(){
    const x=16*ATS+ATS/2, y=8*ATS+ATS*0.95;
    ctx.fillStyle="rgba(20,35,50,.25)"; ctx.beginPath(); ctx.ellipse(x,y+4,17,6,0,0,7); ctx.fill();
    ctx.fillStyle="#8b8f96";
    for (let i=0;i<7;i++){ const a=i*0.9; ctx.beginPath(); ctx.arc(x+Math.cos(a)*14, y+Math.sin(a)*5+2, 2.8, 0, 7); ctx.fill(); }
    ctx.strokeStyle="#6e4a2b"; ctx.lineWidth=4; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x-9,y+1); ctx.lineTo(x+9,y-4); ctx.moveTo(x+9,y+1); ctx.lineTo(x-9,y-4); ctx.stroke();
    const fl=Math.sin(et*7)*2, fl2=Math.sin(et*11+1)*1.6;
    ctx.fillStyle="#e0782e"; ctx.beginPath();
    ctx.moveTo(x-7,y-2); ctx.quadraticCurveTo(x-3,y-13-fl2, x+fl*0.5, y-17-fl);
    ctx.quadraticCurveTo(x+4,y-12+fl2, x+7,y-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#f7c74a"; ctx.beginPath();
    ctx.moveTo(x-4,y-2); ctx.quadraticCurveTo(x+fl*0.4,y-9-fl2, x+fl*0.6,y-11-fl);
    ctx.quadraticCurveTo(x+3,y-7+fl2, x+4,y-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(255,190,80,.85)";
    for (let i=0;i<3;i++){ const p=(et*1.2+i*0.37)%1; ctx.globalAlpha=1-p; ctx.fillRect(x-5+i*5+Math.sin(et*3+i)*2, y-15-p*15, 2, 2); }
    ctx.globalAlpha=1;
  }});
  /* 野猪（战斗实体：血条 + AI 状态可视化） */
  if (boar.alive) ents.push({y:boar.y+12, draw(){
    const sh = (performance.now()-boar.hitAt < 260) ? Math.sin(performance.now()/22)*3 : 0;
    const m = boar.mode, bx = boar.x + sh, by = boar.y;
    const oink = m==="tired" ? Math.sin(et*4)*2.5 : (boar.hp < boar.max ? Math.sin(et*6)*1 : 0);
    /* dash 残影：身后两道渐隐身形 */
    if (m==="dash" && boar.dir){
      for (let g=1; g<=2; g++){
        ctx.globalAlpha = 0.16/g;
        ctx.fillStyle = "#6e4b32";
        ctx.beginPath(); ctx.ellipse(bx-boar.dir.x*11*g, by-boar.dir.y*11*g, 14, 8, 0, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle="rgba(20,35,50,.28)"; ctx.beginPath(); ctx.ellipse(bx+4,by+12,15,5,0,0,7); ctx.fill();
    const flip = (m!=="idle" && boar.dir && boar.dir.x>0) ? -1 : 1;   /* 冲撞方向朝右时镜像 */
    const lean = m==="windup" ? 4 : 0;                              /* 蓄力后倾 */
    ctx.save();
    ctx.translate(bx, by); ctx.scale(flip, 1);
    ctx.fillStyle="#6e4b32"; ctx.beginPath(); ctx.ellipse(lean, oink, 15, 9, 0, 0, 7); ctx.fill();          /* 身 */
    ctx.fillStyle="#5a3c27"; ctx.beginPath(); ctx.arc(lean-13, oink, 7, 0, 7); ctx.fill();                    /* 头 */
    ctx.fillStyle="#4c301e"; ctx.beginPath(); ctx.ellipse(lean-18, 2+oink, 3.5, 2.5, 0.3, 0, 7); ctx.fill();  /* 吻 */
    ctx.fillStyle="#efe3d0";                                                                    /* 獠牙 */
    ctx.beginPath(); ctx.moveTo(lean-19,oink); ctx.lineTo(lean-23,-5+oink); ctx.lineTo(lean-17,-1+oink); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="#4c301e"; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(lean-6,8+oink); ctx.lineTo(lean-8,14); ctx.moveTo(lean+6,8+oink); ctx.lineTo(lean+8,14); ctx.stroke(); /* 腿 */
    ctx.strokeStyle="#e8b04b"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(lean+9,2+oink); ctx.lineTo(lean+13,2+oink); ctx.stroke();            /* 尾 */
    ctx.fillStyle="#241a12"; ctx.beginPath(); ctx.arc(lean-14,-3+oink,1.6,0,7); ctx.fill();       /* 眼 */
    if (m==="windup"){                                       /* 蓄力尘土：脚下向后扬 */
      ctx.fillStyle="rgba(160,130,90,.55)";
      for (let i=0;i<3;i++){
        const p=(et*3+i*0.33)%1; ctx.globalAlpha=(1-p)*0.55;
        ctx.fillRect(lean+8+p*10, 10-p*4, 3, 3);
      }
      ctx.globalAlpha=1;
    }
    if (m==="tired"){                                        /* 硬直喘气：汗滴 */
      ctx.fillStyle="rgba(140,200,240,.85)";
      ctx.beginPath(); ctx.arc(lean-10,-12+Math.sin(et*5)*1.5,1.8,0,7); ctx.arc(lean-4,-14+Math.cos(et*5)*1.5,1.5,0,7); ctx.fill();
    }
    ctx.restore();
    ctx.textAlign="center";
    if (m==="aggro"){ ctx.fillStyle="#ffd23e"; ctx.font="bold 13px 'Segoe UI'"; ctx.fillText("!", bx, by-18); }
    if (m==="windup"){ ctx.fillStyle="#ff9d3e"; ctx.font="bold 12px 'Segoe UI'"; ctx.fillText(boar.dir.x>0?"▶▶":"◀◀", bx, by-19); }
    /* 头顶血条 */
    if (boar.hp < boar.max){
      const w = 34, pct = Math.max(0, boar.hp/boar.max);
      ctx.fillStyle="rgba(10,16,24,.7)"; ctx.fillRect(bx-w/2-1, by-16, w+2, 6);
      ctx.fillStyle="#e05252"; ctx.fillRect(bx-w/2, by-15, w*pct, 4);
      ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1; ctx.strokeRect(bx-w/2-1.5, by-16.5, w+3, 7);
    }
  }});
  ents.push({y:witch.y+13, draw(){
    const x=witch.x, y=witch.y, bob=Math.sin(et*2)*1.5;
    ctx.fillStyle="rgba(20,35,50,.3)"; ctx.beginPath(); ctx.ellipse(x+6,y+15,14,5,0,0,7); ctx.fill();
    ctx.fillStyle="#5b4a8a"; ctx.beginPath(); ctx.moveTo(x-12,y+12); ctx.lineTo(x+12,y+12); ctx.lineTo(x,y-9-bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#f1c9a5"; ctx.beginPath(); ctx.arc(x,y-13-bob,7,0,7); ctx.fill();
    ctx.fillStyle="#2c2440"; ctx.beginPath(); ctx.arc(x,y-16-bob,8,Math.PI,0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x-9,y-14-bob); ctx.lineTo(x-15,y+3-bob); ctx.lineTo(x-8,y-6-bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#2c2440"; ctx.beginPath(); ctx.ellipse(x-2,y-27-bob,10,4,-0.4,0,7); ctx.fill();
    ctx.fillStyle="#ffd66b"; ctx.beginPath(); ctx.moveTo(x-1,y-26-bob); ctx.lineTo(x+6,y-22-bob); ctx.lineTo(x-1,y-18-bob); ctx.closePath(); ctx.fill();
  }});
  pushPlayerEnt(ents);

  ents.sort((a,b)=>a.y-b.y);
  for (const e of ents) e.draw();
}
/* 玩家实体绘制（埃亚岛/冥界共用） */
function pushPlayerEnt(ents){
  ents.push({y:aiaPlayer.y+13, draw(){
    const x=aiaPlayer.x, y=aiaPlayer.y, sw=aiaPlayer.moving?Math.sin(aiaPlayer.step)*2.5:0;
    ctx.fillStyle="rgba(20,35,50,.3)"; ctx.beginPath(); ctx.ellipse(x+4,y+15,10,4,0,0,7); ctx.fill();
    ctx.fillStyle="#e8b04b"; ctx.fillRect(x-7+sw*0.3, y+2, 5, 10); ctx.fillRect(x+2-sw*0.3, y+2, 5, 10);
    ctx.fillStyle="#3b82f6"; ctx.fillRect(x-8, y-8, 16, 12);
    ctx.fillStyle="rgba(255,255,255,.18)"; ctx.fillRect(x-8, y-8, 16, 4);
    ctx.fillStyle="#f1c9a5"; ctx.beginPath(); ctx.arc(x, y-14, 7, 0, 7); ctx.fill();
    ctx.fillStyle="#5a3d2b"; ctx.beginPath(); ctx.arc(x, y-16, 7, Math.PI, 0); ctx.fill();
    if (aiaPlayer.face==="left"){ ctx.fillStyle="#243244"; ctx.fillRect(x-5,y-15,2,2); }
    else if (aiaPlayer.face==="right"){ ctx.fillStyle="#243244"; ctx.fillRect(x+3,y-15,2,2); }
    else { ctx.fillStyle="#243244"; ctx.fillRect(x-4,y-15,2,2); ctx.fillRect(x+2,y-15,2,2); }
    if (state.equipped){ ctx.strokeStyle="#8a6b47"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(x+9,y+6); ctx.lineTo(x+15,y-14); ctx.stroke(); }
  }});
}

/* ---------- 冥界 2.5D 绘制（冷磷光：近黑 + 淡青磷光 + 献祭暗红） ---------- */
function drawHades(et){
  /* Pass1 冥河水格 */
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    if (hTile(cx,cy)!=="~") continue;
    const x=cx*ATS, y=cy*ATS;
    const near = hTile(cx,cy-1)!=="~"||hTile(cx,cy+1)!=="~"||hTile(cx-1,cy)!=="~"||hTile(cx+1,cy)!=="~";
    ctx.fillStyle = near ? "#14202e" : "#0c1622"; ctx.fillRect(x,y,ATS,ATS);
    if ((cx*11+cy*5)%3===0){
      ctx.strokeStyle="rgba(127,209,200,.20)"; ctx.lineWidth=1.4;
      const ph=Math.sin(et*1.1+cx*1.3+cy*2.1)*3;
      ctx.beginPath(); ctx.moveTo(x+8,y+20+ph); ctx.lineTo(x+22,y+20+ph); ctx.stroke();
    }
  }
  /* 整体投影（冥界浮在更黑的水上） */
  ctx.fillStyle="rgba(2,6,10,.5)";
  ctx.beginPath(); ctx.ellipse(400, 448, 348, 52, 0, 0, 7); ctx.fill();
  /* Pass2 水侧磷光边 + 深暗带 */
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    if (hTile(cx,cy)==="~") continue;
    const x=cx*ATS, y=cy*ATS;
    if (hTile(cx,cy+1)==="~"){
      const dg=ctx.createLinearGradient(0,y+ATS+TH-2,0,y+ATS+TH+13);
      dg.addColorStop(0,"rgba(2,6,10,.6)"); dg.addColorStop(1,"rgba(2,6,10,0)");
      ctx.fillStyle=dg; ctx.fillRect(x,y+ATS+TH-2,ATS,13);
      const g=ctx.createLinearGradient(0,y+ATS+TH,0,y+ATS+TH+10);
      g.addColorStop(0,"rgba(127,209,200,.28)"); g.addColorStop(.5,"rgba(127,209,200,.1)"); g.addColorStop(1,"rgba(127,209,200,0)");
      ctx.fillStyle=g; ctx.fillRect(x,y+ATS+TH,ATS,10);
    }
    if (hTile(cx,cy-1)==="~"){ const g=ctx.createLinearGradient(0,y-8,0,y);
      g.addColorStop(0,"rgba(127,209,200,0)"); g.addColorStop(1,"rgba(127,209,200,.22)");
      ctx.fillStyle=g; ctx.fillRect(x,y-8,ATS,8); }
    if (hTile(cx-1,cy)==="~"){ const g=ctx.createLinearGradient(x-8,0,x,0);
      g.addColorStop(0,"rgba(127,209,200,0)"); g.addColorStop(1,"rgba(127,209,200,.22)");
      ctx.fillStyle=g; ctx.fillRect(x-8,y,8,ATS); }
    if (hTile(cx+1,cy)==="~"){ const g=ctx.createLinearGradient(x+ATS,0,x+ATS+8,0);
      g.addColorStop(0,"rgba(127,209,200,.22)"); g.addColorStop(1,"rgba(127,209,200,0)");
      ctx.fillStyle=g; ctx.fillRect(x+ATS,y,8,ATS); }
  }
  /* Pass3 冷崖面 */
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    const ch=hTile(cx,cy); if (ch==="~") continue;
    const x=cx*ATS, y=cy*ATS;
    const grd=ctx.createLinearGradient(0,y+ATS-2,0,y+ATS+TH);
    grd.addColorStop(0,"#322e40"); grd.addColorStop(.35,"#282437"); grd.addColorStop(.75,"#1c1928"); grd.addColorStop(1,"#14111e");
    ctx.fillStyle=grd; ctx.fillRect(x,y+ATS-2,ATS,TH+2);
    ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.lineWidth=1;
    for (let i=0;i<2;i++){
      const ox = ((cx*13+i*17)%3)*11+5;
      ctx.beginPath(); ctx.moveTo(x+ox, y+ATS+1); ctx.lineTo(x+ox-2, y+ATS+TH-2); ctx.stroke();
    }
  }
  /* Pass4 地面 / 冥路 / 栈桥 */
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    const ch=hTile(cx,cy); if (ch==="~") continue;
    const x=cx*ATS, y=cy*ATS;
    if (ch===","){
      ctx.fillStyle="#3d4552"; ctx.fillRect(x,y,ATS,ATS);
      ctx.fillStyle="#2b3240"; ctx.fillRect(x,y+ATS-4,ATS,4);
      ctx.fillStyle="rgba(127,209,200,.14)";
      const ph=Math.sin(et*1.6+cx)*1.5;
      ctx.fillRect(x+4+ph, y+ATS+TH+4, 6, 2); ctx.fillRect(x+24-ph, y+ATS+TH+4, 5, 2);
      continue;
    }
    ctx.fillStyle="#141a24"; ctx.fillRect(x,y,ATS,ATS);
    if ((cx*5+cy*3)%4===0){ ctx.fillStyle="rgba(127,209,200,.08)"; ctx.fillRect(x+6,y+8,8,3); }
    if ((cx*3+cy*7)%5===0){ ctx.fillStyle="rgba(127,209,200,.05)"; ctx.fillRect(x+20,y+22,10,4); }
    if (ch==="_"){
      ctx.fillStyle="#343945"; ctx.fillRect(x,y,ATS,ATS);
      ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.beginPath();
      ctx.moveTo(x,y+13); ctx.lineTo(x+ATS,y+13); ctx.moveTo(x,y+27); ctx.lineTo(x+ATS,y+27); ctx.stroke();
      ctx.fillStyle="#262b36"; ctx.fillRect(x+4,y+ATS-4,4,TH+6); ctx.fillRect(x+ATS-8,y+ATS-4,4,TH+6);
      continue;
    }
  }
  /* 岸线磷光亮边 */
  ctx.strokeStyle="rgba(127,209,200,.5)"; ctx.lineWidth=1.6;
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    if (hTile(cx,cy)==="~") continue;
    const x=cx*ATS, y=cy*ATS;
    ctx.beginPath();
    if (hTile(cx,cy+1)==="~"){ ctx.moveTo(x,y+ATS); ctx.lineTo(x+ATS,y+ATS); }
    if (hTile(cx,cy-1)==="~"){ ctx.moveTo(x,y); ctx.lineTo(x+ATS,y); }
    if (hTile(cx-1,cy)==="~"){ ctx.moveTo(x,y); ctx.lineTo(x,y+ATS); }
    if (hTile(cx+1,cy)==="~"){ ctx.moveTo(x+ATS,y); ctx.lineTo(x+ATS,y+ATS); }
    ctx.stroke();
  }

  /* ---------- 实体层 y-sort ---------- */
  const ents = [];
  for (let cy=0; cy<AROWS; cy++) for (let cx=0; cx<ACOLS; cx++){
    if (hTile(cx,cy)!=="T") continue;
    ents.push({y:cy*ATS+ATS*0.75, draw(){
      const x=cx*ATS+ATS/2, ty=cy*ATS+ATS*0.75, sway=Math.sin(et*0.8+cx)*0.8;
      /* 白杨：银灰细干 + 狭长暗青冠 */
      ctx.fillStyle="rgba(4,8,14,.45)"; ctx.beginPath(); ctx.ellipse(x+6,ty+4,10,4,0,0,7); ctx.fill();
      ctx.fillStyle="#5a5f6e"; ctx.fillRect(x-2.5+sway*0.5, ty-34, 5, 34);
      ctx.strokeStyle="rgba(127,209,200,.16)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x-2+sway, ty-12); ctx.lineTo(x+2+sway, ty-30); ctx.stroke();
      ctx.fillStyle="#24444e";
      ctx.beginPath(); ctx.ellipse(x+sway, ty-46, 8, 16, 0, 0, 7); ctx.fill();
      ctx.fillStyle="#2f5560";
      ctx.beginPath(); ctx.ellipse(x-4+sway, ty-38, 5, 10, 0, 0, 7); ctx.fill();
      ctx.fillStyle="rgba(127,209,200,.10)"; ctx.beginPath(); ctx.ellipse(x+2+sway, ty-50, 4, 8, 0, 0, 7); ctx.fill();
    }});
  }
  /* 献祭沟 */
  ents.push({y:3*ATS+ATS*0.9, draw(){
    const x=11*ATS+ATS/2, y=3*ATS+ATS*0.9;
    ctx.fillStyle="rgba(4,8,14,.5)"; ctx.beginPath(); ctx.ellipse(x,y+6,26,8,0,0,7); ctx.fill();
    ctx.fillStyle="#4a4f5e";
    for (let i=0;i<8;i++){ const a=i*0.785; ctx.beginPath(); ctx.arc(x+Math.cos(a)*24, y+Math.sin(a)*9+3, 4, 0, 7); ctx.fill(); }
    ctx.fillStyle="#05070c"; ctx.beginPath(); ctx.ellipse(x, y+2, 17, 7, 0, 0, 7); ctx.fill();
    const glow = state.offered ? 0.55 : 0.22;
    ctx.fillStyle=`rgba(200,60,45,${glow})`; ctx.beginPath(); ctx.ellipse(x, y+2, 14, 5, 0, 0, 7); ctx.fill();
    if (state.offered){ ctx.fillStyle="rgba(255,110,70,.30)"; ctx.beginPath(); ctx.ellipse(x, y+1, 10, 3.5, 0, 0, 7); ctx.fill(); }
    /* 烟气：青白磷光粒子上升 */
    for (let i=0;i<4;i++){
      const p=(et*0.55+i*0.25)%1;
      ctx.globalAlpha=(1-p)*0.35;
      ctx.fillStyle = state.offered ? "#c76a5a" : "#9fd8cf";
      ctx.fillRect(x-8+((i*17)%12)+Math.sin(et*2+i)*3, y-4-p*22, 3, 3);
    }
    ctx.globalAlpha=1;
  }});
  /* 亡魂（游荡的半透明轮廓，纯装饰） */
  for (let gh of GHOSTS){
    ents.push({y:gh.by+10, draw(){
      const x = gh.bx + Math.sin(et*gh.p)*gh.ax;
      const y = gh.by + Math.sin(et*gh.p*1.3)*gh.ay;
      const a = 0.28 + Math.sin(et*1.5+gh.p)*0.1;
      ctx.globalAlpha = a;
      ctx.fillStyle="#bfe8e2";
      ctx.beginPath(); ctx.moveTo(x-8,y+10); ctx.quadraticCurveTo(x-10,y-4,x,y-6);
      ctx.quadraticCurveTo(x+10,y-4,x+8,y+10); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y-12, 5.5, 0, 7); ctx.fill();
      ctx.globalAlpha = a*0.6;
      ctx.fillStyle="#7fd1c8"; ctx.fillRect(x-10, y+10, 20, 2);
      ctx.globalAlpha = 1;
    }});
  }
  /* 特瑞西阿斯（献祭前模糊半透明，献祭后显形） */
  ents.push({y:seer.y+13, draw(){
    const x=seer.x, y=seer.y+Math.sin(et*1.2)*1.2;
    ctx.globalAlpha = state.offered ? 1 : 0.55;
    /* 淡青 aura */
    ctx.fillStyle="rgba(127,209,200,.10)"; ctx.beginPath(); ctx.arc(x, y-4, 26, 0, 7); ctx.fill();
    ctx.fillStyle="rgba(4,8,14,.4)"; ctx.beginPath(); ctx.ellipse(x+4,y+14,12,4,0,0,7); ctx.fill();
    /* 白袍 */
    ctx.fillStyle="#dfe3ea"; ctx.beginPath();
    ctx.moveTo(x-11,y+12); ctx.quadraticCurveTo(x-9,y-12,x-4,y-16);
    ctx.lineTo(x+4,y-16); ctx.quadraticCurveTo(x+9,y-12,x+11,y+12); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#c3c9d6"; ctx.fillRect(x-11,y+4,22,8);
    /* 头（闭眼盲者） */
    ctx.fillStyle="#e8dcc8"; ctx.beginPath(); ctx.arc(x, y-21, 7, 0, 7); ctx.fill();
    ctx.strokeStyle="#4a4438"; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(x-5,y-21); ctx.lineTo(x+5,y-21); ctx.stroke();
    /* 光头/白发 */
    ctx.fillStyle="#cdd4e0"; ctx.beginPath(); ctx.arc(x, y-24, 6.5, Math.PI, 0); ctx.fill();
    /* 曲杖 */
    ctx.strokeStyle="#2b2f3a"; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(x+12,y+12); ctx.lineTo(x+10,y-18);
    ctx.quadraticCurveTo(x+9,y-26,x+3,y-26); ctx.stroke();
    /* 杖顶微光（亡者之眼） */
    ctx.fillStyle="rgba(159,216,207,.85)"; ctx.beginPath(); ctx.arc(x+3, y-26, 2.2+Math.sin(et*2.4)*0.7, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }});
  pushPlayerEnt(ents);

  ents.sort((a,b)=>a.y-b.y);
  for (const e of ents) e.draw();

  /* 全屏磷光浮游粒子 + 边缘暗角 */
  for (let i=0;i<14;i++){
    const p=(et*0.12+i*0.071)%1;
    const px=((i*137)%780)+Math.sin(et*0.5+i)*20, py=p*480;
    ctx.globalAlpha=0.10+Math.sin(et+i)*0.06;
    ctx.fillStyle="#9fd8cf"; ctx.fillRect(px, py, 2, 2);
  }
  ctx.globalAlpha=1;
  const vg=ctx.createRadialGradient(400,240,180, 400,240,560);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(2,4,8,.55)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,1000,600);
}

/* ---------- 提示 / 气泡 ---------- */
const hintEl=document.getElementById("hint"), ambEl=document.getElementById("ambient"), zoneEl=document.getElementById("zone");
function updateHintDOM(){
  zoneEl.textContent = scene==="world" ? "地中海 · 航行中" : scene==="hades" ? "冥界 · 俄刻阿诺斯之岸" : "埃亚岛 · 女巫的领地";
  if (scene==="world"){
    const is = islandNear();
    if (is && !dlgOpen){
      hintEl.style.display="block";
      hintEl.innerHTML = `<b>E</b> · ${is.open?"登陆":"了望"} ${is.name}`;
      hintEl.style.left=((is.gx*WTS+WTS/2)/(WCOLS*WTS)*100)+"%"; hintEl.style.top=((is.gy*WTS)/(WROWS*WTS)*100)+"%";
    } else hintEl.style.display="none";
    ambEl.style.display="none";
    return;
  }
  const s = aiaNear();
  if (s && !dlgOpen){
    hintEl.style.display="block";
    hintEl.innerHTML = `<b>E</b> · ${s.label}`;
    hintEl.style.left = (s.x/800*100)+"%"; hintEl.style.top  = ((s.y-30)/480*100)+"%";
  } else hintEl.style.display="none";
  const nearWitch = scene==="aia" && Math.hypot(aiaPlayer.x-witch.x, aiaPlayer.y-witch.y) < 150;
  if (nearWitch && !dlgOpen){
    ambEl.style.display="block";
    ambEl.style.left=(witch.x/800*100)+"%"; ambEl.style.top=((witch.y-36)/480*100)+"%";
    ambEl.textContent = state.quest && !state.quest.done && state.quest.have<state.quest.need
      ? "玛草还差 "+(state.quest.need-state.quest.have)+" 株。东边的草丛，发光的那些。"
      : "来了就进来，别杵在风口。";
  } else ambEl.style.display="none";
}

/* ==================== Toast / HUD ==================== */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.opacity=0, 2400);
}
function renderHUD(){
  document.getElementById("hudCoins").textContent = state.coins;
  document.getElementById("hudHp").textContent = state.hp;
  const bar = document.getElementById("hudHpBar");
  const pct = Math.max(0, Math.min(100, state.hp))/100;
  bar.style.width = (pct*100)+"%";
  bar.style.background = state.hp>60 ? "#3fae6a" : state.hp>30 ? "#e0a23c" : "#e05252";
  const q=document.getElementById("hudQuest");
  if (state.quest && !state.quest.done){ q.style.display=""; q.innerHTML=`委托「${state.quest.name}」 <b>${state.quest.have}/${state.quest.need}</b>`; }
  else if (state.quest && state.quest.done){ q.style.display=""; q.innerHTML=`委托已完成`; }
  else q.style.display="none";
  const ks=Object.keys(state.backpack);
  document.getElementById("bagList").innerHTML = ks.length
    ? ks.map(k=>`<div class="it"><span>${k}</span><b>×${state.backpack[k]}</b></div>`).join("")
      + (state.equipped?`<div class="it"><span>手持</span><b>${state.equipped}</b></div>`:"")
    : '<div style="color:#b6c2d2;font-size:12px">（空空如也）</div>';
}
document.getElementById("bagBtn").onclick = ()=>{
  const p=document.getElementById("bagPanel");
  p.style.display = p.style.display==="block" ? "none" : "block";
  renderHUD();
};

/* ==================== 游戏逻辑（女巫） ==================== */
function addItem(n,q=1){ state.backpack[n]=(state.backpack[n]||0)+q; }
function delItem(n,q=1){
  if (!state.backpack[n]) return false;
  state.backpack[n]-=q; if (state.backpack[n]<=0) delete state.backpack[n];
  return true;
}
function toNum(v){
  if (v===undefined||v===null||v==="") return 1;
  const s=String(v).replace(/[瓶株个壶卷罐捆袋块枚片根只条匹名]/g,"").trim();
  const N={"一":1,"两":2,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10};
  if (/^\d+$/.test(s)) return Math.min(parseInt(s),99);
  const m=s.match(/[一二两二三四五六七八九十]/); return m?N[m[0]]:1;
}
const PH = {"购买物品":"想买点什么？我这儿有治疗草药、玛草、蜂蜜酒、蜂蜜、橄榄油。",
  "卖出物品":"想卖什么？掏出来看看。","查询价格":"问哪样东西的价？","查询库存":"问哪样货？",
  "丢弃物品":"扔哪个？说名字。","给予物品":"把什么给我？","装备物品":"装备哪件？",
  "卸下装备":"卸下哪件？","使用消耗品":"用什么？说名字。","导航到地点":"去哪儿？说个地名。",
  "查询环境状况":"问风、浪、还是天色？","查询地点信息":"问哪个地方？","查询生物情报":"问哪种活物？",
  "查询神谕":"想听关于什么的预言？","接取任务":"接哪件活？","提交任务":"交哪件差事？",
  "放弃任务":"放弃哪件？","查询任务进度":"问哪件任务的进度？","查询任务线索":"想打听什么？",
  "获取物资":"想弄点什么回来？屋后东边的草丛里，发光的就是玛草。","营地准备":"要张罗什么？","请求帮助":"说说你卡在哪儿了。","闲聊":null};
function handle(category, args){
  if (currentNPC === "seer") return handleSeer(category, args);
  const a=args||{};
  const g=k=>(a[k]!==undefined&&a[k]!==null&&String(a[k]).trim()!=="")?String(a[k]).trim():null;
  switch(category){
  case "购买物品":{
    const item=g("物品"); if(!item) return {text:PH[category]};
    if(!SHOP[item]) return {text:`（她扫了一眼货架）「${item}」我可不出售。货架上就那几样。`};
    const q=Math.max(1,toNum(g("数量"))), cost=SHOP[item]*q;
    if(state.coins<cost) return {text:`（她瞥了瞥你的钱袋）${item} ${q} 份要 ${cost} 枚德拉克马——你还差 ${cost-state.coins} 枚。`};
    state.coins-=cost; addItem(item,q);
    return {text:`（她把 ${item}${q>1?`×${q}`:""} 推过来，收走 ${cost} 枚德拉克马）拿好。还剩 ${state.coins} 枚。`};
  }
  case "卖出物品":{
    const item=g("物品"); if(!item) return {text:PH[category]};
    if(!state.backpack[item]) return {text:`你身上哪有「${item}」？`};
    let q=Math.min(toNum(g("数量")), state.backpack[item]);
    const price=SHOP[item]?Math.max(1,Math.floor(SHOP[item]/2)):2;
    delItem(item,q); state.coins+=price*q;
    return {text:`（她接过来翻看两下，丢给你 ${price*q} 枚德拉克马）勉强收了。`};
  }
  case "查询价格":{
    const item=g("物品"); if(!item) return {text:PH[category]};
    if(SHOP[item]) return {text:`${item}，一枚 ${SHOP[item]} 德拉克马。`};
    return {text:`「${item}」？我不往外卖。卖给我的话……给你 2 枚。`};
  }
  case "查询库存":{
    const item=g("物品");
    if(item) return SHOP[item]?{text:`${item}有货，一枚 ${SHOP[item]} 德拉克马。`}:{text:`${item}？没听过，不卖。`};

function extractJSON(text){
  text=(text||"").trim();
  let m=text.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) text=m[1].trim();
  try{const d=JSON.parse(text); if(Array.isArray(d)) return d; if(d&&typeof d==="object") return [d];}catch(e){}
  const a=text.indexOf("["), b=text.lastIndexOf("]");
  if(a!==-1&&b>a){try{const d=JSON.parse(text.slice(a,b+1)); if(Array.isArray(d)) return d;}catch(e){}}
  return null;
}
async function apiParse(userText){
  const lines=history[currentNPC].slice(-6).map(h=>(h.role==="user"?"Human: ":"AI: ")+h.content);
  lines.push("Human: "+userText);
  const prompt=TASK_INSTRUCTION.replace("{schema}",JSON.stringify(SCHEMA)).replace("{user_input}",lines.join("\n"));
  const r=await fetch("/api/parse",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const d=await r.json().catch(()=>({error:"响应异常"}));
  if(d.error||!d.content) throw new Error(d.error||"解析失败");
  const preds=extractJSON(d.content);
  if(!preds) throw new Error("模型输出无法解析");
  return preds.filter(p=>p&&typeof p==="object"&&p.category);
}
async function apiChat(instruction){
  const N = NPCS[currentNPC];
  const messages=[{role:"system",content:N.persona+"\n\n当前情境："+instruction},
    ...history[currentNPC].slice(-6).map(h=>({role:h.role==="user"?"user":"assistant",content:h.content}))];
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
  const d=await r.json().catch(()=>({error:"响应异常"}));
  if(d.error||!d.content) throw new Error(d.error||"台词失败");
  return d.content.trim();
}

  const col=document.createElement("div"); col.className="col";
  const who=document.createElement("div"); who.className="who"; who.textContent=role==="user"?"你":NPCS[currentNPC].name;
  const bb=document.createElement("div"); bb.className="bubble "+(role==="user"?"me":"witch"); bb.textContent=text;
  col.appendChild(who); col.appendChild(bb);
  if(chips&&chips.length){
    const cw=document.createElement("div"); cw.className="chips";
    chips.forEach(c=>{const s=document.createElement("span"); s.className="chip"; s.innerHTML=c; cw.appendChild(s);});
    col.appendChild(cw);
  }
  row.appendChild(col);
  document.getElementById("msgs").appendChild(row);
  document.getElementById("msgs").scrollTop=1e9;
}
function chipHTML(category,args){
  const pairs=Object.entries(args||{}).map(([k,v])=>`${k}:${v}`).join(" · ");
  return `<b>${category}</b>`+(pairs?`　${pairs}`:"");
}
let busy=false;
async function send(preset){
  const text=(preset!==undefined&&typeof preset==="string"?preset:document.getElementById("inp").value).trim();
  if(!text||busy) return;
  busy=true; document.getElementById("sendBtn").disabled=true; document.getElementById("inp").value="";
  addMsg("user",text); history[currentNPC].push({role:"user",content:text});
  try{
    const preds=await apiParse(text);
    const parts=[],chips=[],pq=[];
    for(const p of preds){
      const insts=Array.isArray(p.args)&&p.args.length?p.args:[{}];
      let np=false;
      for(const inst of insts){ chips.push(chipHTML(p.category,inst)); const r=handle(p.category,inst); if(r) parts.push(r.text); else np=true; }
      if(np) pq.push(p);
    }
    if(pq.length){
      const jobs=pq.map(p=>npcJob(p.category)).join("；");
      try{ parts.push(await apiChat(`玩家刚说：「${text}」。涉及话题：${jobs}。`)); }
      catch(e){ parts.push(currentNPC==="seer"?"（黑暗里静了一瞬）……水声盖过了你的话。再说一次。":"（她皱了皱眉）……风太乱，没听清。再说一遍？"); }
    }
    const reply=parts.join("\n")||(currentNPC==="seer"?"（他静默着，像一块黑石。）":"（她看了你一眼，没说话。）");
    addMsg("witch",reply,chips);
    history[currentNPC].push({role:"assistant",content:reply});
  }catch(e){
    addMsg("witch",(currentNPC==="seer"?"（杖声顿了顿）黑暗里一阵骚动。":"（炉火猛地晃了一下）……刚才那阵风不对劲。")+"再说一次？",
      [`<span class="chip err">解析异常：${String(e.message).slice(0,60)}</span>`]);
  }
  busy=false; document.getElementById("sendBtn").disabled=false;
  document.getElementById("inp").focus();
  renderHUD(); save();
}
document.getElementById("inp").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });

/* ==================== 主循环 ==================== */
let lastLogic = performance.now();
setInterval(()=>{
  const now = performance.now();
  const dt = Math.min((now-lastLogic)/1000, 0.05);
  lastLogic = now;
  if (!dlgOpen) tickMove(dt);
  if (scene==="aia" && !dlgOpen && !titleOn && !chapterOn) tickBoar(dt);
}, 20);
function loop(t){
  const et=(t-T0)/1000;
  ctx.clearRect(0,0,1000,600);
  if (scene==="world") drawWorld(et); else if (scene==="hades") drawHades(et); else drawAia(et);
  updateHintDOM();
  requestAnimationFrame(loop);
}
(function init(){
  load();
  renderHUD();
  fetch("/api/schema").then(r=>r.json()).then(s=>{
    if(Array.isArray(s)&&s.length){ SCHEMA=s; console.log("schema 菜单：",s.length,"个意图"); }
  }).catch(()=>console.warn("schema 加载失败"));
  requestAnimationFrame(loop);
})();
window.__game={state, scene, boat, player:aiaPlayer, witch, seer, boar, interact, openDlg, closeDlg, handle,
  addItem, delItem, SPOTS:ASPOTS, HSPOTS, NPCS, setNPC:n=>{currentNPC=n;}, setScene:s=>{scene=s;}, getScene:()=>scene};
</script>
